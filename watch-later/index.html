<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>나중에 볼 영상</title>
    <meta name="description" content="유튜브 영상을 저장해 두면 정한 시간에 알려 드려요" />
    <meta name="theme-color" content="#0F0F0F" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="나중에 볼 영상" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <img class="logo" src="icons/icon.svg" alt="" width="28" height="28" />
      <h1 id="page-title">나중에 볼 영상</h1>
      <span class="spacer"></span>
      <button id="search-btn" class="icon-btn" aria-label="영상 찾기" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7" /><path d="M20 20l-4-4" /></svg>
      </button>
      <button id="profile" class="avatar-btn" aria-label="내 계정" hidden></button>
    </header>

    <main id="app">
      <p class="muted center">불러오는 중…</p>
    </main>

    <nav id="nav" class="bottom-nav" hidden>
      <a href="#/" data-page="add">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="5" /><path d="M12 8v8M8 12h8" /></svg>
        <span>영상 추가</span>
      </a>
      <a href="#/my" data-page="my">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v8a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 13.5z" /><path d="M10.5 7.2v4.6l4-2.3z" fill="#0F0F0F" /><rect x="4" y="17" width="16" height="1.8" rx=".9" /><rect x="4" y="20" width="11" height="1.8" rx=".9" /></svg>
        <span>내 영상 <b class="count" data-count></b></span>
      </a>
      <a href="#/insights" data-page="insights">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 20v-9M12 20V4M19 20v-6" /></svg>
        <span>내 관심사</span>
      </a>
    </nav>

    <dialog id="sheet" class="sheet" aria-label="자세히"></dialog>

    <div id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
