name: Deploy Archery App to GitHub Pages

on:
  push:
    branches:
      - claude/archery-growth-webapp-kmznwk
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GH_PAGES: "1"
          # 이 앱 전용 Supabase 프로젝트를 새로 만들고, 그 URL/anon key를
          # 저장소 Settings → Secrets and variables → Actions 에 아래 이름으로 등록하세요.
          # (읽어보기/배워보기 새싹책방과는 별개의 프로젝트를 써야 합니다 — HANDOFF.md 참고)
          VITE_SUPABASE_URL: ${{ secrets.ARCHERY_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.ARCHERY_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
