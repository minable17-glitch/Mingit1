name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/saesak-book-app-gsi00u
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GH_PAGES: "1"
          # Supabase의 publishable(anon) key는 공개용으로 설계된 값이라 안전하게 커밋에 포함합니다.
          # (실제 접근 제어는 데이터베이스의 Row Level Security 정책이 담당합니다.)
          VITE_SUPABASE_URL: https://ikljkokebcqaxpctcjpy.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_uXUn0fgJxfvbKdqguQ9SYg_bwhRpdJF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
