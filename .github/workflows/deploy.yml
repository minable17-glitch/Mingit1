name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/saesak-book-app-gsi00u
      - claude/game-development-approach-xupoj6
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GH_PAGES: "1"
          # Supabase의 publishable(anon) key는 공개용으로 설계된 값이라 안전하게 커밋에 포함합니다.
          # (실제 접근 제어는 데이터베이스의 Row Level Security 정책이 담당합니다.)
          VITE_SUPABASE_URL: https://ikljkokebcqaxpctcjpy.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_uXUn0fgJxfvbKdqguQ9SYg_bwhRpdJF
      # 완전히 별도 프로젝트인 좀비 런 게임을 /zombie-run/ 경로에 함께 배포 (새싹책방 빌드에는 영향 없음)
      - run: npm ci
        working-directory: zombie-run
      - run: npm run build
        working-directory: zombie-run
        env:
          GH_PAGES: "1"
          # 좀비 도로 경로 계산용 OpenRouteService 키 (Settings → Secrets and variables → Actions에 등록)
          # 없어도 빌드는 되고, 좀비가 도로 대신 직선으로 쫓아오는 것으로만 자연스럽게 대체됨
          VITE_ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
      - run: cp -r zombie-run/dist dist/zombie-run
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
