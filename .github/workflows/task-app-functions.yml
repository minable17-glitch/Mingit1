# 업무 챙김(task-app) 서버 기능을 Supabase에 올립니다. 새싹책방 배포와는 무관합니다.
# 필요한 GitHub 저장소 Secrets (Settings → Secrets and variables → Actions):
#   TASK_SUPABASE_ACCESS_TOKEN  Supabase 계정 → Access Tokens 에서 발급
#   TASK_SUPABASE_PROJECT_REF   업무 챙김용 Supabase 프로젝트 ID
#   TASK_GOOGLE_CLIENT_ID       구글 OAuth 클라이언트 ID
#   TASK_GOOGLE_CLIENT_SECRET   구글 OAuth 보안 비밀
#   TASK_CRON_SECRET, TASK_BACKUP_SECRET  (선택) 예약 작업용 아무 긴 문자열
# 배포할 때마다 supabase/install_all.sql 도 자동으로 실행합니다 (SQL Editor에 직접 붙여넣지 않아도 됨).
# 비밀값을 넣은 뒤에는 Actions 탭에서 이 작업의 마지막 실행을 열고 "Re-run all jobs" 를 누르면 됩니다.
name: 업무 챙김 서버 기능 배포

on:
  push:
    branches:
      - claude/new-session-oe1y4k
    paths:
      - task-app/supabase/**
      - .github/workflows/task-app-functions.yml
  workflow_dispatch:

concurrency:
  group: task-app-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-app
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.TASK_SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.TASK_SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: 비밀값 확인
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::TASK_SUPABASE_ACCESS_TOKEN 과 TASK_SUPABASE_PROJECT_REF 를 저장소 Secrets 에 먼저 넣어 주세요."
            exit 1
          fi
          # 안전장치: 새싹책방(운영 중) 프로젝트에는 절대 올리지 않음
          if [ "$PROJECT_REF" = "ikljkokebcqaxpctcjpy" ]; then
            echo "::error::TASK_SUPABASE_PROJECT_REF 에 새싹책방 프로젝트 ID가 들어 있습니다. 업무 챙김용 새 프로젝트 ID로 바꿔 주세요."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # 안전장치: 다른 앱(양궁 성장일지 등)의 서버 기능이 있는 프로젝트면 아무것도 바꾸지 않고 멈춤
      - name: 업무 챙김 전용 프로젝트인지 확인
        run: |
          ours="calendar-feed calendar-sync delete-account gmail-import mcp push weekly-backup widget-summary"
          if ! existing=$(supabase functions list --project-ref "$PROJECT_REF" -o json); then
            echo "::error::프로젝트의 함수 목록을 읽지 못해 안전을 위해 멈춥니다. 프로젝트 ID와 토큰을 확인하세요."
            exit 1
          fi
          others=""
          for f in $(echo "$existing" | jq -r '.[] | (.slug // .name)'); do
            case " $ours " in *" $f "*) ;; *) others="$others $f" ;; esac
          done
          if [ -n "$others" ]; then
            echo "::error::다른 앱의 서버 기능이 있는 프로젝트입니다:$others — 업무 챙김용으로 새로 만든 프로젝트 ID를 넣어 주세요. 아무것도 바꾸지 않았습니다."
            exit 1
          fi
          echo "업무 챙김 전용 프로젝트 확인됨"

      # 표·권한 설치/갱신: install_all.sql 을 Supabase 관리 API로 실행 (여러 번 실행해도 안전, 다른 앱 프로젝트면 SQL 안의 안전장치가 멈춤)
      - name: 데이터베이스 표 설치·갱신
        run: |
          body=$(jq -n --rawfile q supabase/install_all.sql '{query: $q}')
          status=$(curl -sS -o /tmp/sql.out -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" -d "$body")
          if [ "$status" -ge 300 ]; then
            echo "::error::install_all.sql 실행 실패 (HTTP $status): $(head -c 800 /tmp/sql.out)"
            exit 1
          fi
          echo "데이터베이스 표 설치·갱신 완료"

      - name: 함수용 비밀값 설정
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.TASK_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.TASK_GOOGLE_CLIENT_SECRET }}
          CRON_SECRET: ${{ secrets.TASK_CRON_SECRET }}
          BACKUP_SECRET: ${{ secrets.TASK_BACKUP_SECRET }}
        run: |
          args=()
          for name in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET CRON_SECRET BACKUP_SECRET; do
            if [ -n "${!name}" ]; then args+=("$name=${!name}"); fi
          done
          # 시간 알림 예약 작업용 비밀값: 배포할 때마다 새로 만들어 함수와 예약 작업에 같이 넣음
          REMINDER_SECRET=$(openssl rand -hex 24)
          echo "::add-mask::$REMINDER_SECRET"
          echo "REMINDER_SECRET=$REMINDER_SECRET" >> "$GITHUB_ENV"
          args+=("REMINDER_SECRET=$REMINDER_SECRET")
          supabase secrets set --project-ref "$PROJECT_REF" "${args[@]}"

      - name: 함수 배포
        run: supabase functions deploy --project-ref "$PROJECT_REF"

      # 1분마다 push 함수를 불러 시간이 된 알림을 보내게 함 (pg_cron + pg_net). 이 작업 하나만 만들거나 고침
      - name: 시간 알림 예약 작업 등록
        run: |
          SQL=$(cat <<SQLEOF
          create extension if not exists pg_cron with schema pg_catalog;
          create extension if not exists pg_net with schema extensions;
          select cron.unschedule(jobid) from cron.job where jobname = 'task-keeper-reminders';
          select cron.schedule(
            'task-keeper-reminders',
            '* * * * *',
            \$job\$ select net.http_post(
              url := 'https://${PROJECT_REF}.supabase.co/functions/v1/push',
              headers := jsonb_build_object('Content-Type', 'application/json', 'x-reminder-secret', '${REMINDER_SECRET}'),
              body := jsonb_build_object('action', 'tick')
            ) \$job\$
          );
          SQLEOF
          )
          body=$(jq -n --arg q "$SQL" '{query: $q}')
          status=$(curl -sS -o /tmp/cron.out -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" -d "$body")
          if [ "$status" -ge 300 ]; then
            echo "::error::예약 작업을 등록하지 못했습니다 (HTTP $status): $(cat /tmp/cron.out)"
            exit 1
          fi
          echo "예약 작업 등록됨"
          # 확인: 함수가 비밀값으로 잘 응답하는지
          curl -sS -X POST "https://${PROJECT_REF}.supabase.co/functions/v1/push" \
            -H "Content-Type: application/json" -H "x-reminder-secret: ${REMINDER_SECRET}" -d '{"action":"tick"}'
