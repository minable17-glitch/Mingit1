# Netlify 배포 설정 (Netlify 화면에서 Base directory 를 task-app 으로 지정하면 이 파일을 읽음)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# 서비스 워커는 항상 새로 받아야 알림 처리가 최신으로 바뀜
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"
