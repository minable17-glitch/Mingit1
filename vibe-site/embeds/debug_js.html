<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코드 고치기 — 칭찬 스티커판 (JavaScript)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16202b; --muted:#5b6b7b; --paper:#ffffff; --stage:#e7ecf1; --line:#d7dee6;
    --shop:#f76707; --srv:#0e131b; --srv-2:#1d2632; --srv-line:#2d3a49; --srv-text:#e6ecf3; --srv-dim:#7c8ba0;
    --sans:'IBM Plex Sans KR', system-ui, -apple-system, sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--stage); color:var(--ink); font-family:var(--sans);
       line-height:1.55; padding:22px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px; margin:0 auto}
  h1{font-size:24px; font-weight:600; margin:0 0 6px; letter-spacing:-.01em}
  .lede{margin:0 0 16px; color:var(--muted); font-size:15px; max-width:72ch}
  .toolbar{display:flex; align-items:center; gap:10px; margin-bottom:14px}
  .spacer{flex:1}
  .btn{font-family:var(--sans); font-size:14px; font-weight:500; padding:9px 16px; border:0;
       border-radius:10px; cursor:pointer; transition:filter .12s}
  .btn:hover{filter:brightness(.95)}
  .btn.run{background:var(--shop); color:#fff}
  .btn.ghost{background:#fff; color:var(--ink); border:1px solid var(--line)}
  .status{padding:12px 16px; border-radius:11px; font-weight:600; font-size:15px; margin-bottom:14px;
          border:1px solid; transition:background .15s, color .15s, border-color .15s; display:flex; align-items:center; gap:8px}
  .status.todo{background:#fff4e6; color:#9a3d04; border-color:#f7c9ac}
  .status.done{background:#e9f9ef; color:#116932; border-color:#abe4c1}
  .panels{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  @media (max-width:820px){ .panels{grid-template-columns:1fr} body{padding:15px} }
  .panel{display:flex; flex-direction:column; border:1px solid var(--line); border-radius:14px;
         overflow:hidden; height:72vh; min-height:500px}
  @media (max-width:820px){ .panel{height:54vh; min-height:350px} }
  .phead{display:flex; align-items:center; gap:8px; padding:11px 15px; font-weight:600; font-size:14px; flex:none}
  .phead .dot{width:10px; height:10px; border-radius:50%}
  .phead small{font-weight:400; font-size:12px}
  .pbody{flex:1; min-height:0}
  .panel.code{border-color:var(--srv-line)}
  .panel.code .phead{background:var(--srv-2); color:#eef3f8; border-bottom:1px solid var(--srv-line)}
  .panel.code .phead small{color:var(--srv-dim)}
  #editor{width:100%; height:100%; border:0; outline:0; resize:none; display:block;
          background:var(--srv); color:var(--srv-text); font-family:var(--mono); font-size:13px;
          line-height:1.6; padding:14px 16px; tab-size:2; white-space:pre; overflow:auto}
  .panel.view .phead{background:#f2f4f7; color:var(--ink); border-bottom:1px solid var(--line)}
  .panel.view .phead small{color:var(--muted)}
  #frame{width:100%; height:100%; border:0; background:#fff; display:block}
  .hint{margin-top:14px; font-size:13px; color:var(--muted); background:#fff; border:1px solid var(--line);
        border-left:4px solid var(--shop); border-radius:0 12px 12px 0; padding:12px 15px}
  .hint b{color:var(--ink)}
  kbd{font-family:var(--mono); font-size:11.5px; background:#eef1f4; border:1px solid var(--line);
      border-radius:5px; padding:1px 6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>코드 고치기 — 칭찬 스티커판</h1>
  <p class="lede">왼쪽 코드를 고치면 오른쪽 화면이 그대로 바뀝니다. 코드를 정상으로 고치면 위에 성공 표시가 떠요. <kbd>실행</kbd> 또는 <kbd>Ctrl</kbd>+<kbd>Enter</kbd>로 바로 반영, <kbd>처음으로</kbd>로 되돌리기.</p>

    <span class="spacer"></span>
    <button class="btn ghost" onclick="resetCode()">↺ 처음으로</button>

      <div class="pbody"><textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off">&lt;!DOCTYPE html&gt;

    &lt;script&gt;
        // Default Sample Student Roster
        const DEFAULT_STUDENTS = [
            "김민준", "이서연", "박도윤", "최지우", "정하은",
            "강준우", "조서현", "윤지호", "장수아", "임현우",
            "한예은", "오지훈", "서유나", "신동현", "권채원",
            "황민재", "송하윤", "류태양", "홍다은", "백우진"
        ];

        // Application State Variables
        let students = [];
        let currentSticker = '⭐';
        let isSoundEnabled = true;
        let audioCtx = null;

        // Synthesize audio without needing external mp3 files
        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // Play short cheerful pop sound when sticker added
        function playPopSound() {
            if (!isSoundEnabled) return;
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.1);

                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch (e) {
                console.log("Audio play error:", e);
            }
        }

        // Play subtle remove sound
        function playRemoveSound() {
            if (!isSoundEnabled) return;
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(250, ctx.currentTime + 0.1);

                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch (e) {
                console.log("Audio play error:", e);
            }
        }

        // Play chime sound for milestones (e.g., 5, 10, 15 stars)
        function playMilestoneFanfare() {
            if (!isSoundEnabled) return;
            try {
                const ctx = getAudioContext();
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, index) =&gt; {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    const startTime = ctx.currentTime + (index * 0.08);

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, startTime);

                    gain.gain.setValueAtTime(0.25, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.3);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(startTime);
                    osc.stop(startTime + 0.3);
                });
            } catch (e) {
                console.log("Audio play error:", e);
            }
        }

        // Load data from LocalStorage or set defaults
        function initData() {
            const savedStudents = localStorage.getItem('classroom_students_v2');
            const savedClassName = localStorage.getItem('classroom_name');

            if (savedClassName) {
                document.getElementById('classNameDisplay').innerText = savedClassName;
            }

            if (savedStudents) {
                try {
                    students = JSON.parse(savedStudents);
                } catch (e) {
                    students = createDefaultStudentObjects(DEFAULT_STUDENTS);
                }
            } else {
                students = createDefaultStudentObjects(DEFAULT_STUDENTS);
            }

            // Set current date
            const now = new Date();
            const dateStr = `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일 (${['일','월','화','수','목','금','토'][now.getDay()]})`;
            document.getElementById('currentDateDisplay').innerText = `${dateStr} | 오늘 하루도 멋지게 성장을 기록해요!`;

            renderGrid();
        }

        function createDefaultStudentObjects(nameList) {
            return nameList.map((name, idx) =&gt; ({
                id: Date.now() + idx,
                name: name.trim(),
                stars: 0
            }));
        }

        function saveData() {
            localStorage.setItem('classroom_students_v2', JSON.stringify(students));
            updateTotalStarsCount();
        }

        // Add Star to Student
        function addStar(studentId) {
            const student = students.find(s =&gt; s.id === studentId);
            if (student) {
                student.stars + 1;
                playPopSound();

                // Trigger celebration every 5 stars milestone
                if (student.stars &gt; 0 &amp;&amp; student.stars % 5 === 0) {
                    playMilestoneFanfare();
                    triggerConfetti();
                }

                saveData();
                renderStudentCard(studentId);
            }
        }

        // Remove Star from Student
        function removeStar(studentId, event) {
            if (event) event.stopPropagation(); // prevent triggering addStar
            const student = students.find(s =&gt; s.id === studentId);
            if (student &amp;&amp; student.stars &gt; 0) {
                student.stars -= 1;
                playRemoveSound();
                saveData();
                renderStudentCard(studentId);
            }
        }

        // Set Sticker Icon Symbol
        function setStickerType(type) {
            currentSticker = type;
            document.querySelectorAll('.sticker-btn').forEach(btn =&gt; {
                btn.classList.remove('bg-white', 'shadow-sm');
                btn.classList.add('hover:bg-white/60');
            });
            const activeBtn = document.getElementById(`sticker-${type}`);
            if (activeBtn) {
                activeBtn.classList.add('bg-white', 'shadow-sm');
                activeBtn.classList.remove('hover:bg-white/60');
            }
            renderGrid();
        }

        // Render All Cards
        function renderGrid() {
            const container = document.getElementById('studentGrid');
            container.innerHTML = '';

            students.forEach((student, index) =&gt; {
                const card = document.createElement('div');
                card.id = `card-${student.id}`;
                card.className = "student-card bg-white rounded-3xl p-4 shadow-sm hover:shadow-md border-2 border-slate-100 flex flex-col justify-between relative overflow-hidden";

                // Set card content
                card.innerHTML = buildCardHTML(student, index + 1);

                // Right click context menu on student card decreases star
                card.addEventListener('contextmenu', (e) =&gt; {
                    e.preventDefault();
                    removeStar(student.id, e);
                });

                container.appendChild(card);
            });

            updateTotalStarsCount();
        }

        // Helper to update individual card DOM
        function renderStudentCard(studentId) {
            const card = document.getElementById(`card-${studentId}`);
            if (!card) {
                renderGrid();
                return;
            }
            const index = students.findIndex(s =&gt; s.id === studentId);
            const student = students[index];
            card.innerHTML = buildCardHTML(student, index + 1);

            card.addEventListener('contextmenu', (e) =&gt; {
                e.preventDefault();
                removeStar(student.id, e);
            });
        }

        // Generate inner HTML for student card
        function buildCardHTML(student, number) {
            // Generate stickers elements
            let stickersHTML = '';
            for (let i = 0; i &lt; student.stars; i++) {
                stickersHTML += `&lt;span class="star-item text-lg md:text-xl"&gt;${currentSticker}&lt;/span&gt; `;
            }

            if (student.stars === 0) {
                stickersHTML = `&lt;span class="text-xs text-slate-300 font-sans italic"&gt;스티커가 비어있어요&lt;/span&gt;`;
            }

            return `
                &lt;div class="flex items-center justify-between gap-2 mb-3"&gt;
                    &lt;!-- Student Name Button (Click to add star) --&gt;
                    &lt;button onclick="addStar(${student.id})" class="flex items-center gap-2.5 bg-sky-50 hover:bg-sky-100 active:bg-sky-200 border border-sky-200 text-sky-950 px-3.5 py-2 rounded-2xl w-full text-left transition transform active:scale-95 group"&gt;
                        &lt;span class="w-6 h-6 bg-sky-200 text-sky-800 rounded-full flex items-center justify-center text-xs font-bold font-sans group-hover:bg-sky-300 transition"&gt;
                            ${number}
                        &lt;/span&gt;
                        &lt;span class="text-xl md:text-2xl font-extrabold tracking-wide"&gt;${escapeHtml(student.name)}&lt;/span&gt;
                    &lt;/button&gt;

                    &lt;!-- Star Counter Badge --&gt;
                    &lt;div class="bg-amber-100 border border-amber-200 text-amber-800 font-extrabold px-3 py-1.5 rounded-2xl text-sm md:text-base flex items-center gap-1 shadow-xs"&gt;
                        &lt;span&gt;${currentSticker}&lt;/span&gt;
                        &lt;span class="text-lg font-black text-amber-700"&gt;${student.stars}&lt;/span&gt;
                    &lt;/div&gt;
                &lt;/div&gt;

                &lt;!-- Star Display Box --&gt;
                &lt;div onclick="addStar(${student.id})" class="star-box bg-slate-50/90 border border-slate-100 rounded-2xl p-2.5 min-h-[58px] max-h-[110px] overflow-y-auto flex flex-wrap items-center gap-1 cursor-pointer hover:bg-slate-100/80 transition"&gt;
                    ${stickersHTML}
                &lt;/div&gt;

                &lt;!-- Card Quick Footer Actions --&gt;
                &lt;div class="flex items-center justify-between mt-3 pt-2 border-t border-slate-100 text-xs font-sans text-slate-400"&gt;
                    &lt;button onclick="removeStar(${student.id}, event)" title="별 1개 지우기" class="hover:text-rose-500 p-1 flex items-center gap-1 transition"&gt;
                        &lt;i class="fa-solid fa-minus-circle"&gt;&lt;/i&gt; 차감
                    &lt;/button&gt;
                    &lt;span class="text-[11px] text-slate-300"&gt;클릭: 추가 | 우클릭: 차감&lt;/span&gt;
                &lt;/div&gt;
            `;
        }

        // HTML Sanitizer helper
        function escapeHtml(str) {
            return str.replace(/&amp;/g, "&amp;amp;").replace(/&lt;/g, "&amp;lt;").replace(/&gt;/g, "&amp;gt;").replace(/"/g, "&amp;quot;").replace(/'/g, "&amp;#039;");
        }

        // Update Total Star Counter
        function updateTotalStarsCount() {
            const total = students.reduce((sum, s) =&gt; sum + s.stars, 0);
            document.getElementById('totalStarsCount').innerText = total;
        }

        // Sort Students
        function sortStudents(type) {
            if (type === 'stars') {
                students.sort((a, b) =&gt; b.stars - a.stars);
            } else {
                students.sort((a, b) =&gt; a.name.localeCompare(b.name, 'ko-KR'));
            }
            saveData();
            renderGrid();
        }

        // Reset All Stars Confirmation
        function confirmResetAll() {
            if (confirm("정말로 모든 학생의 칭찬 스티커를 0개로 초기화하시겠습니까?")) {
                students.forEach(s =&gt; s.stars = 0);
                saveData();
                renderGrid();
            }
        }

        // Edit Class Title
        function editClassName() {
            const currentName = document.getElementById('classNameDisplay').innerText;
            const newName = prompt("학급 이름을 입력해 주세요:", currentName);
            if (newName &amp;&amp; newName.trim() !== "") {
                document.getElementById('classNameDisplay').innerText = newName.trim();
                localStorage.setItem('classroom_name', newName.trim());
            }
        }

        // Open Student Roster Modal
        function openStudentModal() {
            const namesText = students.map(s =&gt; s.name).join(', ');
            document.getElementById('studentNamesInput').value = namesText;
            document.getElementById('studentModal').classList.remove('hidden');
        }

        function closeStudentModal() {
            document.getElementById('studentModal').classList.add('hidden');
        }

        function loadDefaultStudents() {
            document.getElementById('studentNamesInput').value = DEFAULT_STUDENTS.join(', ');
        }

        function saveStudentList() {
            const rawText = document.getElementById('studentNamesInput').value;
            // Split by newline or comma
            const nameArray = rawText.split(/[\n,]+/).map(n =&gt; n.trim()).filter(n =&gt; n.length &gt; 0);

            if (nameArray.length === 0) {
                alert("적어도 한 명 이상의 학생 이름을 입력해야 합니다.");
                return;
            }

            // Preserve star count for existing names if possible
            const newStudents = nameArray.map((name, idx) =&gt; {
                const existing = students.find(s =&gt; s.name === name);
                return {
                    id: existing ? existing.id : Date.now() + idx,
                    name: name,
                    stars: existing ? existing.stars : 0
                };
            });

            students = newStudents;
            saveData();
            renderGrid();
            closeStudentModal();
        }

        let isSpinning = false;

        function openRandomPicker() {
            document.getElementById('pickerName').innerText = "❓";
            document.getElementById('randomPickerModal').classList.remove('hidden');
        }

        function closeRandomPicker() {
            if (isSpinning) return;
            document.getElementById('randomPickerModal').classList.add('hidden');
        }

        function spinRandomPicker() {
            if (isSpinning || students.length === 0) return;
            isSpinning = true;

            const nameDisplay = document.getElementById('pickerName');
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.disabled = true;
            spinBtn.classList.add('opacity-50');

            let counter = 0;
            const totalSpeed = 25; // number of tick iterations
            const interval = setInterval(() =&gt; {
                const randomIndex = Math.floor(Math.random() * students.length);
                nameDisplay.innerText = students[randomIndex].name;
                playPopSound();
                counter++;

                if (counter &gt;= totalSpeed) {
                    clearInterval(interval);
                    const chosen = students[Math.floor(Math.random() * students.length)];
                    nameDisplay.innerText = chosen.name;
                    playMilestoneFanfare();
                    triggerConfetti();
                    isSpinning = false;
                    spinBtn.disabled = false;
                    spinBtn.classList.remove('opacity-50');
                }
            }, 100);
        }

        // Trigger Canvas Confetti
        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        }

        // Toggle Sound Mute
        function toggleSound() {
            isSoundEnabled = !isSoundEnabled;
            const icon = document.getElementById('soundIcon');
            if (isSoundEnabled) {
                icon.className = "fa-solid fa-volume-high text-sky-600";
            } else {
                icon.className = "fa-solid fa-volume-xmark text-slate-400";
            }
        }

        // Fullscreen Toggle Helper
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err =&gt; {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        window.onload = function() {
            initData();
        };
    &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;

    <div class="panel view">
      <div class="phead"><span class="dot" style="background:#22c55e"></span>결과 화면 <small>· 코드가 실제로 그려진 모습</small></div>
      <div class="pbody"><iframe id="frame" title="결과 미리보기"></iframe></div>
    </div>
  </div>
</div>
<script>
  const editor = document.getElementById('editor');
  const frame = document.getElementById('frame');
  const statusEl = document.getElementById('status');
  const ORIGINAL = editor.value;

  function isFixed(code){
    var c = code.replace(/\s+/g,'');
    return /student\.stars(\+=1|\+\+|=student\.stars\+1)/.test(c);
  }

  function checkStatus(){
    var ok = isFixed(editor.value);
    statusEl.className = 'status ' + (ok ? 'done' : 'todo');
    statusEl.textContent = ok ? '🎉 성공! 코드를 정상으로 고쳤어요.' : '아직이에요 — 코드를 더 고쳐 보세요!';
  }
  function run(){ frame.srcdoc = editor.value; checkStatus(); }
  function resetCode(){ editor.value = ORIGINAL; run(); }

  let timer;
  editor.addEventListener('input', function(){
    checkStatus();
    clearTimeout(timer); timer = setTimeout(run, 600);
  });
  editor.addEventListener('keydown', function(e){
    if(e.key === 'Tab'){
      e.preventDefault();
      const s = editor.selectionStart, en = editor.selectionEnd;
      editor.value = editor.value.slice(0,s) + '  ' + editor.value.slice(en);
      editor.selectionStart = editor.selectionEnd = s + 2;
    }
    if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); run(); }
  });
  run();
</script>
