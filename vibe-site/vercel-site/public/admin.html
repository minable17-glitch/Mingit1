<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#121418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>html{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>바이브 코딩 연수(체육)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style id="css">
/* Layout concept: dark halftone banner (like the reference Google Site), left page tree, single reading column; editors get an inline edit mode that republishes the page. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --fg:#14171c; --muted:#596070; --line:#dde0e7; --soft:#eceef3;
  --accent:#e5393a; --accent-fg:#ffffff; --accent-text:#c42a2b;
  --hero:#121418; --hero-fg:#ffffff; --hero-mute:#a7adb9;
  --tip-bg:#e6f4ec; --tip-fg:#14522f; --warn-bg:#fdf0d8; --warn-fg:#6a4300; --info-bg:#e3edfb; --info-fg:#17407a;
  --ok:#1b7f48; --bad:#c42a2b;
  --font-display:'Black Han Sans','Noto Sans KR',system-ui,sans-serif;
  --font-body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1013; --surface:#171a1f; --fg:#e9ecf1; --muted:#98a0ad; --line:#2a2f37; --soft:#1f242b;
    --accent:#ff5b59; --accent-fg:#1a0b0b; --accent-text:#ff7b79;
    --hero:#0a0b0d; --hero-fg:#ffffff; --hero-mute:#98a0ad;
    --tip-bg:#13301f; --tip-fg:#9fdcb7; --warn-bg:#3a2a0a; --warn-fg:#f1cd8a; --info-bg:#142b4d; --info-fg:#a9c8f5;
    --ok:#5ccf8f; --bad:#ff7b79;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1013; --surface:#171a1f; --fg:#e9ecf1; --muted:#98a0ad; --line:#2a2f37; --soft:#1f242b;
  --accent:#ff5b59; --accent-fg:#1a0b0b; --accent-text:#ff7b79;
  --hero:#0a0b0d; --hero-fg:#ffffff; --hero-mute:#98a0ad;
  --tip-bg:#13301f; --tip-fg:#9fdcb7; --warn-bg:#3a2a0a; --warn-fg:#f1cd8a; --info-bg:#142b4d; --info-fg:#a9c8f5;
  --ok:#5ccf8f; --bad:#ff7b79;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--hero)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--hero);color:var(--hero-fg)}
.top .wrap{display:flex;align-items:center;gap:12px;height:56px}
.burger{display:none;background:none;border:0;color:inherit;font-size:24px;line-height:1;padding:6px 8px;cursor:pointer}
.brand{font-weight:700;font-size:1.05rem;text-decoration:none;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-edit{background:transparent;border:1px solid var(--hero-mute);color:var(--hero-fg);border-radius:999px;padding:4px 14px;font-size:.9rem;cursor:pointer}
.top-edit[disabled]{border-color:var(--accent);color:var(--accent);cursor:default}

/* banner */
.banner{background-color:var(--hero);background-image:radial-gradient(rgba(255,255,255,.1) 1.2px,transparent 1.5px);background-size:7px 7px;color:var(--hero-fg);text-align:center}
.banner .wrap{padding-top:44px;padding-bottom:40px}
.banner h1{font-family:var(--font-display);font-weight:400;font-size:clamp(2.3rem,7vw,3.8rem);line-height:1.15;margin:0 0 18px;text-wrap:balance}
.banner .bar{height:8px;background:var(--accent);max-width:560px;margin:0 auto}
.banner .desc{color:var(--hero-mute);margin:16px auto 0;max-width:620px}

/* shell */
.shell{display:grid;grid-template-columns:262px minmax(0,1fr);gap:36px;padding-top:28px;padding-bottom:110px}
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);align-self:start;max-height:calc(100vh - 96px);overflow:auto;padding-right:4px}
.nav-row{display:flex;align-items:center;gap:4px}
.nav-caret{flex:none;width:28px;height:28px;border:0;border-radius:7px;background:transparent;color:var(--muted);cursor:pointer;position:relative}
.nav-caret:hover{background:var(--soft)}
.nav-caret::before{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translate(-65%,-50%) rotate(-45deg);transition:transform .15s}
.nav-caret.open::before{transform:translate(-50%,-70%) rotate(45deg)}
.nav a{display:block;flex:1;min-width:0;text-decoration:none;border-radius:8px;padding:7px 12px;color:var(--fg)}
.nav a:hover{background:var(--soft)}
.nav a.nav-top{font-weight:700;margin-top:6px}
.nav a.nav-sub{padding-left:26px;color:var(--muted);font-size:.95rem;padding-top:5px;padding-bottom:5px}
.nav a.nav-sub2{padding-left:44px;font-size:.9rem}
.nav a.nav-sub3{padding-left:62px;font-size:.86rem}
.tbox{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.tbox.soft{background:var(--soft);border-color:transparent}
.tbox.accent{border:2px solid var(--accent)}
.tbox .tt{font-weight:800;font-size:1.05rem}
.fold{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.fold>summary{cursor:pointer;list-style:none;padding:13px 16px;font-weight:700;display:flex;gap:10px;align-items:center}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"▸";color:var(--accent-text);transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .hint{margin-left:auto;color:var(--muted);font-weight:400;font-size:.85rem}
.fold[open]>summary .hint{display:none}
.fold>.fb{padding:0 16px 16px 16px}
.fold>.fb .codebox{margin-top:2px}
.nav a.on{background:var(--soft);color:var(--accent-text);font-weight:700}
.mv{display:flex;gap:2px}
.mvb{background:var(--surface);border:1px solid var(--line);border-radius:6px;width:26px;height:26px;cursor:pointer;line-height:1;font-size:13px}
.scrim{display:none}
.addpage{margin-top:18px;padding:12px;border:1px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;gap:8px;font-size:.92rem}

/* document */
.main{min-width:0}
.doc{max-width:760px;display:flex;flex-direction:column;gap:22px}
/* hands-on labs (code | result side by side) get the whole column width */
.doc:has(.lab){max-width:none}.doc:has(.lab)>.blk:not(:has(.lab)){max-width:760px;width:100%}
.doc h2{font-size:1.55rem;line-height:1.35;margin:18px 0 0;font-weight:800;text-wrap:balance;padding-left:12px;border-left:5px solid var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;counter-reset:cd}
.cards.c2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card b{font-size:1.02rem;line-height:1.45}
.card .cb{color:var(--muted);font-size:.95rem;line-height:1.65}
.cards.num .card b::before{counter-increment:cd;content:counter(cd);display:inline-grid;place-items:center;width:1.6em;height:1.6em;margin-right:8px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:.8rem;vertical-align:1px}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.gallery.c2{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.gallery figure{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.gallery .frame{height:260px;background:var(--soft);border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;overflow:hidden;padding:8px}
.gallery img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.gallery figcaption{color:var(--muted);font-size:.88rem;line-height:1.5;text-align:center}
.mvb.del{color:var(--bad)}
.para{margin:0}
.doc code,.para code{font-family:var(--font-mono);font-size:.9em;background:var(--soft);padding:1px 6px;border-radius:5px}
.tag{display:inline-block;border:1px solid var(--accent);color:var(--accent-text);border-radius:999px;font-size:.82rem;padding:1px 12px;margin-bottom:14px}
.note{padding:14px 18px;border-radius:12px}
.note.tip{background:var(--tip-bg);color:var(--tip-fg)}
.note.warn{background:var(--warn-bg);color:var(--warn-fg)}
.note.info{background:var(--info-bg);color:var(--info-fg)}
.note b.chip{display:inline-block;font-size:.78rem;letter-spacing:.06em;border:1px solid currentColor;border-radius:999px;padding:0 9px;margin-right:8px;font-weight:700}

.steps{display:flex;flex-direction:column;gap:8px;counter-reset:st}
.steps details{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.steps summary{cursor:pointer;list-style:none;padding:13px 16px;font-weight:700;display:flex;gap:12px;align-items:baseline}
.steps summary::-webkit-details-marker{display:none}
.steps summary::before{counter-increment:st;content:counter(st);font-family:var(--font-mono);color:var(--accent-text);min-width:1.4em}
.steps summary::after{content:"+";margin-left:auto;color:var(--muted);font-weight:400}
.steps details[open] summary::after{content:"–"}
.steps .body{padding:0 16px 16px 50px;color:var(--fg)}

.codebox{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.codebox .hd{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--soft);font-size:.88rem;color:var(--muted)}
.codebox .hd span{flex:1;min-width:0}
.codebox pre{margin:0;padding:14px 16px;overflow-x:auto;font-family:var(--font-mono);font-size:.88rem;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:.92rem;text-decoration:none}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.small{padding:2px 10px;font-size:.85rem}
.btn[disabled]{opacity:.5;cursor:default}

.lab{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lab .hd{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;background:var(--soft)}
.lab .hd b{flex:1;min-width:8em}
.lab iframe{display:block;width:100%;border:0;background:#fff}
.lab .src{padding:12px;border-top:1px solid var(--line)}
.lab textarea{width:100%;min-height:240px}
.lab .foot{font-size:.85rem;color:var(--muted);margin-top:6px}
.lab-fail{padding:12px 16px;background:var(--warn-bg);color:var(--warn-fg);font-size:.92rem}

.quiz{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.quiz .q{margin:0;font-weight:700}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 14px;cursor:pointer}
.opt:hover:not([disabled]){background:var(--soft)}
.opt.right{border-color:var(--ok);background:var(--tip-bg);color:var(--tip-fg)}
.opt.wrong{border-color:var(--bad);background:var(--warn-bg);color:var(--warn-fg)}
.q-res{font-size:.95rem}

.links{display:flex;flex-wrap:wrap;gap:8px}
.embedbox{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.embedbox .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:var(--soft)}
.embed-frame{display:block;width:100%;border:0;background:#fff}
.figure{margin:0}
.figure img{display:block;max-width:100%;height:auto;margin:0 auto;border-radius:12px;border:1px solid var(--line)}
.figure figcaption{color:var(--muted);font-size:.9rem;margin-top:6px;text-align:center}
.hr{border:0;border-top:1px solid var(--line);margin:6px 0;width:100%}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.nav a.is-hidden{opacity:.55}
.foot-admin{text-align:right;padding-bottom:28px;font-size:.85rem}
.foot-admin a{color:var(--muted)}
.dlg-back{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--surface);color:var(--fg);border-radius:14px;padding:20px;width:min(460px,100%);max-height:85vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dlg h3{margin:0;font-size:1.2rem}
.dlg form{display:flex;flex-direction:column;gap:10px}
.hist{display:flex;flex-direction:column;gap:8px}
.hist-row{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.hist-row small{color:var(--muted)}
.chk{display:flex;align-items:center;gap:8px}
.gbox{min-height:44px}
.top .wrap{position:relative}
.top-actions{flex-wrap:nowrap!important}
.top-more{display:none!important;font-size:1.2rem;line-height:1;padding:4px 12px!important}
.top-menu{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:52px;z-index:80;min-width:200px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.22);display:flex;flex-direction:column;overflow:hidden}
.top-menu button{background:none;border:0;border-bottom:1px solid var(--line);padding:13px 16px;text-align:left;font-size:1rem;cursor:pointer;color:inherit}
.top-menu button:last-child{border-bottom:0}.top-menu button:hover{background:var(--soft)}.top-menu .danger{color:var(--bad)}
.top-install{white-space:nowrap}
.ebtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ebtns .ic{min-width:40px;justify-content:center}
@media (max-width:860px){
  .top-wide{display:none!important}
  .top-more{display:inline-flex!important}
  .top .wrap{gap:8px}
  .editbar{padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .editbar .in{gap:6px}
  .editbar .st{flex-basis:100%;font-size:.84rem;line-height:1.4}
  .ebtns{flex-wrap:nowrap;width:100%;overflow-x:auto;scrollbar-width:none}
  .ebtns::-webkit-scrollbar{display:none}
  .ebtns .btn{padding:7px 10px;flex:0 0 auto}
  .ebtns .lbl{display:none}
  .ebtns .grow{margin-left:auto}
}
.flist{margin:4px 0;padding-left:1.4em}.flist li{margin:2px 0}
mark{background:#fff1a8;color:#3a2f00;padding:0 3px;border-radius:3px}
/* {빨강:글자} {크게:글자} text colors and sizes */
:root{--fc-red:#d42a20;--fc-blue:#1c5bd0;--fc-green:#12804a;--fc-orange:#d4520a;--fc-purple:#7034e0;--fc-gray:#6b7280}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--fc-red:#ff7a70;--fc-blue:#7fb0ff;--fc-green:#5fd497;--fc-orange:#ffa266;--fc-purple:#b998ff;--fc-gray:#a3aab6}}
.fc-red{color:var(--fc-red)}.fc-blue{color:var(--fc-blue)}.fc-green{color:var(--fc-green)}.fc-orange{color:var(--fc-orange)}.fc-purple{color:var(--fc-purple)}.fc-gray{color:var(--fc-gray)}
.fs-sm{font-size:.86em}.fs-lg{font-size:1.25em;line-height:1.45}.fs-xl{font-size:1.6em;line-height:1.35;font-weight:700}
.bg-yellow{background:#fff1a8;color:#3a2f00;padding:0 3px;border-radius:3px}
.para.pfs-sm{font-size:.92rem}.para.pfs-lg{font-size:1.15rem}.para.pfs-xl{font-size:1.35rem;line-height:1.6}
/* editor formatting toolbar */
.fbar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:5px;border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;background:var(--soft)}
.fbar+textarea{border-top-left-radius:0;border-top-right-radius:0}
.fbar button{min-width:30px;height:30px;padding:0 7px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--fg);font:inherit;font-size:.86rem;cursor:pointer;line-height:1}
.fbar button:hover{background:var(--surface);border-color:var(--line)}
.fbar .sep{width:1px;height:20px;background:var(--line);margin:0 3px}
.fbar .sw{width:22px;height:22px;min-width:22px;padding:0;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.fpv{margin-top:6px;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;background:var(--surface);font-size:.95rem}
.fpv>small{display:block;color:var(--muted);font-size:.75rem;margin-bottom:4px}
.fld.rich{display:flex;flex-direction:column;gap:4px}
.ptbox{display:inline-flex;align-items:center;gap:3px;white-space:nowrap;flex:none}.fbar .ptbox button{min-width:auto;white-space:nowrap}.ptl{font-size:.8rem;color:var(--muted)}
.ptin{width:56px;height:30px;padding:0 6px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--fg);font:inherit;font-size:.9rem}
.fbar .ptbox button{border-color:var(--line);background:var(--surface)}
.para a,.tbox a,.card a,.note a,.fold a,.col a,.site-foot a{color:var(--accent-text);text-decoration:underline}
.doc h3{font-size:1.2rem;line-height:1.4;margin:6px 0 0;font-weight:800}
.al-c{text-align:center}.al-c .flist{display:inline-block;text-align:left}
.toc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.toc b{display:block;margin-bottom:6px}
.toc a{display:block;padding:4px 0;color:var(--fg);text-decoration:none;border-bottom:1px dashed var(--line)}
.toc a:last-child{border-bottom:0}.toc a.sub{padding-left:18px;color:var(--muted);font-size:.95rem}.toc a:hover{color:var(--accent-text)}
.carousel{position:relative;border-radius:12px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}
.carousel .ctrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.carousel .ctrack::-webkit-scrollbar{display:none}
.carousel figure{flex:0 0 100%;scroll-snap-align:start;margin:0;display:flex;flex-direction:column;min-width:0}
.carousel .frame{height:min(60vw,440px);display:grid;place-items:center;padding:10px}
.carousel img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.carousel figcaption{padding:2px 16px 4px;text-align:center;color:var(--muted);font-size:.92rem}
.carousel .cnav{position:absolute;top:calc(min(60vw,440px)/2);transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:1.3rem;cursor:pointer}
.carousel .cprev{left:8px}.carousel .cnext{right:8px}
.cdots{display:flex;justify-content:center;gap:7px;padding:6px 0 12px}
.cdots button{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:var(--line);cursor:pointer}
.cdots button.on{background:var(--accent)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:18px}
.cols.c2{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.col img{width:100%;height:190px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.col .ct{font-weight:800;font-size:1.08rem}
.figure a{display:block}
.site-notice{background:var(--accent);color:var(--accent-fg)}
.site-notice .wrap{display:flex;gap:12px;align-items:center;padding-top:9px;padding-bottom:9px;font-size:.95rem}
.site-notice a{color:inherit;font-weight:700;text-decoration:underline;white-space:nowrap}

function pageText(p){
  var out=[p.title,p.desc,p.tag];
  (p.blocks||[]).forEach(function(b){
    out.push(b.text,b.title,b.label,b.q,b.caption);
    (b.items||[]).forEach(function(it){out.push(it.title,it.body,it.label,it.caption,it.text);});
    (b.opts||[]).forEach(function(o){out.push(o);});
  });
  return out.filter(Boolean).join(' \n ');
}
function renderSearch(){
  var q=S.q.toLowerCase(), hits=[];

/* Drag and drop with pointer events (mouse and touch). hit(x,y) -> {el,pos,tip} or null; drop(target) applies it. */
function startDrag(e,label,src,hit,drop,scroller){
  if(e.button>0) return;
  e.preventDefault();
  var x0=e.clientX,y0=e.clientY, d={x:x0,y:y0,t:null,on:false}, ghost, line, raf;
  function begin(){
    d.on=true; ghost=el('div',{class:'drag-ghost'},label); line=el('div',{class:'drop-line',hidden:true});
    document.body.append(ghost,line); document.body.classList.add('dragging'); if(src) src.classList.add('drag-src'); tick();
  }
  function place(){
    ghost.style.transform='translate('+(d.x+16)+'px,'+(d.y+18)+'px)';
    d.t=hit(d.x,d.y);
    if(!d.t){line.hidden=true;return;}
    var r=d.t.el.getBoundingClientRect(); line.hidden=false; line.textContent='';
    line.className='drop-line'+(d.t.pos==='in'?' in':'');
    if(d.t.pos==='in') line.style.cssText='left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;height:'+r.height+'px';
    else line.style.cssText='left:'+r.left+'px;top:'+((d.t.pos==='before'?r.top:r.bottom)-2)+'px;width:'+r.width+'px;height:4px';
    if(d.t.tip) line.append(el('span',{class:'dl-tip'},d.t.tip));
  }
  function tick(){
    var m=56, v=0;
    if(scroller&&scroller.scrollHeight>scroller.clientHeight){
      var r=scroller.getBoundingClientRect();
      if(d.y<r.top+m) v=-10; else if(d.y>r.bottom-m) v=10;
      if(v) scroller.scrollTop+=v;
    }
    if(!v){ if(d.y<m) v=-14; else if(d.y>innerHeight-m) v=14; if(v) window.scrollBy(0,v); }
    if(v) place();
    raf=requestAnimationFrame(tick);
  }
  function move(ev){
    d.x=ev.clientX; d.y=ev.clientY;
    if(!d.on){ if(Math.abs(d.x-x0)+Math.abs(d.y-y0)<6) return; begin(); }
    ev.preventDefault(); place();
  }
  function end(ev){
    window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',end);
    window.removeEventListener('pointercancel',end); window.removeEventListener('keydown',key);
    if(!d.on) return;
    cancelAnimationFrame(raf); ghost.remove(); line.remove(); document.body.classList.remove('dragging'); if(src) src.classList.remove('drag-src');
    if(ev&&ev.type==='pointerup'&&d.t) drop(d.t);
  }
  function key(ev){if(ev.key==='Escape'){d.t=null;end(null);}}
  window.addEventListener('pointermove',move,{passive:false}); window.addEventListener('pointerup',end);
  window.addEventListener('pointercancel',end); window.addEventListener('keydown',key);
}
function dragBlock(e,p,i,w){
  startDrag(e,'↕ '+((TYPES.filter(function(x){return x[0]===p.blocks[i].t;})[0]||['','블록'])[1]),w,function(x,y){
    var rows=[].slice.call(mainEl.querySelectorAll('.doc > .blk')); if(!rows.length) return null;
    for(var k=0;k<rows.length;k++){var r=rows[k].getBoundingClientRect(); if(y<r.top+r.height/2) return {el:rows[k],pos:'before',k:k};}
    return {el:rows[rows.length-1],pos:'after',k:rows.length};
  },function(t){
    var k=t.k; if(k===i||k===i+1) return;
    var b=p.blocks.splice(i,1)[0]; if(k>i) k--; p.blocks.splice(k,0,b);
    S.eb=null; S.ins=null; touch(); renderMain();
  });
}
function subH(p){var h=0;kids(p.id).forEach(function(c){h=Math.max(h,1+subH(c));});return h;}
function dragPage(e,p,row){
  var h=subH(p);
  startDrag(e,'↕ '+p.title,row,function(x,y){
    var rows=[].slice.call(navList.querySelectorAll('.nav-row[data-id]')), best=null;
    for(var k=0;k<rows.length;k++){var r=rows[k].getBoundingClientRect(); if(y>=r.top&&y<r.bottom){best=rows[k];break;}}
    if(!best){
      if(!rows.length) return null;
      var last=rows[rows.length-1], lr=last.getBoundingClientRect();
      if(y<lr.bottom) return null;
      best=last; y=lr.bottom-1;
    }
    var t=byId(best.getAttribute('data-id')); if(!t||t===p||under(t,p)) return null;
    var r=best.getBoundingClientRect(), f=(y-r.top)/r.height;
    var pos=f<.3?'before':f>.7?'after':'in';
    if(t.id==='home'){ if(pos!=='after') return null; }
    if(pos==='in'&&depth(t)+1+h>3) pos=f<.5?'before':'after';
    if(pos!=='in'&&depth(t)+h>3) return null;
    if(pos==='before'&&t.id==='home') return null;
    return {el:best,pos:pos,page:t,tip:pos==='in'?'“'+t.title+'” 아래로':null};
  },function(t){
    var arr=data.pages, tp=t.page;
    arr.splice(arr.indexOf(p),1);
    if(t.pos==='in'){p.parent=tp.id; arr.push(p);}
    else{p.parent=tp.parent||null; var k=arr.indexOf(tp); arr.splice(t.pos==='before'?k:k+1,0,p);}
    touch(); renderNav(); renderMain();
  },navEl);
}

function readAsDataURL(blob){return new Promise(function(ok,no){var r=new FileReader();r.onload=function(){ok(r.result);};r.onerror=function(){no(new Error('사진을 읽지 못했어요.'));};r.readAsDataURL(blob);});}
function shrink(file){
  if(file.type==='image/gif') return readAsDataURL(file);
  return readAsDataURL(file).then(function(url){return new Promise(function(ok,no){
    var im=new Image();
    im.onload=function(){
      var k=Math.min(1,1600/Math.max(im.width,im.height)), c=document.createElement('canvas');
      c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      var out=c.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',0.85);
      if(out.length>4000000) out=c.toDataURL('image/jpeg',0.85);
      ok(out);
    };
    im.onerror=function(){no(new Error('사진을 읽지 못했어요.'));};
    im.src=url;
  });});
}
function uploadImage(file){
  return shrink(file).then(function(url){
    if(!S.admin) return url; // no upload server (artifact): keep the picture inside the page data
    var m=/^data:(image\/[a-z]+);base64,(.*)$/.exec(url);
    if(!m) throw new Error('이 사진 형식은 올릴 수 없어요.');
    return api({action:'upload',type:m[1],base64:m[2]}).then(function(r){PREVIEW[r.src]=url;return r.src;});
  });
}

function save(){
  if(S.saving) return;

    S.saving=true; say('저장하는 중이에요…');
    api({action:'save',data:data,baseRev:data.rev||0}).then(function(r){
      data.rev=r.rev; data.updated=r.updated; orig=JSON.stringify(data); S.dirty=false; S.saving=false;
      say('저장했어요. 1~2분 뒤 모든 사람 화면에 반영돼요.');
    },function(e){
      S.saving=false;
      if(e.code==='conflict') say('다른 곳에서 먼저 저장한 내용이 있어요. 고친 내용을 따로 복사해 두고 새로고침한 뒤 다시 고쳐 주세요.',true);
      else if(e.code==='auth'){say('로그인이 끝났어요. 다시 로그인한 뒤 “저장하고 게시”를 누르세요.',true);S.token=null;store('vc-admin',null);showLogin();}
      else say(e.message||'저장하지 못했어요. 잠시 뒤 다시 눌러 주세요.',true);
    });
    return;
  }
  if(!S.ns) return;
  S.saving=true; say('저장하는 중이에요…');

    S.saving=false; var c=e&&e.code;

    else if(c==='not_granted'||c==='not_writer') say('이 페이지를 저장할 권한이 없어요.',true);
    else say('저장하지 못했어요. 잠시 뒤 다시 눌러 주세요.',true);
  });
