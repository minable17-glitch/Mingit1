ns hidden md:block\"&gt;\n                💡 &lt;span class=\"font-bold\"&gt;팁:&lt;/span&gt; 이름 버튼을 클릭하면 별 1개가 추가되고, 마우스 우클릭으로 1개 지울 수 있어요!\n            &lt;/div&gt;\n        &lt;/div&gt;\n\n        &lt;!-- Sorting &amp; Quick Action Controls --&gt;\n        &lt;div class=\"flex items-center gap-2 w-full sm:w-auto justify-end\"&gt;\n            &lt;button onclick=\"sortStudents('default')\" class=\"px-3 py-1.5 bg-white border border-slate-200 hover:bg-slate-50 rounded-xl text-xs sm:text-sm font-bold text-slate-600 transition\"&gt;\n                번호순\n            &lt;/button&gt;\n            &lt;button onclick=\"sortStudents('stars')\" class=\"px-3 py-1.5 bg-white border border-slate-200 hover:bg-slate-50 rounded-xl text-xs sm:text-sm font-bold text-slate-600 transition\"&gt;\n                ⭐ 칭찬순\n            &lt;/button&gt;\n            &lt;button onclick=\"confirmResetAll()\" class=\"px-3 py-1.5 bg-rose-50 border border-rose-200 hover:bg-rose-100 rounded-xl text-xs sm:text-sm font-bold text-rose-600 transition flex items-center gap-1\"&gt;\n                &lt;i class=\"fa-solid fa-rotate-right\"&gt;&lt;/i&gt;\n                전체 초기화\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n\n    &lt;!-- Main Student Roster Grid --&gt;\n    &lt;main class=\"max-w-7xl mx-auto w-full flex-1\"&gt;\n        &lt;div id=\"studentGrid\" class=\"grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3.5 md:gap-4 pb-6\"&gt;\n            &lt;!-- Dynamic Student Cards will be injected here via JavaScript --&gt;\n        &lt;/div&gt;\n    &lt;/main&gt;\n\n    &lt;!-- Student Roster Edit Modal --&gt;\n    &lt;div id=\"studentModal\" class=\"fixed inset-0 bg-slate-900/50 backdrop-blur-custom z-50 hidden flex items-center justify-center p-4\"&gt;\n        &lt;div class=\"bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border-4 border-sky-200 transform transition-all\"&gt;\n            &lt;div class=\"flex items-center justify-between border-b pb-3 mb-4\"&gt;\n                &lt;h3 class=\"text-xl font-bold text-sky-900 flex items-center gap-2\"&gt;\n                    &lt;i class=\"fa-solid fa-user-pen text-sky-500\"&gt;&lt;/i&gt; 우리 반 학생 명단 수정\n                &lt;/h3&gt;\n                &lt;button onclick=\"closeStudentModal()\" class=\"text-slate-400 hover:text-slate-600 text-xl font-bold p-1\"&gt;\n                    &lt;i class=\"fa-solid fa-xmark\"&gt;&lt;/i&gt;\n                &lt;/button&gt;\n            &lt;/div&gt;\n\n            &lt;p class=\"text-xs text-slate-500 mb-3 font-sans leading-relaxed\"&gt;\n                학생 이름을 쉼표(,)나 줄바꿈(엔터)으로 구분해서 입력해 주세요.&lt;br&gt;예: 김철수, 이영희, 박민수, 정수현\n            &lt;/p&gt;\n\n            &lt;textarea id=\"studentNamesInput\" rows=\"8\" class=\"w-full p-3.5 border-2 border-slate-200 rounded-2xl focus:border-sky-500 focus:outline-none text-slate-700 font-sans text-sm leading-relaxed mb-4 resize-none\" placeholder=\"학생 이름을 입력하세요...\"&gt;&lt;/textarea&gt;\n\n            &lt;div class=\"flex items-center justify-between gap-3\"&gt;\n                &lt;button onclick=\"loadDefaultStudents()\" class=\"px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl font-bold text-xs sm:text-sm transition\"&gt;\n                    샘플 목록 불러오기\n                &lt;/button&gt;\n                &lt;div class=\"flex gap-2\"&gt;\n                    &lt;button onclick=\"closeStudentModal()\" class=\"px-4 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl font-bold text-sm transition\"&gt;\n                        취소\n                    &lt;/button&gt;\n                    &lt;button onclick=\"saveStudentList()\" class=\"px-5 py-2.5 bg-sky-500 hover:bg-sky-600 text-white rounded-xl font-bold text-sm shadow-md transition\"&gt;\n                        저장하기\n                    &lt;/button&gt;\n                &lt;/div&gt;\n            &lt;/div&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n\n    &lt;!-- Random Student Picker Modal --&gt;\n    &lt;div id=\"randomPickerModal\" class=\"fixed inset-0 bg-slate-900/60 backdrop-blur-custom z-50 hidden flex items-center justify-center p-4\"&gt;\n        &lt;div class=\"bg-white rounded-3xl max-w-md w-full p-8 shadow-2xl border-4 border-purple-200 text-center transform transition-all relative overflow-hidden\"&gt;\n\n            &lt;div class=\"absolute -top-12 -right-12 w-32 h-32 bg-purple-100 rounded-full blur-xl pointer-events-none\"&gt;&lt;/div&gt;\n\n            &lt;h3 class=\"text-2xl font-extrabold text-purple-900 mb-2 flex items-center justify-center gap-2\"&gt;\n                &lt;i class=\"fa-solid fa-wand-magic-sparkles text-purple-500\"&gt;&lt;/i&gt; 오늘의 행운아 추첨!\n            &lt;/h3&gt;\n            &lt;p class=\"text-xs text-slate-500 mb-6 font-sans\"&gt;누가 발표하게 될까요?&lt;/p&gt;\n\n            &lt;!-- Display Box for Chosen Student --&gt;\n            &lt;div id=\"pickerDisplay\" class=\"bg-gradient-to-br from-purple-50 to-indigo-50 border-4 border-purple-200 rounded-3xl h-36 flex items-center justify-center mb-6 shadow-inner relative\"&gt;\n                &lt;span id=\"pickerName\" class=\"text-4xl md:text-5xl font-black text-purple-800 tracking-wider\"&gt;\n                    ❓\n                &lt;/span&gt;\n            &lt;/div&gt;\n\n            &lt;!-- Action Buttons for Picker --&gt;\n            &lt;div class=\"flex items-center justify-center gap-3\"&gt;\n                &lt;button id=\"spinBtn\" onclick=\"spinRandomPicker()\" class=\"w-full py-3.5 bg-gradient-to-r from-purple-500 to-indigo-600 hover:from-purple-600 hover:to-indigo-700 text-white rounded-2xl font-extrabold text-lg shadow-lg hover:shadow-xl transition transform active:scale-95 flex items-center justify-center gap-2\"&gt;\n                    &lt;i class=\"fa-solid fa-rotate text-amber-300\"&gt;&lt;/i&gt; 추첨 시작!\n                &lt;/button&gt;\n                &lt;button onclick=\"closeRandomPicker()\" class=\"py-3.5 px-5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-2xl font-bold text-base transition\"&gt;\n                    닫기\n                &lt;/button&gt;\n            &lt;/div&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n\n    &lt;!-- Footer --&gt;\n    &lt;footer class=\"mt-6 text-center text-xs text-slate-400 font-sans py-2\"&gt;\n        교실 TV 및 전자칠판용 칭찬 스티커 프로그램 | 데이터는 브라우저에 자동으로 안전하게 저장됩니다.\n    &lt;/footer&gt;\n\n    &lt;script&gt;\n        // Default Sample Student Roster\n        const DEFAULT_STUDENTS = [\n            \"김민준\", \"이서연\", \"박도윤\", \"최지우\", \"정하은\",\n            \"강준우\", \"조서현\", \"윤지호\", \"장수아\", \"임현우\",\n            \"한예은\", \"오지훈\", \"서유나\", \"신동현\", \"권채원\",\n            \"황민재\", \"송하윤\", \"류태양\", \"홍다은\", \"백우진\"\n        ];\n\n        // Application State Variables\n        let students = [];\n        let currentSticker = '⭐';\n        let isSoundEnabled = true;\n        let audioCtx = null;\n\n        // Synthesize audio without needing external mp3 files\n        function getAudioContext() {\n            if (!audioCtx) {\n                const AudioContext = window.AudioContext || window.webkitAudioContext;\n                audioCtx = new AudioContext();\n            }\n            if (audioCtx.state === 'suspended') {\n                audioCtx.resume();\n            }\n            return audioCtx;\n        }\n\n        // Play short cheerful pop sound when sticker added\n        function playPopSound() {\n            if (!isSoundEnabled) return;\n            try {\n                const ctx = getAudioContext();\n                const osc = ctx.createOscillator();\n                const gain = ctx.createGain();\n\n                osc.type = 'sine';\n                osc.frequency.setValueAtTime(450, ctx.currentTime);\n                osc.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.1);\n\n                gain.gain.setValueAtTime(0.3, ctx.currentTime);\n                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);\n\n                osc.connect(gain);\n                gain.connect(ctx.destination);\n\n                osc.start();\n                osc.stop(ctx.currentTime + 0.1);\n            } catch (e) {\n                console.log(\"Audio play error:\", e);\n            }\n        }\n\n        // Play subtle remove sound\n        function playRemoveSound() {\n            if (!isSoundEnabled) return;\n            try {\n                const ctx = getAudioContext();\n                const osc = ctx.createOscillator();\n                const gain = ctx.createGain();\n\n                osc.type = 'sine';\n                osc.frequency.setValueAtTime(500, ctx.currentTime);\n                osc.frequency.exponentialRampToValueAtTime(250, ctx.currentTime + 0.1);\n\n                gain.gain.setValueAtTime(0.2, ctx.currentTime);\n                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);\n\n                osc.connect(gain);\n                gain.connect(ctx.destination);\n\n                osc.start();\n                osc.stop(ctx.currentTime + 0.1);\n            } catch (e) {\n                console.log(\"Audio play error:\", e);\n            }\n        }\n\n        // Play chime sound for milestones (e.g., 5, 10, 15 stars)\n        function playMilestoneFanfare() {\n            if (!isSoundEnabled) return;\n            try {\n                const ctx = getAudioContext();\n                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6\n                notes.forEach((freq, index) =&gt; {\n                    const osc = ctx.createOscillator();\n                    const gain = ctx.createGain();\n                    const startTime = ctx.currentTime + (index * 0.08);\n\n                    osc.type = 'triangle';\n                    osc.frequency.setValueAtTime(freq, startTime);\n\n                    gain.gain.setValueAtTime(0.25, startTime);\n                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.3);\n\n                    osc.connect(gain);\n                    gain.connect(ctx.destination);\n\n                    osc.start(startTime);\n                    osc.stop(startTime + 0.3);\n                });\n            } catch (e) {\n                console.log(\"Audio play error:\", e);\n            }\n        }\n\n        // Load data from LocalStorage or set defaults\n        function initData() {\n            const savedStudents = localStorage.getItem('classroom_students_v2');\n            const savedClassName = localStorage.getItem('classroom_name');\n\n            if (savedClassName) {\n                document.getElementById('classNameDisplay').innerText = savedClassName;\n            }\n\n            if (savedStudents) {\n                try {\n                    students = JSON.parse(savedStudents);\n                } catch (e) {\n                    students = createDefaultStudentObjects(DEFAULT_STUDENTS);\n                }\n            } else {\n                students = createDefaultStudentObjects(DEFAULT_STUDENTS);\n            }\n\n            // Set current date\n            const now = new Date();\n            const dateStr = `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일 (${['일','월','화','수','목','금','토'][now.getDay()]})`;\n            document.getElementById('currentDateDisplay').innerText = `${dateStr} | 오늘 하루도 멋지게 성장을 기록해요!`;\n\n            renderGrid();\n        }\n\n        function createDefaultStudentObjects(nameList) {\n            return nameList.map((name, idx) =&gt; ({\n                id: Date.now() + idx,\n                name: name.trim(),\n                stars: 0\n            }));\n        }\n\n        function saveData() {\n            localStorage.setItem('classroom_students_v2', JSON.stringify(students));\n            updateTotalStarsCount();\n        }\n\n        // Add Star to Student\n        function addStar(studentId) {\n            const student = students.find(s =&gt; s.id === studentId);\n            if (student) {\n                student.stars += 1;\n                playPopSound();\n\n                // Trigger celebration every 5 stars milestone\n                if (student.stars &gt; 0 &amp;&amp; student.stars % 5 === 0) {\n                    playMilestoneFanfare();\n                    triggerConfetti();\n                }\n\n                saveData();\n                renderStudentCard(studentId);\n            }\n        }\n\n        // Remove Star from Student\n        function removeStar(studentId, event) {\n            if (event) event.stopPropagation(); // prevent triggering addStar\n            const student = students.find(s =&gt; s.id === studentId);\n            if (student &amp;&amp; student.stars &gt; 0) {\n                student.stars -= 1;\n                playRemoveSound();\n                saveData();\n                renderStudentCard(studentId);\n            }\n        }\n\n        // Set Sticker Icon Symbol\n        function setStickerType(type) {\n            currentSticker = type;\n            document.querySelectorAll('.sticker-btn').forEach(btn =&gt; {\n                btn.classList.remove('bg-white', 'shadow-sm');\n                btn.classList.add('hover:bg-white/60');\n            });\n            const activeBtn = document.getElementById(`sticker-${type}`);\n            if (activeBtn) {\n                activeBtn.classList.add('bg-white', 'shadow-sm');\n                activeBtn.classList.remove('hover:bg-white/60');\n            }\n            renderGrid();\n        }\n\n        // Render All Cards\n        function renderGrid() {\n            const container = document.getElementById('studentGrid');\n            container.innerHTML = '';\n\n            students.forEach((student, index) =&gt; {\n                const card = document.createElement('div');\n                card.id = `card-${student.id}`;\n                card.className = \"student-card bg-white rounded-3xl p-4 shadow-sm hover:shadow-md border-2 border-slate-100 flex flex-col justify-between relative overflow-hidden\";\n\n                // Set card content\n                card.innerHTML = buildCardHTML(student, index + 1);\n\n                // Right click context menu on student card decreases star\n                card.addEventListener('contextmenu', (e) =&gt; {\n                    e.preventDefault();\n                    removeStar(student.id, e);\n                });\n\n                container.appendChild(card);\n            });\n\n            updateTotalStarsCount();\n        }\n\n        // Helper to update individual card DOM\n        function renderStudentCard(studentId) {\n            const card = document.getElementById(`card-${studentId}`);\n            if (!card) {\n                renderGrid();\n                return;\n            }\n            const index = students.findIndex(s =&gt; s.id === studentId);\n            const student = students[index];\n            card.innerHTML = buildCardHTML(student, index + 1);\n\n            card.addEventListener('contextmenu', (e) =&gt; {\n                e.preventDefault();\n                removeStar(student.id, e);\n            });\n        }\n\n        // Generate inner HTML for student card\n        function buildCardHTML(student, number) {\n            // Generate stickers elements\n            let stickersHTML = '';\n            for (let i = 0; i &lt; student.stars; i++) {\n                stickersHTML += `&lt;span class=\"star-item text-lg md:text-xl\"&gt;${currentSticker}&lt;/span&gt; `;\n            }\n\n            if (student.stars === 0) {\n                stickersHTML = `&lt;span class=\"text-xs text-slate-300 font-sans italic\"&gt;스티커가 비어있어요&lt;/span&gt;`;\n            }\n\n            return `\n                &lt;div class=\"flex items-center justify-between gap-2 mb-3\"&gt;\n                    &lt;!-- Student Name Button (Click to add star) --&gt;\n                    &lt;button onclick=\"addStar(${student.id})\" class=\"flex items-center gap-2.5 bg-sky-50 hover:bg-sky-100 active:bg-sky-200 border border-sky-200 text-sky-950 px-3.5 py-2 rounded-2xl w-full text-left transition transform active:scale-95 group\"&gt;\n                        &lt;span class=\"w-6 h-6 bg-sky-200 text-sky-800 rounded-full flex items-center justify-center text-xs font-bold font-sans group-hover:bg-sky-300 transition\"&gt;\n                            ${number}\n                        &lt;/span&gt;\n                        &lt;span class=\"text-xl md:text-2xl font-extrabold tracking-wide\"&gt;${escapeHtml(student.name)}&lt;/span&gt;\n                    &lt;/button&gt;\n\n                    &lt;!-- Star Counter Badge --&gt;\n                    &lt;div class=\"bg-amber-100 border border-amber-200 text-amber-800 font-extrabold px-3 py-1.5 rounded-2xl text-sm md:text-base flex items-center gap-1 shadow-xs\"&gt;\n                        &lt;span&gt;${currentSticker}&lt;/span&gt;\n                        &lt;span class=\"text-lg font-black text-amber-700\"&gt;${student.stars}&lt;/span&gt;\n                    &lt;/div&gt;\n                &lt;/div&gt;\n\n                &lt;!-- Star Display Box --&gt;\n                &lt;div onclick=\"addStar(${student.id})\" class=\"star-box bg-slate-50/90 border border-slate-100 rounded-2xl p-2.5 min-h-[58px] max-h-[110px] overflow-y-auto flex flex-wrap items-center gap-1 cursor-pointer hover:bg-slate-100/80 transition\"&gt;\n                    ${stickersHTML}\n                &lt;/div&gt;\n\n                &lt;!-- Card Quick Footer Actions --&gt;\n                &lt;div class=\"flex items-center justify-between mt-3 pt-2 border-t border-slate-100 text-xs font-sans text-slate-400\"&gt;\n                    &lt;button onclick=\"removeStar(${student.id}, event)\" title=\"별 1개 지우기\" class=\"hover:text-rose-500 p-1 flex items-center gap-1 transition\"&gt;\n                        &lt;i class=\"fa-solid fa-minus-circle\"&gt;&lt;/i&gt; 차감\n                    &lt;/button&gt;\n                    &lt;span class=\"text-[11px] text-slate-300\"&gt;클릭: 추가 | 우클릭: 차감&lt;/span&gt;\n                &lt;/div&gt;\n            `;\n        }\n\n        // HTML Sanitizer helper\n        function escapeHtml(str) {\n            return str.replace(/&amp;/g, \"&amp;amp;\").replace(/&lt;/g, \"&amp;lt;\").replace(/&gt;/g, \"&amp;gt;\").replace(/\"/g, \"&amp;quot;\").replace(/'/g, \"&amp;#039;\");\n        }\n\n        // Update Total Star Counter\n        function updateTotalStarsCount() {\n            const total = students.reduce((sum, s) =&gt; sum + s.stars, 0);\n            document.getElementById('totalStarsCount').innerText = total;\n        }\n\n        // Sort Students\n        function sortStudents(type) {\n            if (type === 'stars') {\n                students.sort((a, b) =&gt; b.stars - a.stars);\n            } else {\n                students.sort((a, b) =&gt; a.name.localeCompare(b.name, 'ko-KR'));\n            }\n            saveData();\n            renderGrid();\n        }\n\n        // Reset All Stars Confirmation\n        function confirmResetAll() {\n            if (confirm(\"정말로 모든 학생의 칭찬 스티커를 0개로 초기화하시겠습니까?\")) {\n                students.forEach(s =&gt; s.stars = 0);\n                saveData();\n                renderGrid();\n            }\n        }\n\n        // Edit Class Title\n        function editClassName() {\n            const currentName = document.getElementById('classNameDisplay').innerText;\n            const newName = prompt(\"학급 이름을 입력해 주세요:\", currentName);\n            if (newName &amp;&amp; newName.trim() !== \"\") {\n                document.getElementById('classNameDisplay').innerText = newName.trim();\n                localStorage.setItem('classroom_name', newName.trim());\n            }\n        }\n\n        // Open Student Roster Modal\n        function openStudentModal() {\n            const namesText = students.map(s =&gt; s.name).join(', ');\n            document.getElementById('studentNamesInput').value = namesText;\n            document.getElementById('studentModal').classList.remove('hidden');\n        }\n\n        function closeStudentModal() {\n            document.getElementById('studentModal').classList.add('hidden');\n        }\n\n        function loadDefaultStudents() {\n            document.getElementById('studentNamesInput').value = DEFAULT_STUDENTS.join(', ');\n        }\n\n        function saveStudentList() {\n            const rawText = document.getElementById('studentNamesInput').value;\n            // Split by newline or comma\n            const nameArray = rawText.split(/[\\n,]+/).map(n =&gt; n.trim()).filter(n =&gt; n.length &gt; 0);\n\n            if (nameArray.length === 0) {\n                alert(\"적어도 한 명 이상의 학생 이름을 입력해야 합니다.\");\n                return;\n            }\n\n            // Preserve star count for existing names if possible\n            const newStudents = nameArray.map((name, idx) =&gt; {\n                const existing = students.find(s =&gt; s.name === name);\n                return {\n                    id: existing ? existing.id : Date.now() + idx,\n                    name: name,\n                    stars: existing ? existing.stars : 0\n                };\n            });\n\n            students = newStudents;\n            saveData();\n            renderGrid();\n            closeStudentModal();\n        }\n\n        let isSpinning = false;\n\n        function openRandomPicker() {\n            document.getElementById('pickerName').innerText = \"❓\";\n            document.getElementById('randomPickerModal').classList.remove('hidden');\n        }\n\n        function closeRandomPicker() {\n            if (isSpinning) return;\n            document.getElementById('randomPickerModal').classList.add('hidden');\n        }\n\n        function spinRandomPicker() {\n            if (isSpinning || students.length === 0) return;\n            isSpinning = true;\n\n            const nameDisplay = document.getElementById('pickerName');\n            const spinBtn = document.getElementById('spinBtn');\n            spinBtn.disabled = true;\n            spinBtn.classList.add('opacity-50');\n\n            let counter = 0;\n            const totalSpeed = 25; // number of tick iterations\n            const interval = setInterval(() =&gt; {\n                const randomIndex = Math.floor(Math.random() * students.length);\n                nameDisplay.innerText = students[randomIndex].name;\n                playPopSound();\n                counter++;\n\n                if (counter &gt;= totalSpeed) {\n                    clearInterval(interval);\n                    const chosen = students[Math.floor(Math.random() * students.length)];\n                    nameDisplay.innerText = chosen.name;\n                    playMilestoneFanfare();\n                    triggerConfetti();\n                    isSpinning = false;\n                    spinBtn.disabled = false;\n                    spinBtn.classList.remove('opacity-50');\n                }\n            }, 100);\n        }\n\n        // Trigger Canvas Confetti\n        function triggerConfetti() {\n            if (typeof confetti === 'function') {\n                confetti({\n                    particleCount: 80,\n                    spread: 70,\n                    origin: { y: 0.6 }\n                });\n            }\n        }\n\n        // Toggle Sound Mute\n        function toggleSound() {\n            isSoundEnabled = !isSoundEnabled;\n            const icon = document.getElementById('soundIcon');\n            if (isSoundEnabled) {\n                icon.className = \"fa-solid fa-volume-high text-sky-600\";\n            } else {\n                icon.className = \"fa-solid fa-volume-xmark text-slate-400\";\n            }\n        }\n\n        // Fullscreen Toggle Helper\n        function toggleFullscreen() {\n            if (!document.fullscreenElement) {\n                document.documentElement.requestFullscreen().catch(err =&gt; {\n                    console.log(`Error attempting to enable fullscreen: ${err.message}`);\n                });\n            } else {\n                if (document.exitFullscreen) {\n                    document.exitFullscreen();\n                }\n            }\n        }\n\n        window.onload = function() {\n            initData();\n        };\n    &lt;/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;\n\u003c/textarea>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"panel view\">\n      \u003cdiv class=\"phead\">\u003cspan class=\"dot\" style=\"background:#22c55e\">\u003c/span>결과 화면 \u003csmall>· 코드가 실제로 그려진 모습\u003c/small>\u003c/div>\n      \u003cdiv class=\"pbody\">\u003ciframe id=\"frame\" title=\"결과 미리보기\">\u003c/iframe>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"hint\">\n    \u003cb>지금 심어진 버그(선생님용):\u003c/b> ① 상단 '총 수여된 스티커' 박스 글자색이 \u003cb>text-white\u003c/b>라 안 보임 → 어두운 색으로. ② 별 스티커가 \u003cb>.star-item\u003c/b>에 \u003cb>opacity: 0\u003c/b>이라 안 보임 → \u003cb>opacity: 1\u003c/b>로.\n  \u003c/div>\n\u003c/div>\n\u003cscript>\n  const editor = document.getElementById('editor');\n  const frame = document.getElementById('frame');\n  const statusEl = document.getElementById('status');\n  const ORIGINAL = editor.value;\n\n  function isFixed(code){\n    var containerBuggy = /border-amber-200\\s+text-white\\s+font-bold/.test(code);\n    var numberBuggy = /totalStarsCount\"[^>]*\\btext-white\\b/.test(code);\n    var m = code.match(/\\.star-item\\s*\\{([^}]*)\\}/);\n    var starBuggy = m ? /opacity\\s*:\\s*0\\b/.test(m[1]) : false;\n    return !containerBuggy && !numberBuggy && !starBuggy;\n  }\n\n  function checkStatus(){\n    var ok = isFixed(editor.value);\n    statusEl.className = 'status ' + (ok ? 'done' : 'todo');\n    statusEl.textContent = ok ? '🎉 성공! 코드를 정상으로 고쳤어요.' : '아직이에요 — 코드를 더 고쳐 보세요!';\n  }\n  function run(){ frame.srcdoc = editor.value; checkStatus(); }\n  function resetCode(){ editor.value = ORIGINAL; run(); }\n\n  let timer;\n  editor.addEventListener('input', function(){\n    checkStatus();\n    clearTimeout(timer); timer = setTimeout(run, 600);\n  });\n  editor.addEventListener('keydown', function(e){\n    if(e.key === 'Tab'){\n      e.preventDefault();\n      const s = editor.selectionStart, en = editor.selectionEnd;\n      editor.value = editor.value.slice(0,s) + '  ' + editor.value.slice(en);\n      editor.selectionStart = editor.selectionEnd = s + 2;\n    }\n    if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); run(); }\n  });\n  run();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "height": 980, "storage": true}, {"t": "h", "text": "힌트 - 정답 프롬포트"}, {"t": "prompt", "label": "정답 프롬프트", "text": "이 칭찬 스티커판 코드에서 상단 '총 수여된 스티커' 글씨가 안 보이고, 별 스티커도 화면에 안 나타나. 글자 색이 배경이랑 같거나 투명하게 설정된 것 같아. 안 보이는 원인을 찾아서 잘 보이게 고쳐줘. 어디를 바꿨는지 알려줘"}]}, {"id": "debug-js", "title": "디버깅 실습(Java script)", "parent": "debug", "tag": "", "desc": "", "blocks": [{"t": "h", "text": "디버깅 실습(자바스크립트)"}, {"t": "p", "text": "수업용 칭찬 스티커판을 만들었는데 이상해요. 학생 이름을 눌러도 별 개수가 0에서 안 올라갑니다. 버튼은 분명히 눌리고 반응도 있는데 숫자만 그대로예요."}, {"t": "p", "text": "AI를 활용해서 왼쪽 코드를 수정해서 붙여넣기 하면 오른쪽 웹앱의 오류가 수정됩니다."}, {"t": "html", "title": "코드 고치기 — 칭찬 스티커판 (JavaScript)", "code": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>코드 고치기 — 칭찬 스티커판 (JavaScript)\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n  :root{\n    --ink:#16202b; --muted:#5b6b7b; --paper:#ffffff; --stage:#e7ecf1; --line:#d7dee6;\n    --shop:#f76707; --srv:#0e131b; --srv-2:#1d2632; --srv-line:#2d3a49; --srv-text:#e6ecf3; --srv-dim:#7c8ba0;\n    --sans:'IBM Plex Sans KR', system-ui, -apple-system, sans-serif;\n    --mono:'IBM Plex Mono', ui-monospace, monospace;\n  }\n  *{box-sizing:border-box}\n  body{margin:0; background:var(--stage); color:var(--ink); font-family:var(--sans);\n       line-height:1.55; padding:22px; -webkit-font-smoothing:antialiased}\n  .wrap{max-width:1180px; margin:0 auto}\n  h1{font-size:24px; font-weight:600; margin:0 0 6px; letter-spacing:-.01em}\n  .lede{margin:0 0 16px; color:var(--muted); font-size:15px; max-width:72ch}\n  .toolbar{display:flex; align-items:center; gap:10px; margin-bottom:14px}\n  .spacer{flex:1}\n  .btn{font-family:var(--sans); font-size:14px; font-weight:500; padding:9px 16px; border:0;\n       border-radius:10px; cursor:pointer; transition:filter .12s}\n  .btn:hover{filter:brightness(.95)}\n  .btn.run{background:var(--shop); color:#fff}\n  .btn.ghost{background:#fff; color:var(--ink); border:1px solid var(--line)}\n  .status{padding:12px 16px; border-radius:11px; font-weight:600; font-size:15px; margin-bottom:14px;\n          border:1px solid; transition:background .15s, color .15s, border-color .15s; display:flex; align-items:center; gap:8px}\n  .status.todo{background:#fff4e6; color:#9a3d04; border-color:#f7c9ac}\n  .status.done{background:#e9f9ef; color:#116932; border-color:#abe4c1}\n  .panels{display:grid; grid-template-columns:1fr 1fr; gap:14px}\n  @media (max-width:820px){ .panels{grid-template-columns:1fr} body{padding:15px} }\n  .panel{display:flex; flex-direction:column; border:1px solid var(--line); border-radius:14px;\n         overflow:hidden; height:72vh; min-height:500px}\n  @media (max-width:820px){ .panel{height:54vh; min-height:350px} }\n  .phead{display:flex; align-items:center; gap:8px; padding:11px 15px; font-weight:600; font-size:14px; flex:none}\n  .phead .dot{width:10px; height:10px; border-radius:50%}\n  .phead small{font-weight:400; font-size:12px}\n  .pbody{flex:1; min-height:0}\n  .panel.code{border-color:var(--srv-line)}\n  .panel.code .phead{background:var(--srv-2); color:#eef3f8; border-bottom:1px solid var(--srv-line)}\n  .panel.code .phead small{color:var(--srv-dim)}\n  #editor{width:100%; height:100%; border:0; outline:0; resize:none; display:block;\n          background:var(--srv); color:var(--srv-text); font-family:var(--mono); font-size:13px;\n          line-height:1.6; padding:14px 16px; tab-size:2; white-space:pre; overflow:auto}\n  .panel.view .phead{background:#f2f4f7; color:var(--ink); border-bottom:1px solid var(--line)}\n  .panel.view .phead small{color:var(--muted)}\n  #frame{width:100%; height:100%; border:0; background:#fff; display:block}\n  .hint{margin-top:14px; font-size:13px; color:var(--muted); background:#fff; border:1px solid var(--line);\n        border-left:4px solid var(--shop); border-radius:0 12px 12px 0; padding:12px 15px}\n  .hint b{color:var(--ink)}\n  kbd{font-family:var(--mono); font-size:11.5px; background:#eef1f4; border:1px solid var(--line);\n      border-radius:5px; padding:1px 6px}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n  \u003ch1>코드 고치기 — 칭찬 스티커판\u003c/h1>\n  \u003cp class=\"lede\">왼쪽 코드를 고치면 오른쪽 화면이 그대로 바뀝니다. 코드를 정상으로 고치면 위에 성공 표시가 떠요. \u003ckbd>실행\u003c/kbd> 또는 \u003ckbd>Ctrl\u003c/kbd>+\u003ckbd>Enter\u003c/kbd>로 바로 반영, \u003ckbd>처음으로\u003c/kbd>로 되돌리기.\u003c/p>\n  \u003cdiv class=\"toolbar\">\n    \u003cspan class=\"spacer\">\u003c/span>\n    \u003cbutton class=\"btn ghost\" onclick=\"resetCode()\">↺ 처음으로\u003c/button>\n    \u003cbutton class=\"btn run\" onclick=\"run()\">▶ 실행\u003c/button>\n  \u003c/div>\n  \u003cdiv id=\"status\" class=\"status todo\">\u003c/div>\n  \u003cdiv class=\"panels\">\n    \u003cdiv class=\"panel code\">\n      \u003cdiv class=\"phead\">\u003cspan class=\"dot\" style=\"background:#7c5cff\">\u003c/span>코드 \u003csmall>· 여기를 고쳐 보세요 (전체 코드)\u003c/small>\u003c/div>\n      \u003cdiv class=\"pbody\">\u003ctextarea id=\"editor\" spellcheck=\"false\" autocapitalize=\"off\" autocomplete=\"off\">&lt;!DOCTYPE html&gt;\n&lt;html lang=\"ko\"&gt;\n&lt;head&gt;\n    &lt;meta charset=\"UTF-8\"&gt;\n    &lt;meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"&gt;\n    &lt;title&gt;우리 반 칭찬 스티커판&lt;/title&gt;\n    &lt;!-- Tailwind CSS for utility styling --&gt;\n    &lt;script src=\"https://cdn.tailwindcss.com\"&gt;&lt;/script&gt;\n    &lt;!-- Google Fonts: Jua &amp; Noto Sans KR for friendly classroom typography --&gt;\n    &lt;link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"&gt;\n    &lt;link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin&gt;\n    &lt;link href=\"https://fonts.googleapis.com/css2?family=Jua&amp;family=Noto+Sans+KR:wght@400;600;700;900&amp;display=swap\" rel=\"stylesheet\"&gt;\n    &lt;!-- FontAwesome Icons --&gt;\n    &lt;link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css\"&gt;\n    &lt;!-- Canvas Confetti Library --&gt;\n    &lt;script src=\"https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js\"&gt;&lt;/script&gt;\n\n    &lt;style&gt;\n        body {\n            font-family: 'Jua', 'Noto Sans KR', sans-serif;\n            background-color: #f0f9ff;\n            background-image: radial-gradient(#e0f2fe 2px, transparent 2px);\n            background-size: 24px 24px;\n        }\n\n        .star-item {\n            display: inline-block;\n            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);\n            user-select: none;\n        }\n\n        @keyframes popIn {\n            0% { transform: scale(0) rotate(-45deg); opacity: 0; }\n            80% { transform: scale(1.3) rotate(10deg); }\n            100% { transform: scale(1) rotate(0deg); opacity: 1; }\n        }\n\n        .student-card {\n            transition: all 0.2s ease;\n        }\n\n        .student-card:hover {\n            transform: translateY(-4deg);\n        }\n\n        .student-card:active {\n            transform: scale(0.98);\n        }\n\n        /* Custom scrollbar for star container */\n        .star-box::-webkit-scrollbar {\n            height: 6px;\n            width: 6px;\n        }\n        .star-box::-webkit-scrollbar-thumb {\n            background-color: #cbd5e1;\n            border-radius: 9999px;\n        }\n\n        /* TV Display Optimized Font Scaling */\n        .tv-title {\n            text-shadow: 2px 2px 0px rgba(0,0,0,0.06);\n        }\n\n        /* Custom Modal Backdrop Blur */\n        .backdrop-blur-custom {\n            backdrop-filter: blur(8px);\n        }\n    &lt;/style&gt;\n&lt;/head&gt;\n&lt;body class=\"min-h-screen text-slate-800 flex flex-col justify-between p-3 sm:p-6 select-none\"&gt;\n\n    &lt;!-- Top Header Navigation Bar --&gt;\n    &lt;header class=\"bg-white/90 backdrop-blur-md rounded-3xl p-4 md:p-5 shadow-lg border-2 border-sky-100 mb-5 flex flex-col md:flex-row items-center justify-between gap-4\"&gt;\n\n        &lt;!-- Class Title Header --&gt;\n        &lt;div class=\"flex items-center gap-3\"&gt;\n            &lt;div class=\"w-12 h-12 md:w-14 md:h-14 bg-amber-400 text-white rounded-2xl flex items-center justify-center text-2xl md:text-3xl shadow-md transform -rotate-3\"&gt;\n                ⭐\n            &lt;/div&gt;\n            &lt;div&gt;\n                &lt;div class=\"flex items-center gap-2\"&gt;\n                    &lt;h1 id=\"classNameDisplay\" class=\"text-2xl md:text-4xl font-extrabold text-sky-900 tv-title tracking-wide\"&gt;\n                        3학년 1반 칭찬 스티커판\n                    &lt;/h1&gt;\n                    &lt;button onclick=\"editClassName()\" title=\"학급 이름 수정\" class=\"text-slate-400 hover:text-sky-600 transition text-sm\"&gt;\n                        &lt;i class=\"fa-solid fa-pen\"&gt;&lt;/i&gt;\n                    &lt;/button&gt;\n                &lt;/div&gt;\n                &lt;p id=\"currentDateDisplay\" class=\"text-xs md:text-sm text-slate-500 font-sans font-medium\"&gt;오늘도 차근차근 꿈을 향해 가요!&lt;/p&gt;\n            &lt;/div&gt;\n        &lt;/div&gt;\n\n        &lt;!-- TV Quick Toolbar Options --&gt;\n        &lt;div class=\"flex flex-wrap items-center gap-2 sm:gap-3\"&gt;\n\n            &lt;!-- Sticker Type Selector --&gt;\n            &lt;div class=\"bg-sky-50 p-1.5 rounded-2xl border border-sky-200 flex items-center gap-1\"&gt;\n                &lt;span class=\"text-xs font-bold text-sky-700 ml-1.5 hidden sm:inline\"&gt;스티커:&lt;/span&gt;\n                &lt;button onclick=\"setStickerType('⭐')\" id=\"sticker-⭐\" class=\"sticker-btn px-2.5 py-1 rounded-xl bg-white shadow-sm font-bold text-lg hover:scale-110 transition\"&gt;⭐&lt;/button&gt;\n                &lt;button onclick=\"setStickerType('💮')\" id=\"sticker-💮\" class=\"sticker-btn px-2.5 py-1 rounded-xl hover:bg-white/60 font-bold text-lg hover:scale-110 transition\"&gt;💮&lt;/button&gt;\n                &lt;button onclick=\"setStickerType('❤️')\" id=\"sticker-❤️\" class=\"sticker-btn px-2.5 py-1 rounded-xl hover:bg-white/60 font-bold text-lg hover:scale-110 transition\"&gt;❤️&lt;/button&gt;\n                &lt;button onclick=\"setStickerType('👑')\" id=\"sticker-👑\" class=\"sticker-btn px-2.5 py-1 rounded-xl hover:bg-white/60 font-bold text-lg hover:scale-110 transition\"&gt;👑&lt;/button&gt;\n                &lt;button onclick=\"setStickerType('🌈')\" id=\"sticker-🌈\" class=\"sticker-btn px-2.5 py-1 rounded-xl hover:bg-white/60 font-bold text-lg hover:scale-110 transition\"&gt;🌈&lt;/button&gt;\n            &lt;/div&gt;\n\n            &lt;!-- Sound Toggle Button --&gt;\n            &lt;button id=\"soundToggleBtn\" onclick=\"toggleSound()\" class=\"bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2.5 rounded-2xl font-bold flex items-center gap-2 text-sm transition\"&gt;\n                &lt;i id=\"soundIcon\" class=\"fa-solid fa-volume-high text-sky-600\"&gt;&lt;/i&gt;\n                &lt;span class=\"hidden lg:inline\"&gt;소리&lt;/span&gt;\n            &lt;/button&gt;\n\n            &lt;!-- Random Student Picker Button --&gt;\n            &lt;button onclick=\"openRandomPicker()\" class=\"bg-gradient-to-r from-purple-500 to-indigo-600 hover:from-purple-600 hover:to-indigo-700 text-white px-4 py-2.5 rounded-2xl font-bold shadow-md hover:shadow-lg flex items-center gap-2 text-sm md:text-base transition transform hover:-translate-y-0.5\"&gt;\n                &lt;i class=\"fa-solid fa-dice text-amber-300 text-lg\"&gt;&lt;/i&gt;\n                &lt;span&gt;랜덤 추첨&lt;/span&gt;\n            &lt;/button&gt;\n\n            &lt;!-- Edit Students Roster Modal Opener --&gt;\n            &lt;button onclick=\"openStudentModal()\" class=\"bg-emerald-500 hover:bg-emerald-600 text-white px-3.5 py-2.5 rounded-2xl font-bold shadow-md hover:shadow-lg flex items-center gap-2 text-sm transition\"&gt;\n                &lt;i class=\"fa-solid fa-users-gear\"&gt;&lt;/i&gt;\n                &lt;span class=\"hidden sm:inline\"&gt;명단 관리&lt;/span&gt;\n            &lt;/button&gt;\n\n            &lt;!-- Fullscreen Toggle --&gt;\n            &lt;button onclick=\"toggleFullscreen()\" title=\"전체화면\" class=\"bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2.5 rounded-2xl font-bold transition text-sm\"&gt;\n                &lt;i class=\"fa-solid fa-expand\"&gt;&lt;/i&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/header&gt;\n\n    &lt;!-- Action Bar &amp; Stats Summary --&gt;\n    &lt;div class=\"max-w-7xl mx-auto w-full mb-4 flex flex-col sm:flex-row items-center justify-between gap-3 bg-white/60 p-3 rounded-2xl border border-sky-100\"&gt;\n\n        &lt;!-- Total Stars Counted --&gt;\n        &lt;div class=\"flex items-center gap-4\"&gt;\n            &lt;div class=\"flex items-center gap-2 bg-amber-100/80 px-3.5 py-1.5 rounded-xl border border-amber-200 text-amber-800 font-bold text-sm md:text-base\"&gt;\n                &lt;span&gt;총 수여된 스티커:&lt;/span&gt;\n                &lt;span id=\"totalStarsCount\" class=\"text-xl font-extrabold text-amber-600\"&gt;0&lt;/span&gt;개\n            &lt;/div&gt;\n            &lt;div class=\"text-xs sm:text-sm text-slate-500 font-sans hidden md:block\"&gt;\n                💡 &lt;span class=\"font-bold\"&gt;팁:&lt;/span&gt; 이름 버튼을 클릭하면 별 1개가 추가되고, 마우스 우클릭으로 1개 지울 수 있어요!\n            &lt;/div&gt;\n        &lt;/div&gt;\n\n        &lt;!-- Sorting &amp; Quick Action Controls --&gt;\n        &lt;div class=\"flex items-center gap-2 w-full sm:w-auto justify-end\"&gt;\n            &lt;button onclick=\"sortStudents('default')\" class=\"px-3 py-1.5 bg-white border border-slate-200 hover:bg-slate-50 rounded-xl text-xs sm:text-sm font-bold text-slate-600 transition\"&gt;\n                번호순\n            &lt;/button&gt;\n            &lt;button onclick=\"sortStudents('stars')\" class=\"px-3 py-1.5 bg-white border border-slate-200 hover:bg-slate-50 rounded-xl text-xs sm:text-sm font-bold text-slate-600 transition\"&gt;\n                ⭐ 칭찬순\n            &lt;/button&gt;\n            &lt;button onclick=\"confirmResetAll()\" class=\"px-3 py-1.5 bg-rose-50 border border-rose-200 hover:bg-rose-100 rounded-xl text-xs sm:text-sm font-bold text-rose-600 transition flex items-center gap-1\"&gt;\n                &lt;i class=\"fa-solid fa-rotate-right\"&gt;&lt;/i&gt;\n                전체 초기화\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n\n    &lt;!-- Main Student Roster Grid --&gt;\n    &lt;main class=\"max-w-7xl mx-auto w-full flex-1\"&gt;\n        &lt;div id=\"studentGrid\" class=\"grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3.5 md:gap-4 pb-6\"&gt;\n            &lt;!-- Dynamic Student Cards will be injected here via JavaScript --&gt;\n        &lt;/div&gt;\n    &lt;/main&gt;\n\n    &lt;!-- Student Roster Edit Modal --&gt;\n    &lt;div id=\"studentModal\" class=\"fixed inset-0 bg-slate-900/50 backdrop-blur-custom z-50 hidden flex items-center justify-center p-4\"&gt;\n        &lt;div class=\"bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border-4 border-sky-200 transform transition-all\"&gt;\n            &lt;div class=\"flex items-center justify-between border-b pb-3 mb-4\"&gt;\n                &lt;h3 class=\"text-xl font-bold text-sky-900 flex items-center gap-2\"&gt;\n                    &lt;i class=\"fa-solid fa-user-pen text-sky-500\"&gt;&lt;/i&gt; 우리 반 학생 명단 수정\n                &lt;/h3&gt;\n                &lt;button onclick=\"closeStudentModal()\" class=\"text-slate-400 hover:text-slate-600 text-xl font-bold p-1\"&gt;\n                    &lt;i class=\"fa-solid fa-xmark\"&gt;&lt;/i&gt;\n                &lt;/button&gt;\n            &lt;/div&gt;\n\n            &lt;p class=\"text-xs text-slate-500 mb-3 font-sans leading-relaxed\"&gt;\n                학생 이름을 쉼표(,)나 줄바꿈(엔터)으로 구분해서 입력해 주세요.&lt;br&gt;예: 김철수, 이영희, 박민수, 정수현\n            &lt;/p&gt;\n\n            &lt;textarea id=\"studentNamesInput\" rows=\"8\" class=\"w-full p-3.5 border-2 border-slate-200 rounded-2xl focus:border-sky-500 focus:outline-none text-slate-700 font-sans text-sm leading-relaxed mb-4 resize-none\" placeholder=\"학생 이름을 입력하세요...\"&gt;&lt;/textarea&gt;\n\n            &lt;div class=\"flex items-center justify-between gap-3\"&gt;\n                &lt;button onclick=\"loadDefaultStudents()\" class=\"px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl font-bold text-xs sm:text-sm transition\"&gt;\n                    샘플 목록 불러오기\n                &lt;/button&gt;\n                &lt;div class=\"flex gap-2\"&gt;\n                    &lt;button onclick=\"closeStudentModal()\" class=\"px-4 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl font-bold text-sm transition\"&gt;\n                        취소\n                    &lt;/button&gt;\n                    &lt;button onclick=\"saveStudentList()\" class=\"px-5 py-2.5 bg-sky-500 hover:bg-sky-600 text-white rounded-xl font-bold text-sm shadow-md transition\"&gt;\n                        저장하기\n                    &lt;/button&gt;\n                &lt;/div&gt;\n            &lt;/div&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n\n    &lt;!-- Random Student Picker Modal --&gt;\n    &lt;div id=\"randomPickerModal\" class=\"fixed inset-0 bg-slate-900/60 backdrop-blur-custom z-50 hidden flex items-center justify-center p-4\"&gt;\n        &lt;div class=\"bg-white rounded-3xl max-w-md w-full p-8 shadow-2xl border-4 border-purple-200 text-center transform transition-all relative overflow-hidden\"&gt;\n\n            &lt;div class=\"absolute -top-12 -right-12 w-32 h-32 bg-purple-100 rounded-full blur-xl pointer-events-none\"&gt;&lt;/div&gt;\n\n            &lt;h3 class=\"text-2xl font-extrabold text-purple-900 mb-2 flex items-center justify-center gap-2\"&gt;\n                &lt;i class=\"fa-solid fa-wand-magic-sparkles text-purple-500\"&gt;&lt;/i&gt; 오늘의 행운아 추첨!\n            &lt;/h3&gt;\n            &lt;p class=\"text-xs text-slate-500 mb-6 font-sans\"&gt;누가 발표하게 될까요?&lt;/p&gt;\n\n            &lt;!-- Display Box for Chosen Student --&gt;\n            &lt;div id=\"pickerDisplay\" class=\"bg-gradient-to-br from-purple-50 to-indigo-50 border-4 border-purple-200 rounded-3xl h-36 flex items-center justify-center mb-6 shadow-inner relative\"&gt;\n                &lt;span id=\"pickerName\" class=\"text-4xl md:text-5xl font-black text-purple-800 tracking-wider\"&gt;\n                    ❓\n                &lt;/span&gt;\n            &lt;/div&gt;\n\n            &lt;!-- Action Buttons for Picker --&gt;\n            &lt;div class=\"flex items-center justify-center gap-3\"&gt;\n                &lt;button id=\"spinBtn\" onclick=\"spinRandomPicker()\" class=\"w-full py-3.5 bg-gradient-to-r from-purple-500 to-indigo-600 hover:from-purple-600 hover:to-indigo-700 text-white rounded-2xl font-extrabold text-lg shadow-lg hover:shadow-xl transition transform active:scale-95 flex items-center justify-center gap-2\"&gt;\n                    &lt;i class=\"fa-solid fa-rotate text-amber-300\"&gt;&lt;/i&gt; 추첨 시작!\n                &lt;/button&gt;\n                &lt;button onclick=\"closeRandomPicker()\" class=\"py-3.5 px-5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-2xl font-bold text-base transition\"&gt;\n                    닫기\n                &lt;/button&gt;\n            &lt;/div&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n\n    &lt;!-- Footer --&gt;\n    &lt;footer class=\"mt-6 text-center text-xs text-slate-400 font-sans py-2\"&gt;\n        교실 TV 및 전자칠판용 칭찬 스티커 프로그램 | 데이터는 브라우저에 자동으로 안전하게 저장됩니다.\n    &lt;/footer&gt;\n\n    &lt;script&gt;\n        // Default Sample Student Roster\n        const DEFAULT_STUDENTS = [\n            \"김민준\", \"이서연\", \"박도윤\", \"최지우\", \"정하은\",\n            \"강준우\", \"조서현\", \"윤지호\", \"장수아\", \"임현우\",\n            \"한예은\", \"오지훈\", \"서유나\", \"신동현\", \"권채원\",\n            \"황민재\", \"송하윤\", \"류태양\", \"홍다은\", \"백우진\"\n        ];\n\n        // Application State Variables\n        let students = [];\n        let currentSticker = '⭐';\n        let isSoundEnabled = true;\n        let audioCtx = null;\n\n        // Synthesize audio without needing external mp3 files\n        function getAudioContext() {\n            if (!audioCtx) {\n                const AudioContext = window.AudioContext || window.webkitAudioContext;\n                audioCtx = new AudioContext();\n            }\n            if (audioCtx.state === 'suspended') {\n                audioCtx.resume();\n            }\n            return audioCtx;\n        }\n\n        // Play short cheerful pop sound when sticker added\n        function playPopSound() {\n            if (!isSoundEnabled) return;\n            try {\n                const ctx = getAudioContext();\n                const osc = ctx.createOscillator();\n                const gain = ctx.createGain();\n\n                osc.type = 'sine';\n                osc.frequency.setValueAtTime(450, ctx.currentTime);\n                osc.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.1);\n\n                gain.gain.setValueAtTime(0.3, ctx.currentTime);\n                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);\n\n                osc.connect(gain);\n                gain.connect(ctx.destination);\n\n                osc.start();\n                osc.stop(ctx.currentTime + 0.1);\n            } catch (e) {\n                console.log(\"Audio play error:\", e);\n            }\n        }\n\n        // Play subtle remove sound\n        function playRemoveSound() {\n            if (!isSoundEnabled) return;\n            try {\n                const ctx = getAudioContext();\n                const osc = ctx.createOscillator();\n                const gain = ctx.createGain();\n\n                osc.type = 'sine';\n                osc.frequency.setValueAtTime(500, ctx.currentTime);\n                osc.frequency.exponentialRampToValueAtTime(250, ctx.currentTime + 0.1);\n\n                gain.gain.setValueAtTime(0.2, ctx.currentTime);\n                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);\n\n                osc.connect(gain);\n                gain.connect(ctx.destination);\n\n                osc.start();\n                osc.stop(ctx.currentTime + 0.1);\n            } catch (e) {\n                console.log(\"Audio play error:\", e);\n            }\n        }\n\n        // Play chime sound for milestones (e.g., 5, 10, 15 stars)\n        function playMilestoneFanfare() {\n            if (!isSoundEnabled) return;\n            try {\n                const ctx = getAudioContext();\n                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6\n                notes.forEach((freq, index) =&gt; {\n                    const osc = ctx.createOscillator();\n                    const gain = ctx.createGain();\n                    const startTime = ctx.currentTime + (index * 0.08);\n\n                    osc.type = 'triangle';\n                    osc.frequency.setValueAtTime(freq, startTime);\n\n                    gain.gain.setValueAtTime(0.25, startTime);\n                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.3);\n\n                    osc.connect(gain);\n                    gain.connect(ctx.destination);\n\n                    osc.start(startTime);\n                    osc.stop(startTime + 0.3);\n                });\n            } catch (e) {\n                console.log(\"Audio play error:\", e);\n            }\n        }\n\n        // Load data from LocalStorage or set defaults\n        function initData() {\n            const savedStudents = localStorage.getItem('classroom_students_v2');\n            const savedClassName = localStorage.getItem('classroom_name');\n\n            if (savedClassName) {\n                document.getElementById('classNameDisplay').innerText = savedClassName;\n            }\n\n            if (savedStudents) {\n                try {\n                    students = JSON.parse(savedStudents);\n                } catch (e) {\n                    students = createDefaultStudentObjects(DEFAULT_STUDENTS);\n                }\n            } else {\n                students = createDefaultStudentObjects(DEFAULT_STUDENTS);\n            }\n\n            // Set current date\n            const now = new Date();\n            const dateStr = `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일 (${['일','월','화','수','목','금','토'][now.getDay()]})`;\n            document.getElementById('currentDateDisplay').innerText = `${dateStr} | 오늘 하루도 멋지게 성장을 기록해요!`;\n\n            renderGrid();\n        }\n\n        function createDefaultStudentObjects(nameList) {\n            return nameList.map((name, idx) =&gt; ({\n                id: Date.now() + idx,\n                name: name.trim(),\n                stars: 0\n            }));\n        }\n\n        function saveData() {\n            localStorage.setItem('classroom_students_v2', JSON.stringify(students));\n            updateTotalStarsCount();\n        }\n\n        // Add Star to Student\n        function addStar(studentId) {\n            const student = students.find(s =&gt; s.id === studentId);\n            if (student) {\n                student.stars + 1;\n                playPopSound();\n\n                // Trigger celebration every 5 stars milestone\n                if (student.stars &gt; 0 &amp;&amp; student.stars % 5 === 0) {\n                    playMilestoneFanfare();\n                    triggerConfetti();\n                }\n\n                saveData();\n                renderStudentCard(studentId);\n            }\n        }\n\n        // Remove Star from Student\n        function removeStar(studentId, event) {\n            if (event) event.stopPropagation(); // prevent triggering addStar\n            const student = students.find(s =&gt; s.id === studentId);\n            if (student &amp;&amp; student.stars &gt; 0) {\n                student.stars -= 1;\n                playRemoveSound();\n                saveData();\n                renderStudentCard(studentId);\n            }\n        }\n\n        // Set Sticker Icon Symbol\n        function setStickerType(type) {\n            currentSticker = type;\n            document.querySelectorAll('.sticker-btn').forEach(btn =&gt; {\n                btn.classList.remove('bg-white', 'shadow-sm');\n                btn.classList.add('hover:bg-white/60');\n            });\n            const activeBtn = document.getElementById(`sticker-${type}`);\n            if (activeBtn) {\n                activeBtn.classList.add('bg-white', 'shadow-sm');\n                activeBtn.classList.remove('hover:bg-white/60');\n            }\n            renderGrid();\n        }\n\n        // Render All Cards\n        function renderGrid() {\n            const container = document.getElementById('studentGrid');\n            container.innerHTML = '';\n\n            students.forEach((student, index) =&gt; {\n                const card = document.createElement('div');\n                card.id = `card-${student.id}`;\n                card.className = \"student-card bg-white rounded-3xl p-4 shadow-sm hover:shadow-md border-2 border-slate-100 flex flex-col justify-between relative overflow-hidden\";\n\n                // Set card content\n                card.innerHTML = buildCardHTML(student, index + 1);\n\n                // Right click context menu on student card decreases star\n                card.addEventListener('contextmenu', (e) =&gt; {\n                    e.preventDefault();\n                    removeStar(student.id, e);\n                });\n\n                container.appendChild(card);\n            });\n\n            updateTotalStarsCount();\n        }\n\n        // Helper to update individual card DOM\n        function renderStudentCard(studentId) {\n            const card = document.getElementById(`card-${studentId}`);\n            if (!card) {\n                renderGrid();\n                return;\n            }\n            const index = students.findIndex(s =&gt; s.id === studentId);\n            const student = students[index];\n            card.innerHTML = buildCardHTML(student, index + 1);\n\n            card.addEventListener('contextmenu', (e) =&gt; {\n                e.preventDefault();\n                removeStar(student.id, e);\n            });\n        }\n\n        // Generate inner HTML for student card\n        function buildCardHTML(student, number) {\n            // Generate stickers elements\n            let stickersHTML = '';\n            for (let i = 0; i &lt; student.stars; i++) {\n                stickersHTML += `&lt;span class=\"star-item text-lg md:text-xl\"&gt;${currentSticker}&lt;/span&gt; `;\n            }\n\n            if (student.stars === 0) {\n                stickersHTML = `&lt;span class=\"text-xs text-slate-300 font-sans italic\"&gt;스티커가 비어있어요&lt;/span&gt;`;\n            }\n\n            return `\n                &lt;div class=\"flex items-center justify-between gap-2 mb-3\"&gt;\n                    &lt;!-- Student Name Button (Click to add star) --&gt;\n                    &lt;button onclick=\"addStar(${student.id})\" class=\"flex items-center gap-2.5 bg-sky-50 hover:bg-sky-100 active:bg-sky-200 border border-sky-200 text-sky-950 px-3.5 py-2 rounded-2xl w-full text-left transition transform active:scale-95 group\"&gt;\n                        &lt;span class=\"w-6 h-6 bg-sky-200 text-sky-800 rounded-full flex items-center justify-center text-xs font-bold font-sans group-hover:bg-sky-300 transition\"&gt;\n                            ${number}\n                        &lt;/span&gt;\n                        &lt;span class=\"text-xl md:text-2xl font-extrabold tracking-wide\"&gt;${escapeHtml(student.name)}&lt;/span&gt;\n                    &lt;/button&gt;\n\n                    &lt;!-- Star Counter Badge --&gt;\n                    &lt;div class=\"bg-amber-100 border border-amber-200 text-amber-800 font-extrabold px-3 py-1.5 rounded-2xl text-sm md:text-base flex items-center gap-1 shadow-xs\"&gt;\n                        &lt;span&gt;${currentSticker}&lt;/span&gt;\n                        &lt;span class=\"text-lg font-black text-amber-700\"&gt;${student.stars}&lt;/span&gt;\n                    &lt;/div&gt;\n                &lt;/div&gt;\n\n                &lt;!-- Star Display Box --&gt;\n                &lt;div onclick=\"addStar(${student.id})\" class=\"star-box bg-slate-50/90 border border-slate-100 rounded-2xl p-2.5 min-h-[58px] max-h-[110px] overflow-y-auto flex flex-wrap items-center gap-1 cursor-pointer hover:bg-slate-100/80 transition\"&gt;\n                    ${stickersHTML}\n                &lt;/div&gt;\n\n                &lt;!-- Card Quick Footer Actions --&gt;\n                &lt;div class=\"flex items-center justify-between mt-3 pt-2 border-t border-slate-100 text-xs font-sans text-slate-400\"&gt;\n                    &lt;button onclick=\"removeStar(${student.id}, event)\" title=\"별 1개 지우기\" class=\"hover:text-rose-500 p-1 flex items-center gap-1 transition\"&gt;\n                        &lt;i class=\"fa-solid fa-minus-circle\"&gt;&lt;/i&gt; 차감\n                    &lt;/button&gt;\n                    &lt;span class=\"text-[11px] text-slate-300\"&gt;클릭: 추가 | 우클릭: 차감&lt;/span&gt;\n                &lt;/div&gt;\n            `;\n        }\n\n        // HTML Sanitizer helper\n        function escapeHtml(str) {\n            return str.replace(/&amp;/g, \"&amp;amp;\").replace(/&lt;/g, \"&amp;lt;\").replace(/&gt;/g, \"&amp;gt;\").replace(/\"/g, \"&amp;quot;\").replace(/'/g, \"&amp;#039;\");\n        }\n\n        // Update Total Star Counter\n        function updateTotalStarsCount() {\n            const total = students.reduce((sum, s) =&gt; sum + s.stars, 0);\n            document.getElementById('totalStarsCount').innerText = total;\n        }\n\n        // Sort Students\n        function sortStudents(type) {\n            if (type === 'stars') {\n                students.sort((a, b) =&gt; b.stars - a.stars);\n            } else {\n                students.sort((a, b) =&gt; a.name.localeCompare(b.name, 'ko-KR'));\n            }\n            saveData();\n            renderGrid();\n        }\n\n        // Reset All Stars Confirmation\n        function confirmResetAll() {\n            if (confirm(\"정말로 모든 학생의 칭찬 스티커를 0개로 초기화하시겠습니까?\")) {\n                students.forEach(s =&gt; s.stars = 0);\n                saveData();\n                renderGrid();\n            }\n        }\n\n        // Edit Class Title\n        function editClassName() {\n            const currentName = document.getElementById('classNameDisplay').innerText;\n            const newName = prompt(\"학급 이름을 입력해 주세요:\", currentName);\n            if (newName &amp;&amp; newName.trim() !== \"\") {\n                document.getElementById('classNameDisplay').innerText = newName.trim();\n                localStorage.setItem('classroom_name', newName.trim());\n            }\n        }\n\n        // Open Student Roster Modal\n        function openStudentModal() {\n            const namesText = students.map(s =&gt; s.name).join(', ');\n            document.getElementById('studentNamesInput').value = namesText;\n            document.getElementById('studentModal').classList.remove('hidden');\n        }\n\n        function closeStudentModal() {\n            document.getElementById('studentModal').classList.add('hidden');\n        }\n\n        function loadDefaultStudents() {\n            document.getElementById('studentNamesInput').value = DEFAULT_STUDENTS.join(', ');\n        }\n\n        function saveStudentList() {\n            const rawText = document.getElementById('studentNamesInput').value;\n            // Split by newline or comma\n            const nameArray = rawText.split(/[\\n,]+/).map(n =&gt; n.trim()).filter(n =&gt; n.length &gt; 0);\n\n            if (nameArray.length === 0) {\n                alert(\"적어도 한 명 이상의 학생 이름을 입력해야 합니다.\");\n                return;\n            }\n\n            // Preserve star count for existing names if possible\n            const newStudents = nameArray.map((name, idx) =&gt; {\n                const existing = students.find(s =&gt; s.name === name);\n                return {\n                    id: existing ? existing.id : Date.now() + idx,\n                    name: name,\n                    stars: existing ? existing.stars : 0\n                };\n            });\n\n            students = newStudents;\n            saveData();\n            renderGrid();\n            closeStudentModal();\n        }\n\n        let isSpinning = false;\n\n        function openRandomPicker() {\n            document.getElementById('pickerName').innerText = \"❓\";\n            document.getElementById('randomPickerModal').classList.remove('hidden');\n        }\n\n        function closeRandomPicker() {\n            if (isSpinning) return;\n            document.getElementById('randomPickerModal').classList.add('hidden');\n        }\n\n        function spinRandomPicker() {\n            if (isSpinning || students.length === 0) return;\n            isSpinning = true;\n\n            const nameDisplay = document.getElementById('pickerName');\n            const spinBtn = document.getElementById('spinBtn');\n            spinBtn.disabled = true;\n            spinBtn.classList.add('opacity-50');\n\n            let counter = 0;\n            const totalSpeed = 25; // number of tick iterations\n            const interval = setInterval(() =&gt; {\n                const randomIndex = Math.floor(Math.random() * students.length);\n                nameDisplay.innerText = students[randomIndex].name;\n                playPopSound();\n                counter++;\n\n                if (counter &gt;= totalSpeed) {\n                    clearInterval(interval);\n                    const chosen = students[Math.floor(Math.random() * students.length)];\n                    nameDisplay.innerText = chosen.name;\n                    playMilestoneFanfare();\n                    triggerConfetti();\n                    isSpinning = false;\n                    spinBtn.disabled = false;\n                    spinBtn.classList.remove('opacity-50');\n                }\n            }, 100);\n        }\n\n        // Trigger Canvas Confetti\n        function triggerConfetti() {\n            if (typeof confetti === 'function') {\n                confetti({\n                    particleCount: 80,\n                    spread: 70,\n                    origin: { y: 0.6 }\n                });\n            }\n        }\n\n        // Toggle Sound Mute\n        function toggleSound() {\n            isSoundEnabled = !isSoundEnabled;\n            const icon = document.getElementById('soundIcon');\n            if (isSoundEnabled) {\n                icon.className = \"fa-solid fa-volume-high text-sky-600\";\n            } else {\n                icon.className = \"fa-solid fa-volume-xmark text-slate-400\";\n            }\n        }\n\n        // Fullscreen Toggle Helper\n        function toggleFullscreen() {\n            if (!document.fullscreenElement) {\n                document.documentElement.requestFullscreen().catch(err =&gt; {\n                    console.log(`Error attempting to enable fullscreen: ${err.message}`);\n                });\n            } else {\n                if (document.exitFullscreen) {\n                    document.exitFullscreen();\n                }\n            }\n        }\n\n        window.onload = function() {\n            initData();\n        };\n    &lt;/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;\n\u003c/textarea>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"panel view\">\n      \u003cdiv class=\"phead\">\u003cspan class=\"dot\" style=\"background:#22c55e\">\u003c/span>결과 화면 \u003csmall>· 코드가 실제로 그려진 모습\u003c/small>\u003c/div>\n      \u003cdiv class=\"pbody\">\u003ciframe id=\"frame\" title=\"결과 미리보기\">\u003c/iframe>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003cscript>\n  const editor = document.getElementById('editor');\n  const frame = document.getElementById('frame');\n  const statusEl = document.getElementById('status');\n  const ORIGINAL = editor.value;\n\n  function isFixed(code){\n    var c = code.replace(/\\s+/g,'');\n    return /student\\.stars(\\+=1|\\+\\+|=student\\.stars\\+1)/.test(c);\n  }\n\n  function checkStatus(){\n    var ok = isFixed(editor.value);\n    statusEl.className = 'status ' + (ok ? 'done' : 'todo');\n    statusEl.textContent = ok ? '🎉 성공! 코드를 정상으로 고쳤어요.' : '아직이에요 — 코드를 더 고쳐 보세요!';\n  }\n  function run(){ frame.srcdoc = editor.value; checkStatus(); }\n  function resetCode(){ editor.value = ORIGINAL; run(); }\n\n  let timer;\n  editor.addEventListener('input', function(){\n    checkStatus();\n    clearTimeout(timer); timer = setTimeout(run, 600);\n  });\n  editor.addEventListener('keydown', function(e){\n    if(e.key === 'Tab'){\n      e.preventDefault();\n      const s = editor.selectionStart, en = editor.selectionEnd;\n      editor.value = editor.value.slice(0,s) + '  ' + editor.value.slice(en);\n      editor.selectionStart = editor.selectionEnd = s + 2;\n    }\n    if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); run(); }\n  });\n  run();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "height": 980, "storage": true}, {"t": "h", "text": "힌트 - 정답 프롬포트"}, {"t": "prompt", "label": "정답 프롬프트", "text": "\"이 칭찬 스티커판 코드에서 학생 이름 버튼을 눌러도 별 개수가 안 올라가. 버튼은 눌리는데 숫자가 0 그대로야. 별을 더하는 부분을 찾아서 고쳐줘. 어디를 어떻게 바꿨는지도 알려줘.\""}]}, {"id": "appscript", "title": "앱스크립트", "parent": null, "tag": "", "desc": "", "blocks": [{"t": "html", "title": "앱스크립트란? — 화면과 구글 시트를 잇는 코드", "code": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>앱스크립트란? — 화면과 구글 시트를 잇는 코드\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n  :root{\n    --ink:#16202b; --muted:#5b6b7b; --paper:#ffffff; --stage:#e7ecf1; --line:#d7dee6;\n    --shop:#f76707; --shop-ink:#9a3d04; --shop-soft:#fff1e8;\n    --code:#5b54c9; --code-soft:#eeecfb;\n    --sheet:#188038; --sheet-soft:#e9f7ee;\n    --srv:#151b24; --srv-line:#2d3a49; --srv-text:#c3cfdc; --srv-dim:#7c8ba0;\n    --sans:'IBM Plex Sans KR', system-ui, -apple-system, sans-serif;\n    --mono:'IBM Plex Mono', ui-monospace, monospace;\n  }\n  *{box-sizing:border-box}\n  body{margin:0; background:var(--stage); color:var(--ink); font-family:var(--sans);\n       line-height:1.6; padding:24px; -webkit-font-smoothing:antialiased}\n  .wrap{max-width:960px; margin:0 auto}\n  .tag{display:inline-block; font-family:var(--mono); font-size:12.5px; letter-spacing:.03em;\n       color:var(--shop-ink); background:var(--shop-soft); border:1px solid #f7c9ac;\n       padding:4px 11px; border-radius:999px; margin-bottom:11px}\n  h1{font-size:28px; font-weight:600; margin:0 0 7px; letter-spacing:-.01em}\n  h2{font-size:20px; font-weight:600; margin:28px 0 13px; letter-spacing:-.01em}\n  .lede{margin:0 0 22px; color:var(--muted); font-size:17px; max-width:68ch}\n\n  /* three layers */\n  .flow{display:grid; grid-template-columns:1fr auto 1fr auto 1fr; align-items:stretch; gap:10px; margin-bottom:8px}\n  @media (max-width:760px){ .flow{grid-template-columns:1fr} body{padding:16px} }\n  .layer{border-radius:16px; border:1px solid var(--line); overflow:hidden; display:flex; flex-direction:column}\n  .lhead{padding:12px 15px; font-weight:600; font-size:15.5px; color:#fff; display:flex; align-items:center; gap:8px}\n  .lbody{padding:13px 15px; font-size:14px; flex:1; background:#fff}\n  .lbody .role{font-weight:600; margin:0 0 5px}\n  .lbody .sub{color:var(--muted); font-size:13px; margin:0 0 9px}\n  .chips{display:flex; flex-wrap:wrap; gap:6px}\n  .chip{font-family:var(--mono); font-size:11.5px; padding:3px 9px; border-radius:8px; background:#f2f4f7; color:var(--muted); border:1px solid var(--line)}\n  .layer.screen .lhead{background:var(--shop)}\n  .layer.script .lhead{background:var(--code)}\n  .layer.sheet  .lhead{background:var(--sheet)}\n  .arrow{display:flex; align-items:center; justify-content:center; font-family:var(--mono); color:var(--muted); font-size:20px}\n  @media (max-width:760px){ .arrow{transform:rotate(90deg); padding:2px 0} }\n\n  /* data journey wire */\n  .wire{background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:8px}\n  .lane{display:flex; align-items:center; gap:10px; margin:6px 0}\n  .lane-lbl{font-family:var(--mono); font-size:12.5px; width:64px; flex:none; font-weight:500}\n  .lane-lbl.save{color:var(--sheet)} .lane-lbl.load{color:var(--shop-ink)}\n  .end{font-size:12.5px; padding:4px 10px; border-radius:8px; flex:none; font-weight:500}\n  .end.s{background:var(--shop-soft); color:var(--shop-ink)}\n  .end.d{background:var(--sheet-soft); color:var(--sheet)}\n  .track{position:relative; flex:1; height:2px; background:var(--line); border-radius:2px}\n  .dot{position:absolute; top:50%; width:11px; height:11px; border-radius:50%; margin-top:-5.5px}\n  .dot.save{background:var(--sheet); left:0; animation:mreq 2.4s linear infinite}\n  .dot.load{background:var(--shop); left:0; animation:mres 2.4s linear infinite}\n  @keyframes mreq{0%,8%{left:2%}92%,100%{left:98%}}\n  @keyframes mres{0%,8%{left:98%}92%,100%{left:2%}}\n  .wire-cap{margin:12px 0 0; color:var(--muted); font-size:13px}\n  .wire-cap b{color:var(--code)}\n\n  /* before / after */\n  .compare{display:grid; grid-template-columns:1fr 1fr; gap:14px}\n  @media (max-width:720px){ .compare{grid-template-columns:1fr} }\n  .ba{border-radius:14px; padding:16px 18px; border:1px solid var(--line)}\n  .ba .btag{font-family:var(--mono); font-size:12px; margin-bottom:7px}\n  .ba h3{font-size:16.5px; font-weight:600; margin:0 0 4px}\n  .ba p{font-size:14px; margin:0}\n  .ba.before{background:#fff}\n  .ba.before .btag{color:var(--muted)}\n  .ba.after{background:var(--sheet-soft); border-color:#abe4c1}\n  .ba.after .btag{color:var(--sheet)}\n  .ba .note{margin-top:8px; font-size:13px; color:var(--muted)}\n\n  /* why for teachers */\n  .why{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}\n  @media (max-width:720px){ .why{grid-template-columns:1fr} }\n  .wcard{background:#fff; border:1px solid var(--line); border-radius:14px; padding:15px 16px; font-size:14px}\n  .wcard .em{font-size:24px; display:block; margin-bottom:6px}\n  .wcard b{display:block; font-size:14.5px; margin-bottom:3px}\n  .wcard span{color:var(--muted); font-size:13px}\n\n  .callout{background:var(--shop-soft); border:1px solid #f7c9ac; border-left:4px solid var(--shop);\n           border-radius:0 12px 12px 0; padding:15px 18px; font-size:15px; margin-top:26px}\n  .callout b{display:block; margin-bottom:4px; color:var(--shop-ink); font-weight:600}\n  .callout strong{color:var(--shop-ink); font-weight:600}\n  .callout.warn{background:#fff7ed; border:1px solid #fed7aa; border-left:4px solid #ea580c}\n  .callout.warn b{color:#c2410c}\n  .callout.warn strong{color:#c2410c}\n\n  @media (prefers-reduced-motion: reduce){ .dot.save,.dot.load{animation:none} .dot.load{left:98%} }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n  \u003cspan class=\"tag\">앱스크립트 · Apps Script\u003c/span>\n  \u003ch1>앱스크립트란?\u003c/h1>\n  \u003cp class=\"lede\">한 줄로, \u003cb>구글 시트를 코드로 다룰 수 있게 해주는 구글의 도구\u003c/b>예요. 지금까지 만든 화면(프론트엔드)에, 구글 시트라는 진짜 저장소를 붙여줍니다.\u003c/p>\n\n  \u003ch2>세 조각으로 보기\u003c/h2>\n  \u003cdiv class=\"flow\">\n    \u003cdiv class=\"layer screen\">\n      \u003cdiv class=\"lhead\">🖥️ 화면\u003c/div>\n      \u003cdiv class=\"lbody\">\n        \u003cp class=\"role\">프론트엔드\u003c/p>\n        \u003cp class=\"sub\">우리가 이미 만든 것. 보고 누르는 화면.\u003c/p>\n        \u003cdiv class=\"chips\">\u003cspan class=\"chip\">HTML\u003c/span>\u003cspan class=\"chip\">CSS\u003c/span>\u003cspan class=\"chip\">JS\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"arrow\">↔\u003c/div>\n    \u003cdiv class=\"layer script\">\n      \u003cdiv class=\"lhead\">⚙️ 앱스크립트\u003c/div>\n      \u003cdiv class=\"lbody\">\n        \u003cp class=\"role\">서버 역할\u003c/p>\n        \u003cp class=\"sub\">화면과 시트를 잇는 코드. 저장·불러오기를 처리.\u003c/p>\n        \u003cdiv class=\"chips\">\u003cspan class=\"chip\">처리\u003c/span>\u003cspan class=\"chip\">연결\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"arrow\">↔\u003c/div>\n    \u003cdiv class=\"layer sheet\">\n      \u003cdiv class=\"lhead\">📊 구글 시트\u003c/div>\n      \u003cdiv class=\"lbody\">\n        \u003cp class=\"role\">데이터베이스\u003c/p>\n        \u003cp class=\"sub\">데이터가 실제로 저장되는 곳.\u003c/p>\n        \u003cdiv class=\"chips\">\u003cspan class=\"chip\">이름\u003c/span>\u003cspan class=\"chip\">별 개수\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"wire\">\n    \u003cdiv class=\"lane\">\n      \u003cspan class=\"lane-lbl save\">저장 →\u003c/span>\n      \u003cspan class=\"end s\">화면\u003c/span>\n      \u003cspan class=\"track\">\u003cspan class=\"dot save\">\u003c/span>\u003c/span>\n      \u003cspan class=\"end d\">구글 시트\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"lane\">\n      \u003cspan class=\"lane-lbl load\">← 불러오기\u003c/span>\n      \u003cspan class=\"end s\">화면\u003c/span>\n      \u003cspan class=\"track\">\u003cspan class=\"dot load\">\u003c/span>\u003c/span>\n      \u003cspan class=\"end d\">구글 시트\u003c/span>\n    \u003c/div>\n    \u003cp class=\"wire-cap\">화면에서 '별 +1'을 누르면 구글 시트에 \u003cb>저장\u003c/b>되고, 화면을 열면 시트에서 \u003cb>불러와\u003c/b> 보여줍니다. 이 오고 감을 가운데서 \u003cb>앱스크립트\u003c/b>가 맡아요.\u003c/p>\n  \u003c/div>\n\n  \u003ch2>무엇이 달라질까? — 저장 위치\u003c/h2>\n  \u003cdiv class=\"compare\">\n    \u003cdiv class=\"ba before\">\n      \u003cdiv class=\"btag\">지금까지\u003c/div>\n      \u003ch3>브라우저에만 저장\u003c/h3>\n      \u003cp>= 혼자 쓰는 메모장\u003c/p>\n      \u003cp class=\"note\">컴퓨터를 바꾸면 사라지고, 나만 볼 수 있어요. (지금까지 만든 앱)\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"ba after\">\n      \u003cdiv class=\"btag\">앱스크립트 + 시트\u003c/div>\n      \u003ch3>구글 시트에 저장\u003c/h3>\n      \u003cp>= 모두가 보는 학급 게시판\u003c/p>\n      \u003cp class=\"note\">어느 기기에서 열어도, 누가 열어도 같은 데이터가 보여요.\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\n  \u003ch2>교사에게 좋은 이유\u003c/h2>\n  \u003cdiv class=\"why\">\n    \u003cdiv class=\"wcard\">\u003cspan class=\"em\">🌐\u003c/span>\u003cb>설치가 필요 없어요\u003c/b>\u003cspan>구글 계정만 있으면 브라우저에서 바로 코딩·실행.\u003c/span>\u003c/div>\n    \u003cdiv class=\"wcard\">\u003cspan class=\"em\">📊\u003c/span>\u003cb>시트가 곧 데이터베이스\u003c/b>\u003cspan>이미 쓰는 구글 시트가 그대로 저장소가 돼요.\u003c/span>\u003c/div>\n    \u003cdiv class=\"wcard\">\u003cspan class=\"em\">🔗\u003c/span>\u003cb>링크로 공유\u003c/b>\u003cspan>웹앱으로 배포하면 링크 하나로 학생과 공유.\u003c/span>\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"callout warn\">\n    \u003cb>지금 칭찬판의 문제 — 별이 진짜로 저장되지 않아요\u003c/b>\n    지금 만든 칭찬판은 별을 줘도 그 컴퓨터의 브라우저에만 잠깐 남습니다. 그래서 교실 TV에서 준 별이 내 노트북에선 안 보이고, 다른 선생님이 열면 텅 비어 있어요. 브라우저 데이터를 지우면 그대로 사라지기도 하죠. 애써 준 칭찬이 안전하게 보관되지 않는 거예요.\n    \u003cbr>\u003cbr>\n    그래서 별 개수를 \u003cstrong>구글 시트\u003c/strong>에 저장합니다. 화면은 이미 만든 걸 거의 그대로 쓰고, 딱 하나 \u003cstrong>저장 위치만 브라우저 → 구글 시트\u003c/strong>로 바꿔요. 그러면 어느 기기에서 열어도, 누가 열어도 같은 별 개수가 남습니다. 이번 실습의 핵심이 바로 이 '저장 위치 하나'예요.\n  \u003c/div>\n\u003c/div>\n\u003c/body>\n\u003c/html>\n", "height": 1100}]}, {"id": "refine", "title": "AI 와 함께 프롬포트 다듬기", "parent": "appscript", "tag": "", "desc": "", "blocks": [{"t": "html", "title": "AI와 함께 프롬프트 다듬기", "code": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>앱스크립트 프롬프트 — 실제로 이렇게 해요\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n  :root{\n    --ink:#16202b; --muted:#5b6b7b; --stage:#e7ecf1; --line:#d7dee6;\n    --shop:#f76707; --shop-ink:#9a3d04; --shop-soft:#fff1e8;\n    --blue:#2563a8; --green:#16a34a; --green-soft:#f0fdf4; --sheet:#188038;\n    --srv:#151b24; --srv-text:#c3cfdc;\n    --sans:'IBM Plex Sans KR', system-ui, -apple-system, sans-serif;\n    --mono:'IBM Plex Mono', ui-monospace, monospace;\n  }\n  *{box-sizing:border-box}\n  body{margin:0; background:var(--stage); color:var(--ink); font-family:var(--sans); line-height:1.6; padding:24px; -webkit-font-smoothing:antialiased}\n  .wrap{max-width:880px; margin:0 auto}\n  .tag{display:inline-block; font-family:var(--mono); font-size:12.5px; color:var(--shop-ink); background:var(--shop-soft); border:1px solid #f7c9ac; padding:4px 11px; border-radius:999px; margin-bottom:11px}\n  h1{font-size:27px; font-weight:600; margin:0 0 7px; letter-spacing:-.01em}\n  h2{font-size:19px; font-weight:600; margin:32px 0 10px}\n  .lede{margin:0 0 18px; color:var(--muted); font-size:16.5px; max-width:66ch}\n\n  .modes{display:flex; gap:8px; margin-bottom:14px}\n  .mode{flex:1; max-width:240px; font-family:var(--sans); font-size:14.5px; font-weight:500; padding:11px 12px; border-radius:11px; border:1.5px solid var(--line); background:#fff; color:var(--muted); cursor:pointer}\n  .mode.active{border-color:var(--shop); background:var(--shop-soft); color:var(--shop-ink)}\n  .mode-desc{font-size:14px; color:var(--muted); margin:0 0 14px; background:#fff; border:1px solid var(--line); border-left:3px solid var(--shop); border-radius:0 8px 8px 0; padding:9px 13px}\n  .only-new,.only-mig{display:none}\n  body[data-mode=\"new\"] span.only-new{display:inline}\n  body[data-mode=\"migrate\"] span.only-mig{display:inline}\n  body[data-mode=\"new\"] .only-new{display:block}\n  body[data-mode=\"migrate\"] .only-mig{display:block}\n  .pbox.only-new,.pbox.only-mig{display:none}\n  body[data-mode=\"new\"] .pbox.only-new{display:block}\n  body[data-mode=\"migrate\"] .pbox.only-mig{display:block}\n  .flow{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:18px}\n  @media (max-width:640px){ .flow{grid-template-columns:1fr 1fr} body{padding:16px} }\n  .fs{background:#fff; border:1px solid var(--line); border-radius:13px; padding:13px 12px; text-align:center; border-top:4px solid var(--a)}\n  .fs .n{font-family:var(--mono); font-size:12px; color:var(--a); font-weight:600}\n  .fs .t{font-weight:600; font-size:15px; margin-top:2px}\n  .fs .s{font-size:12px; color:var(--muted); margin-top:3px}\n\n  .step{background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:12px; border-left:4px solid var(--a)}\n  .step .sh{display:flex; align-items:center; gap:10px; margin-bottom:6px}\n  .step .num{width:28px; height:28px; flex:none; border-radius:50%; background:var(--a); color:#fff; display:flex; align-items:center; justify-content:center; font-family
