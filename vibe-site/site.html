:var(--mono); font-weight:600; font-size:14px}\n  .step .st{font-weight:600; font-size:17px}\n  .step .st small{font-weight:400; color:var(--muted); font-size:13.5px; margin-left:5px}\n  .step p{font-size:15px; margin:0 0 10px}\n  .pbox{background:#0e131b; border-radius:10px; overflow:hidden; margin:8px 0}\n  .pbox .ph{display:flex; align-items:center; padding:6px 12px; background:#1d2632; font-family:var(--mono); font-size:11.5px; color:#8fb0d6}\n  .pbox .ph .sp{flex:1}\n  .cp{font-family:var(--sans); font-size:12px; padding:4px 10px; border-radius:7px; border:1px solid #4b5a6e; background:transparent; color:#c3cfdc; cursor:pointer}\n  .cp:hover{background:#2d3a49; color:#fff}\n  .pbox pre{margin:0; padding:11px 13px; font-family:var(--mono); font-size:13.5px; line-height:1.6; color:#e6ecf3; white-space:pre-wrap; word-break:break-word}\n  .pbox pre .fill{color:#fbbf24}\n  .keys{display:flex; flex-direction:column; gap:7px; margin:8px 0 12px}\n  .key{display:flex; gap:10px; align-items:flex-start; background:#f8fafc; border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:14.5px}\n  .key .kn{width:22px; height:22px; flex:none; border-radius:50%; background:var(--shop); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:12px; font-weight:600}\n  .key b{font-weight:600}\n  .key .why{display:block; color:var(--muted); font-size:13px; margin-top:1px}\n  .dtoggle{display:flex; gap:7px; margin:6px 0 8px}\n  .dt{font-family:var(--sans); font-size:13px; padding:7px 12px; border-radius:9px; border:1.5px solid var(--line); background:#fff; color:var(--muted); cursor:pointer}\n  .dt.active{border-color:var(--sheet); background:#e9f7ee; color:var(--sheet); font-weight:500}\n  .cols{display:flex; flex-direction:column; gap:6px; margin:6px 0 4px}\n  .colrow{display:flex; align-items:center; gap:7px}\n  .colrow .cl{font-family:var(--mono); font-size:12.5px; color:var(--sheet); width:32px; flex:none}\n  .colrow input{flex:1; font-family:var(--sans); font-size:14px; padding:7px 10px; border:1px solid var(--line); border-radius:8px}\n  .colrow .del{background:none; border:0; color:#c0c8d0; cursor:pointer; font-size:17px; padding:0 4px}\n  .addcol{font-family:var(--sans); font-size:12.5px; padding:5px 10px; border-radius:7px; border:1px dashed var(--sheet); background:#fff; color:var(--sheet); cursor:pointer; align-self:flex-start}\n  .appin{width:100%; font-family:var(--sans); font-size:14.5px; padding:8px 11px; border:1px solid var(--line); border-radius:9px; margin-top:4px}\n  .appin:focus{outline:2px solid var(--shop); outline-offset:1px; border-color:var(--shop)}\n  .tip{font-size:13.5px; color:var(--shop-ink); background:var(--shop-soft); border:1px solid #f7c9ac; border-radius:9px; padding:9px 12px; margin-top:8px}\n  .tip b{font-weight:600}\n  .big{background:var(--green-soft); border:1.5px solid #abe4c1; border-radius:12px; padding:14px 16px; font-size:16px; font-weight:600; color:#116932; text-align:center}\n\n  .check{background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px 20px}\n  .check p{font-size:14.5px; color:var(--muted); margin:0 0 10px}\n  .check ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}\n  .check li{display:flex; gap:9px; font-size:15px; align-items:flex-start}\n  .check li::before{content:'☐'; color:var(--muted); flex:none}\n  .check b{font-weight:600}\n  .check .hot{color:var(--shop-ink)}\n  .check .hot::before{content:'⚠'; color:var(--shop)}\n\n  /* mini practice */\n  .mini{background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden}\n  .mh{display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line); background:#f8fafc; font-size:14px; font-weight:600}\n  .mh .dot{width:9px; height:9px; border-radius:50%; background:var(--green)}\n  .mh small{font-weight:400; color:var(--muted); font-size:12.5px}\n  .mh .sp{flex:1}\n  .mr{font-family:var(--sans); font-size:12.5px; padding:5px 10px; border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--muted); cursor:pointer}\n  .mmsgs{max-height:380px; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px}\n  .mm{display:flex; gap:8px; max-width:90%}\n  .mm .av{width:26px; height:26px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-size:13px}\n  .mm.ai .av{background:#e8eef7} .mm.me{align-self:flex-end; flex-direction:row-reverse} .mm.me .av{background:var(--shop-soft)}\n  .mb{padding:9px 12px; border-radius:12px; font-size:14px; line-height:1.55; white-space:pre-wrap}\n  .mm.ai .mb{background:#f3f6fa; border-top-left-radius:3px}\n  .mm.me .mb{background:var(--shop); color:#fff; border-top-right-radius:3px}\n  .mb ul{margin:4px 0 0; padding-left:17px} .mb li{margin:1px 0}\n  .mb .q{color:var(--blue); font-weight:600}\n  .mb.final{background:#0e131b; color:#e6ecf3; font-family:var(--mono); font-size:12.5px}\n  .mcoach{align-self:center; background:#fff8ed; border:1px solid #f7d9ac; color:#7a4a0c; border-radius:10px; padding:8px 12px; font-size:13px}\n  .min{border-top:1px solid var(--line); padding:11px 14px; display:flex; flex-direction:column; gap:7px}\n  .mlbl{font-size:12px; color:var(--muted); font-family:var(--mono)}\n  .mchips{display:flex; flex-wrap:wrap; gap:6px}\n  .mc{font-family:var(--sans); font-size:13px; padding:7px 11px; border-radius:9px; border:1.5px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; text-align:left}\n  .mc:hover{border-color:var(--shop); background:#fffaf5}\n  .mc.pick.on{background:#eef4fb; border-color:var(--blue); color:var(--blue); font-weight:500}\n  .mc.pick.on::before{content:'✓ '}\n  .mc.go{background:var(--shop); color:#fff; border-color:var(--shop); font-weight:500}\n  .mc.alt{border-style:dashed; color:var(--muted)}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n  \u003cspan class=\"tag\">앱스크립트 프롬프트 · 실제로 이렇게 해요\u003c/span>\n  \u003ch1>프롬프트는 외워서 쓰는 게 아니에요\u003c/h1>\n  \u003cp class=\"lede\">실제로는 AI와 몇 마디 주고받다가 마지막에 \u003cb>\"지금까지 얘기한 거 프롬프트로 정리해줘\"\u003c/b> 하면 끝이에요. 그걸 새 대화에 붙여넣으면 코드가 나옵니다. 네 걸음이 전부예요.\u003c/p>\n\n  \u003cdiv class=\"modes\">\n    \u003cbutton class=\"mode active\" data-m=\"new\" onclick=\"setMode('new')\">✨ 새로 만들기\u003c/button>\n    \u003cbutton class=\"mode\" data-m=\"migrate\" onclick=\"setMode('migrate')\">🔄 기존 코드 옮기기\u003c/button>\n  \u003c/div>\n  \u003cp class=\"mode-desc\" id=\"modeDesc\">처음부터 만들어요. 상황만 말하고 AI와 대화하며 조건을 뽑아요.\u003c/p>\n\n  \u003cdiv class=\"flow\">\n    \u003cdiv class=\"fs\" style=\"--a:var(--blue)\">\u003cdiv class=\"n\">1\u003c/div>\u003cdiv class=\"t\">대화하기\u003c/div>\u003cdiv class=\"s\">상황 말하고 고르기\u003c/div>\u003c/div>\n    \u003cdiv class=\"fs\" style=\"--a:var(--shop)\">\u003cdiv class=\"n\">2\u003c/div>\u003cdiv class=\"t\">정리해줘\u003c/div>\u003cdiv class=\"s\">한마디\u003c/div>\u003c/div>\n    \u003cdiv class=\"fs\" style=\"--a:var(--green)\">\u003cdiv class=\"n\">3\u003c/div>\u003cdiv class=\"t\">새 대화에 넣기\u003c/div>\u003cdiv class=\"s\">코드 받기\u003c/div>\u003c/div>\n    \u003cdiv class=\"fs\" style=\"--a:var(--muted)\">\u003cdiv class=\"n\">4\u003c/div>\u003cdiv class=\"t\">막히면\u003c/div>\u003cdiv class=\"s\">뭐가 빠졌나 보기\u003c/div>\u003c/div>\n  \u003c/div>\n\n  \u003c!-- 1 -->\n  \u003cdiv class=\"step\" style=\"--a:var(--blue)\">\n    \u003cdiv class=\"sh\">\u003cspan class=\"num\">1\u003c/span>\u003cspan class=\"st\">AI와 대화하기 \u003csmall>· 조건을 몰라도 돼요\u003c/small>\u003c/span>\u003c/div>\n    \u003cp class=\"only-new\">상황만 말하면 AI가 아이디어를 펼쳐요. 그중 필요한 것만 고르고, 더 정할 게 있으면 질문받아요. 이 세 마디면 충분해요.\u003c/p>\n    \u003cp class=\"only-mig\">이미 만든 화면 코드가 있으면 그걸 붙여주고 시작해요. 화면은 그대로 두고 \u003cb>저장만 시트로\u003c/b> 바꾸는 게 핵심이라, 대화가 훨씬 짧아요.\u003c/p>\n    \u003cdiv class=\"pbox only-new\">\u003cdiv class=\"ph\">① 상황 말하기\u003cspan class=\"sp\">\u003c/span>\u003cbutton class=\"cp\" data-copy=\"p1\">복사\u003c/button>\u003c/div>\u003cpre id=\"p1\">구글 앱스크립트로 \u003cspan class=\"fill\">[무엇]\u003c/span>을 만들려고 해. \u003cspan class=\"fill\">[상황·정원 등]\u003c/span>.\n어떤 기능이나 입력 항목이 필요할까? 코드는 만들지 말고 아이디어만 알려줘.\u003c/pre>\u003c/div>\n    \u003cdiv class=\"pbox only-mig\">\u003cdiv class=\"ph\">① 코드 붙여주고 말하기\u003cspan class=\"sp\">\u003c/span>\u003cbutton class=\"cp\" data-copy=\"p1m\">복사\u003c/button>\u003c/div>\u003cpre id=\"p1m\">아래는 내가 만든 \u003cspan class=\"fill\">[무엇]\u003c/span> 앱 코드야. 지금은 브라우저에만 저장돼서 다른 기기에서 열면 기록이 없어.\n이걸 구글 앱스크립트로 옮겨서 시트에 저장되게 하려고 해. 화면은 그대로 두고 저장만 바꾸면 되는지, 더 정할 게 있는지 알려줘. 코드는 아직 만들지 마.\n\n\u003cspan class=\"fill\">[기존 코드 붙여넣기]\u003c/span>\u003c/pre>\u003c/div>\n    \u003cdiv class=\"pbox only-new\">\u003cdiv class=\"ph\">② 고르기\u003cspan class=\"sp\">\u003c/span>\u003cbutton class=\"cp\" data-copy=\"p2\">복사\u003c/button>\u003c/div>\u003cpre id=\"p2\">\u003cspan class=\"fill\">[넣을 것]\u003c/span>은 넣고, \u003cspan class=\"fill\">[뺄 것]\u003c/span>은 빼고 싶어.\n이대로 하면 실제로 쓸 때 생길 문제가 있을까?\u003c/pre>\u003c/div>\n    \u003cdiv class=\"pbox only-mig\">\u003cdiv class=\"ph\">② (원하면) 기능 더하기\u003cspan class=\"sp\">\u003c/span>\u003cbutton class=\"cp\" data-copy=\"p2m\">복사\u003c/button>\u003c/div>\u003cpre id=\"p2m\">옮기면서 \u003cspan class=\"fill\">[추가하고 싶은 것]\u003c/span>도 넣고 싶어. 기존 기능은 그대로 유지해줘.\n이대로 하면 생길 문제가 있을까?\u003c/pre>\u003c/div>\n    \u003cdiv class=\"pbox\">\u003cdiv class=\"ph\">③ 빈틈 질문받기\u003cspan class=\"sp\">\u003c/span>\u003cbutton class=\"cp\" data-copy=\"p3\">복사\u003c/button>\u003c/div>\u003cpre id=\"p3\">내가 더 정해야 할 게 있으면 한 번에 하나씩 질문해줘.\u003c/pre>\u003c/div>\n    \u003cdiv class=\"tip\">\u003cb>\"코드는 만들지 마\"\u003c/b>가 핵심이에요. 이게 없으면 첫 마디에 코드가 쏟아져서 고를 기회가 없어요. 그리고 AI가 주는 걸 \u003cb>다 넣지 마세요\u003c/b> — 고르는 건 내 몫이에요.\u003c/div>\n  \u003c/div>\n\n  \u003c!-- 2 -->\n  \u003cdiv class=\"step\" style=\"--a:var(--shop)\">\n    \u003cdiv class=\"sh\">\u003cspan class=\"num\">2\u003c/span>\u003cspan class=\"st\">\"정리해줘\" \u003csmall>· 꼭 들어갈 것과 함께\u003c/small>\u003c/span>\u003c/div>\n    \u003cp>그냥 \"정리해줘\"만 하면 핵심이 빠진 채 정리될 수 있어요. 아래 세 가지를 같이 말해요. 채우면 마지막 말이 완성됩니다.\u003c/p>\n    \u003cdiv class=\"keys\">\n      \u003cdiv class=\"key\">\u003cspan class=\"kn\">1\u003c/span>\u003cdiv>\u003cb>무엇을 만드는지\u003c/b> — \"구글 앱스크립트로 ○○ 앱\"\u003cspan class=\"why\">'구글 앱스크립트'가 빠지면 시트와 상관없는 일반 웹앱이 돼요. \u003cspan class=\"only-mig\">옮길 땐 \"화면은 그대로, 저장만 시트로\"가 자동으로 붙어요.\u003c/span>\u003c/span>\n        \u003cinput class=\"appin\" id=\"appName\" placeholder=\"예: 배드민턴 대회 신청 앱\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"key\">\u003cspan class=\"kn\">2\u003c/span>\u003cdiv>\u003cb>데이터\u003c/b> — 시트의 열 구조\u003cspan class=\"why\">안 말하면 AI가 알아서 정해요. 원하면 직접 정할 수도 있어요.\u003c/span>\n        \u003cdiv class=\"dtoggle\">\u003cbutton class=\"dt active\" data-dm=\"auto\" onclick=\"setDm('auto')\">안 말함 (AI가 알아서)\u003c/button>\u003cbutton class=\"dt\" data-dm=\"manual\" onclick=\"setDm('manual')\">직접 정하기\u003c/button>\u003c/div>\n        \u003cdiv id=\"colsWrap\" style=\"display:none\">\u003cdiv class=\"cols\" id=\"cols\">\u003c/div>\u003cbutton class=\"addcol\" onclick=\"addCol()\">+ 열 추가\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n      \u003cdiv class=\"key\">\u003cspan class=\"kn\">3\u003c/span>\u003cdiv>\u003cb>처음이니 하나씩\u003c/b> — \"코드 넣는 것부터 공유하는 것까지 하나씩 알려줘\"\u003cspan class=\"why\">이게 없으면 설명이 어려워서 못 따라가요.\u003c/span>\u003c/div>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"pbox\">\u003cdiv class=\"ph\">마지막에 보낼 말\u003cspan class=\"sp\">\u003c/span>\u003cbutton class=\"cp\" data-copy=\"p4\">복사\u003c/button>\u003c/div>\u003cpre id=\"p4\">\u003c/pre>\u003c/div>\n    \u003cdiv class=\"tip\">대화 중에 이미 말한 내용이라도 \u003cb>여기서 한 번 더\u003c/b> 말해 두면 정리에서 빠지지 않아요.\u003c/div>\n  \u003c/div>\n\n  \u003c!-- 3 -->\n  \u003cdiv class=\"step\" style=\"--a:var(--green)\">\n    \u003cdiv class=\"sh\">\u003cspan class=\"num\">3\u003c/span>\u003cspan class=\"st\">새 대화에 붙여넣기 \u003csmall>· 코드 받기\u003c/small>\u003c/span>\u003c/div>\n    \u003cp>AI가 정리해준 프롬프트를 복사해서 \u003cb>새 대화창\u003c/b>에 붙여넣으면 코드와 따라 하기 설명이 나와요. 잘 되면 그걸로 끝이에요.\u003c/p>\n    \u003cdiv class=\"big\">✓ 잘 되면 끝. 점검 안 해도 돼요.\u003c/div>\n  \u003c/div>\n\n  \u003c!-- 4 -->\n  \u003cdiv class=\"step\" style=\"--a:var(--muted)\">\n    \u003cdiv class=\"sh\">\u003cspan class=\"num\">4\u003c/span>\u003cspan class=\"st\">막혔을 때만 \u003csmall>· 뭐가 빠졌나 돌아보기\u003c/small>\u003c/span>\u003c/div>\n    \u003cp>코드가 이상하거나 설명이 어려워서 못 따라가겠으면, 프롬프트에서 뭐가 빠졌는지 한 번 봐요. 보통 아래 둘 중 하나예요.\u003c/p>\n    \u003cdiv class=\"check\">\n      \u003cp>빠진 게 있으면 AI에게 \"이것도 넣어서 다시 정리해줘\"라고 하면 돼요.\u003c/p>\n      \u003cul>\n        \u003cli class=\"hot\">\u003cspan>\u003cb>구글 앱스크립트로 ○○ 앱\u003c/b>이라고 했나? — 없으면 시트랑 상관없는 일반 웹앱이 돼요.\u003c/span>\u003c/li>\n        \u003cli class=\"hot\">\u003cspan>\u003cb>시트에 저장\u003c/b>이 들어갔나? — 대화에서 저장 얘기를 안 했으면 새로고침하면 사라지는 앱이 될 수 있어요.\u003c/span>\u003c/li>\n        \u003cli class=\"hot\">\u003cspan>\u003cb>\"하나씩 알려줘\"\u003c/b>가 들어갔나? — 없으면 설명이 어려워서 못 따라가요.\u003c/span>\u003c/li>\n        \u003cli>\u003cspan>\u003cb>어떻게 동작\u003c/b>하는지(고른 조건들)가 다 들어갔나?\u003c/span>\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n  \u003c/div>\n\n  \u003ch2>🎮 한 번 해보기 — 배드민턴 대회 신청\u003c/h2>\n  \u003cp class=\"lede\" style=\"margin-bottom:10px\">위 네 걸음을 그대로 눌러보며 익혀요. (AI 답은 미리 짜둔 연습용이에요. 익힌 뒤엔 진짜 AI에서 내 상황으로!)\u003c/p>\n  \u003cdiv class=\"mini\">\n    \u003cdiv class=\"mh\">\u003cspan class=\"dot\">\u003c/span>AI \u003csmall>· 연습용\u003c/small>\u003cspan class=\"sp\">\u003c/span>\u003cbutton class=\"mr\" onclick=\"miniStart()\">↺ 처음부터\u003c/button>\u003c/div>\n    \u003cdiv class=\"mmsgs\" id=\"mmsgs\">\u003c/div>\n    \u003cdiv class=\"min\" id=\"min\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>\n(function(){\n  /* step 2 builder */\n  var dm='auto'; var COLS=['A열','B열','C열','D열','E열','F열'];\n  window.setDm=function(m){ dm=m; document.querySelectorAll('.dt').forEach(function(b){ b.classList.toggle('active', b.dataset.dm===m); });\n    document.getElementById('colsWrap').style.display = m==='manual' ? '' : 'none';\n    if(m==='manual' && !document.querySelectorAll('#cols input').length){ addCol(); addCol(); }\n    buildP4(); };\n  window.addCol=function(){ var row=document.createElement('div'); row.className='colrow';\n    row.innerHTML='\u003cspan class=\"cl\">\u003c/span>\u003cinput type=\"text\" placeholder=\"예: 학생 이름\">\u003cbutton class=\"del\" title=\"삭제\">×\u003c/button>';\n    row.querySelector('input').addEventListener('input', buildP4);\n    row.querySelector('.del').onclick=function(){ if(document.querySelectorAll('#cols input').length>1){ row.remove(); relabel(); buildP4(); } };\n    document.getElementById('cols').appendChild(row); relabel(); buildP4(); };\n  function relabel(){ document.querySelectorAll('#cols .colrow').forEach(function(r,i){ r.querySelector('.cl').textContent=(COLS[i]||('열'+(i+1)))+':'; }); }\n  function buildP4(){\n    var app=(document.getElementById('appName').value||'').trim();\n    var lines=['지금까지 얘기한 내용을 프롬프트로 정리해줘.'];\n    if(document.body.dataset.mode==='migrate'){\n      lines.push('내가 만든 '+(app?app:'\u003cspan class=\"fill\">[○○ 앱]\u003c/span>')+' 코드를 구글 앱스크립트로 옮기는 거야. 화면은 그대로 두고 저장만 시트로 바꿔줘. 기존 기능은 유지해줘.');\n    } else {\n      lines.push('구글 앱스크립트로 '+(app?app:'\u003cspan class=\"fill\">[○○ 앱]\u003c/span>')+'을 만드는 거야.');\n    }\n    if(dm==='manual'){\n      var cs=Array.prototype.map.call(document.querySelectorAll('#cols input'), function(inp,i){ var v=inp.value.trim(); return (COLS[i]||('열'+(i+1)))+'에 '+(v?v:'\u003cspan class=\"fill\">[저장될 것]\u003c/span>'); });\n      lines.push('시트의 '+cs.join(', ')+'을 저장해줘.');\n    }\n    lines.push('코드 넣는 것부터 공유하는 것까지 하나씩 알려줘.');\n    lines.push('코드는 아직 만들지 마.');\n    if(document.body.dataset.mode==='migrate') lines.push('\\n\u003cspan class=\"fill\">[기존 코드는 맨 아래에 붙여넣기]\u003c/span>');\n    document.getElementById('p4').innerHTML=lines.join('\\n');\n  }\n  document.getElementById('appName').addEventListener('input', buildP4);\n  window.setMode=function(m){\n    document.body.dataset.mode=m;\n    document.querySelectorAll('.mode').forEach(function(b){ b.classList.toggle('active', b.dataset.m===m); });\n    document.getElementById('modeDesc').textContent = m==='new'\n      ? '처음부터 만들어요. 상황만 말하고 AI와 대화하며 조건을 뽑아요.'\n      : '이미 만든 화면 코드가 있을 때. 코드를 붙여주고, 저장만 시트로 바꿔요. 화면은 그대로!';\n    buildP4();\n  };\n  document.body.dataset.mode='new';\n  buildP4();\n\n  /* copy buttons */\n  document.querySelectorAll('.cp').forEach(function(b){\n    b.addEventListener('click', function(){\n      var text=document.getElementById(b.dataset.copy).innerText;\n      function done(){ b.textContent='복사됨!'; setTimeout(function(){ b.textContent='복사'; },1500); }\n      if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(fb); } else { fb(); }\n      function fb(){ var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){} document.body.removeChild(ta); }\n    });\n  });\n\n  /* mini practice */\n  var IDEAS=[\n    {k:'save', t:'신청 내용을 시트에 저장'},\n    {k:'name', t:'이름 입력'},\n    {k:'sid', t:'학번 입력 (필수)'},\n    {k:'phone', t:'연락처 입력'},\n    {k:'left', t:'남은 자리 표시'},\n    {k:'dup', t:'중복 신청 막기'},\n    {k:'cancel', t:'신청 취소 기능'},\n    {k:'list', t:'신청자 명단 공개'}\n  ];\n  var mmsgs=document.getElementById('mmsgs'), min=document.getElementById('min'), M;\n  function esc(s){ return s.replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/>/g,'&gt;'); }\n  function add(who, html, cls){ var d=document.createElement('div'); d.className='mm '+who; d.innerHTML='\u003cdiv class=\"av\">'+(who==='ai'?'🤖':'🙋')+'\u003c/div>\u003cdiv class=\"mb'+(cls?' '+cls:'')+'\">'+html+'\u003c/div>'; mmsgs.appendChild(d); mmsgs.scrollTop=mmsgs.scrollHeight; }\n  function coach(html){ var d=document.createElement('div'); d.className='mcoach'; d.innerHTML=html; mmsgs.appendChild(d); mmsgs.scrollTop=mmsgs.scrollHeight; }\n  function ai(html, cb, cls){ setTimeout(function(){ add('ai', html, cls); if(cb) cb(); }, 550); }\n  function chips(label, items){\n    min.innerHTML='';\n    if(label){ var l=document.createElement('div'); l.className='mlbl'; l.textContent=label; min.appendChild(l); }\n    var row=document.createElement('div'); row.className='mchips';\n    items.forEach(function(it){ var b=document.createElement('button'); b.className='mc'+(it.cls?' '+it.cls:''); b.textContent=it.t; b.onclick=it.fn; row.appendChild(b); });\n    min.appendChild(row);\n  }\n\n  window.miniStart=function(){\n    M={picked:{}, answers:[]}; mmsgs.innerHTML=''; min.innerHTML='';\n    ai('무엇을 만들고 싶으세요?', function(){\n      chips('1 · 대화하기 — 상황 말하기', [\n        {t:'구글 앱스크립트로 배드민턴 대회 신청 앱을 만들려고 해. 정원 20명. 어떤 기능이 필요할까? 코드는 만들지 말고 아이디어만.', cls:'go', fn:function(){ s1(true); }},\n        {t:'배드민턴 대회 신청 앱 만들어줘.', cls:'alt', fn:function(){ s1(false); }}\n      ]);\n    });\n  };\n  function s1(good){\n    if(!good){\n      add('me','배드민턴 대회 신청 앱 만들어줘.'); min.innerHTML='';\n      ai('function doGet(){ … }\\n/* 코드 120줄 … */', function(){\n        coach('😅 바로 코드가 쏟아졌어요. 고를 기회가 없죠. \u003cb>\"코드는 만들지 말고 아이디어만\"\u003c/b>이라고 해보세요.');\n        chips('', [{t:'다시: 코드는 만들지 말고 아이디어만 알려줘', cls:'go', fn:function(){ s1(true); }}]);\n      }, 'final'); return;\n    }\n    add('me','구글 앱스크립트로 배드민턴 대회 신청 앱을 만들려고 해. 정원 20명. 어떤 기능이 필요할까? 코드는 만들지 말고 아이디어만.'); min.innerHTML='';\n    ai('이런 것들을 생각해 볼 수 있어요.\u003cul>'+IDEAS.map(function(i){return '\u003cli>'+i.t+'\u003c/li>';}).join('')+'\u003c/ul>필요한 것만 고르세요.', function(){\n      coach('💡 AI가 펼쳤어요. 이제 \u003cb>내가 고를\u003c/b> 차례.'); s2();\n    });\n  }\n  function s2(){ IDEAS.forEach(function(i){ M.picked[i.k]=undefined; }); renderPick(); }\n  function renderPick(){\n    min.innerHTML='';\n    var l=document.createElement('div'); l.className='mlbl'; l.textContent='1 · 대화하기 — 고르기 (넣을 것을 체크)'; min.appendChild(l);\n    var row=document.createElement('div'); row.className='mchips';\n    IDEAS.forEach(function(it){ var b=document.createElement('button'); b.className='mc pick'+(M.picked[it.k]===true?' on':''); b.textContent=it.t; b.onclick=function(){ M.picked[it.k]=M.picked[it.k]===true?undefined:true; renderPick(); }; row.appendChild(b); });\n    min.appendChild(row);\n    var r2=document.createElement('div'); r2.className='mchips';\n    var go=document.createElement('button'); go.className='mc go'; go.textContent='이걸로 할게. 생길 문제가 있을까?'; go.onclick=me2; r2.appendChild(go); min.appendChild(r2);\n  }\n  function me2(){\n    var on=IDEAS.filter(function(i){return M.picked[i.k]===true;}); if(!on.length){ coach('하나 이상 골라 주세요.'); return; }\n    IDEAS.forEach(function(i){ if(M.picked[i.k]!==true) M.picked[i.k]=false; });\n    var off=IDEAS.filter(function(i){return M.picked[i.k]===false;});\n    add('me', on.map(function(i){return i.t;}).join(', ')+'은 넣고'+(off.length?', '+off.map(function(i){return i.t;}).join(', ')+'은 빼고':'')+' 싶어. 생길 문제가 있을까?'); min.innerHTML='';\n    var w=[];\n    if(!M.picked.save) w.push('\u003cb>시트에 저장\u003c/b>이 없으면 새로고침하면 다 사라져요. 앱스크립트를 쓸 이유가 없죠.');\n    if(!M.picked.sid) w.push('학번이 없으면 \u003cb>누가 신청했는지 구분이 안 돼요.\u003c/b>');\n    if(!M.picked.dup) w.push('중복을 안 막으면 \u003cb>한 학생이 여러 번 신청\u003c/b>할 수 있어요.');\n    if(M.picked.list) w.push('명단 공개는 \u003cb>다른 학생 학번이 보일 수 있어요.\u003c/b>');\n    w.push('\u003cb>정원이 다 찼을 때\u003c/b> 어떻게 할지는 아직 안 정했어요.');\n    ai('몇 가지 짚어 볼게요.\u003cul>'+w.map(function(x){return '\u003cli>'+x+'\u003c/li>';}).join('')+'\u003c/ul>', function(){\n      coach('💡 받아들일지는 내가 판단해요.');\n      chips('', [{t:'다시 골라서 고치기', cls:'alt', fn:s2},{t:'좋아. 더 정할 게 있으면 하나씩 질문해줘.', cls:'go', fn:me3}]);\n    });\n  }\n  var Q=[\n    {q:'정원 20명이 다 차면 어떻게 할까요?', opts:[{t:'\"마감되었습니다\"를 보여주고 버튼을 막아줘', a:'정원이 다 차면 신청 버튼을 막고 \"마감되었습니다\"를 보여줘.'},{t:'대기 신청을 받아줘', a:'정원이 다 차면 대기 신청으로 받아줘.'}]},\n    {q:'중복 신청은 무엇이 같을 때로 볼까요?', skipIf:function(){return !M.picked.dup;}, opts:[{t:'학번이 같으면', a:'이미 신청한 학번이면 다시 신청되지 않게 하고 \"이미 신청했습니다\"라고 알려줘.'},{t:'학번과 이름이 둘 다 같으면', a:'학번과 이름이 둘 다 같은 신청이 있으면 다시 신청되지 않게 하고 \"이미 신청했습니다\"라고 알려줘.'}]},\n    {q:'신청이 끝나면 뭐라고 알려줄까요?', opts:[{t:'\"신청 완료!\"만', a:'신청이 끝나면 \"신청 완료!\"라고 알려줘.'},{t:'\"신청 완료 · 12번째\"처럼 순번도', a:'신청이 끝나면 \"신청 완료 · 12번째\"처럼 순번과 함께 알려줘.'}]}\n  ];\n  function me3(){ add('me','좋아. 더 정할 게 있으면 하나씩 질문해줘.'); min.innerHTML=''; ask(0); }\n  function ask(i){\n    while(i\u003cQ.length && Q[i].skipIf && Q[i].skipIf()) i++;\n    if(i>=Q.length){\n      ai('다 정해진 것 같아요!', function(){\n        coach('💡 마지막 한마디. \u003cb>무엇을 만드는지\u003c/b>와 \u003cb>하나씩 알려줘\u003c/b>를 같이 말해요.');\n        chips('2 · 정리해줘', [{t:'지금까지 얘기한 내용을 프롬프트로 정리해줘. 구글 앱스크립트로 배드민턴 대회 신청 앱을 만드는 거야. 코드 넣는 것부터 공유하는 것까지 하나씩 알려줘. 코드는 아직 만들지 마.', cls:'go', fn:finish}]);\n      }); return;\n    }\n    var q=Q[i];\n    ai('\u003cspan class=\"q\">질문 '+(i+1)+'.\u003c/span> '+q.q, function(){\n      chips('1 · 대화하기 — 답하기', q.opts.map(function(o){ return {t:o.t, fn:function(){ add('me',o.t); M.answers.push(o.a); min.innerHTML=''; ask(i+1); }}; }));\n    });\n  }\n  function buildPrompt(){\n    var req=[];\n    var f=[]; if(M.picked.name) f.push('이름'); if(M.picked.sid) f.push('학번'); if(M.picked.phone) f.push('연락처');\n    if(f.length) req.push(f.join('과 ')+'을 입력받아줘.'+(M.picked.sid?' 학번이 비어 있으면 신청이 안 되게 해줘.':''));\n    if(M.picked.left) req.push('정원은 20명이고, 화면에 남은 자리를 크게 보여줘. 신청할 때마다 바로 줄어들게 해줘.');\n    if(M.picked.cancel) req.push('신청을 취소할 수 있는 버튼도 넣어줘.');\n    if(M.picked.list) req.push('신청자 명단을 화면에 보여줘.');\n    req=req.concat(M.answers);\n    return \"구글 앱스크립트로 '배드민턴 대회 참가 신청' 웹앱을 만들어줘.\\n\\n\"+\n      \"- \"+req.join(\"\\n- \")+\"\\n- 신청한 내용은 구글 시트에 저장하고, 열 때 다시 불러와서 보여줘.\\n\\n\"+\n      \"코드 넣는 것부터 공유하는 것까지 하나씩 알려줘.\";\n  }\n  function finish(){\n    add('me','지금까지 얘기한 내용을 프롬프트로 정리해줘. 구글 앱스크립트로 배드민턴 대회 신청 앱을 만드는 거야. 코드 넣는 것부터 공유하는 것까지 하나씩 알려줘. 코드는 아직 만들지 마.'); min.innerHTML='';\n    var p=buildPrompt();\n    ai(esc(p), function(){\n      coach('✓ 이걸 복사해서 \u003cb>새 대화\u003c/b>에 넣으면 코드가 나와요. 잘 되면 끝! 막히면 위 4번을 보세요.');\n      min.innerHTML='';\n      var row=document.createElement('div'); row.className='mchips';\n      var cp=document.createElement('button'); cp.className='mc go'; cp.textContent='📋 프롬프트 복사';\n      cp.onclick=function(){\n        function done(){ cp.textContent='복사됨! 새 대화에 붙여넣으세요'; setTimeout(function(){ cp.textContent='📋 프롬프트 복사'; },2000); }\n        if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(p).then(done).catch(fb); } else { fb(); }\n        function fb(){ var ta=document.createElement('textarea'); ta.value=p; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){} document.body.removeChild(ta); }\n      };\n      var again=document.createElement('button'); again.className='mc alt'; again.textContent='↺ 다른 조합으로'; again.onclick=miniStart;\n      row.appendChild(cp); row.appendChild(again); min.appendChild(row);\n    }, 'final');\n  }\n  miniStart();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "height": 1000}]}, {"id": "ex-old", "title": "앱스크립트 실습(기존코드)", "parent": "appscript", "tag": "", "desc": "", "blocks": [{"t": "h", "text": "앱스크립트 실습"}, {"t": "p", "text": "실습 1 웹앱 만들기에서 만들었던 칭찬 도장판을 기록할 수 있는 형태로 앱스크립트로 만들어주세요!"}, {"t": "p", "text": "기존 코드 활용 할 때(힌트)"}, {"t": "prompt", "label": "프롬프트", "text": "구글 앱스크립트로 이 웹앱을 옮겨줘. 화면은 그대로 두고, 저장을 구글 시트로 바꿔서 기록이 남게 해줘.\n코드는 Code.gs와 index.html로 나눠서, 각 파일에 무엇을 넣는지 알려줘. 설치하고 배포하는 방법도 단계별로 알려줘.\n아래는 기존 코드야:\n[여기에 기존 코드 붙여넣기]"}]}, {"id": "ex-new", "title": "실습(새로, 기본)", "parent": "appscript", "tag": "", "desc": "", "blocks": [{"t": "h", "text": "앱스크립트 실습"}, {"t": "h", "text": "(새로만들기)"}, {"t": "p", "text": "점심시간 배드민턴 대회 참가 신청을 받는다. 정원은 20명. 복도 게시판에 종이 신청서를 붙였더니, 같은 학생이 두 번 이름을 쓰고, 학번을 안 적은 칸도 있고, 몇 명 남았는지는 매번 세어봐야 한다. 신청하면 기록이 시트에 쌓이고, 남은 자리가 바로 보이고, 중복 신청은 막아주는 신청 앱을 만들어 보자."}, {"t": "p", "text": "조건 ① 학번 필수 입력 ② 남은 자리 표시 ③ 중복 신청 막기"}]}, {"id": "ex-adv", "title": "실습(새로, 심화)", "parent": "appscript", "tag": "", "desc": "", "blocks": [{"t": "h", "text": "앱스크립트 실습(심화)"}, {"t": "h", "text": "(새로만들기)"}, {"t": "p", "text": "배드민턴 대회가 큰 인기를 끌어 전교생 대상 2회 대회를 열기로 했다. 정원은 30명, 금요일 오후 4시 정각 선착순 오픈. 그런데 1회 때 만든 신청 앱으로는 문제가 생겼다. 공지 전에 미리 신청한 학생이 있었고, 오픈 순간 수십 명이 몰려 정원을 넘겼고, 신청한 학생들은 \"저 된 거 맞아요?\" 하고 교무실까지 찾아왔다. 기본 실습에서 만든 앱에 기능을 더해서 이 문제들을 해결해 보자."}, {"t": "p", "text": "추가 조건 ④ 관리자 페이지에서 신청 열기/닫기 ⑤ 시작·마감 시각 예약 (시작 전 카운트다운) ⑥ 내 신청 확인 (학번+이름으로 신청 여부와 몇 번째인지 확인) ⑦ 동시 신청 안전 처리"}, {"t": "h", "text": "모범 프롬포트(힌트)"}, {"t": "prompt", "label": "모범 프롬프트", "text": "아래는 구글 앱스크립트로 만든 배드민턴 대회 신청 앱 코드야.\n기존 기능(학번 필수, 남은 자리, 중복 막기)은 유지하고, 정원을 30명으로 바꾼 뒤 다음 기능을 추가해줘.\n요구사항:\n1. 관리자 페이지: 비밀번호로 들어가고, '신청 시작'·'신청 마감' 버튼으로 신청을 열고 닫는다.\n2. 시각 예약: 관리자가 시작·마감 시각을 설정하면 자동으로 열리고 닫힌다. 시작 전엔 학생 화면에 카운트다운을 보여준다. 시각 확인은 서버에서, 시간대는 한국 시간으로.\n3. 내 신청 확인: 학번과 이름이 모두 맞으면 신청 여부와 몇 번째 신청인지 보여준다.\n4. 동시 신청: LockService로 동시에 몰려도 정원을 넘지 않게 처리하고, 처리 중·마감·재시도 안내를 보여준다.\nCode.gs와 index.html 전체 코드를 알려주고, 관리자 페이지 들어가는 방법과 다시 배포하는 방법도 알려줘.\n[기존 코드 붙여넣기]"}]}, {"id": "ex-game", "title": "게임형과제(예시)", "parent": "appscript", "tag": "", "desc": "", "blocks": [{"t": "h", "text": "앱스크립트 예시"}, {"t": "links", "items": [{"label": "앱스크립트 시트", "url": "https://docs.google.com/spreadsheets/d/1V9p8x1oNPkkhmkeItCdbe6W0XVZHQGFAUxVI9jbq0ss/edit?usp=sharing"}]}, {"t": "p", "text": "팀 이름 입력(아무거나) -->  과제시작 --> 1 키워드 '팀워크'--> 2 키워드 ' 스포츠맨십 '"}, {"t": "p", "text": "원본 페이지에서는 이 자리에 아래 화면이 바로 들어 있어요. 이 사이트에서는 보안 규칙상 다른 사이트를 끼워 넣을 수 없어서 새 창으로 엽니다."}, {"t": "links", "items": [{"label": "게임형 과제 웹앱 열기", "url": "https://script.google.com/macros/s/AKfycbydwS2Y_sXrTbaVie_0W0L4wm0MUqhRJu70mlmQgj7IqW60GLZTiBC1gY2VDJUvr7D-1g/exec"}]}]}, {"id": "ex-apply", "title": "연수신청(예시)", "parent": "appscript", "tag": "", "desc": "", "blocks": [{"t": "h", "text": "앱스크립트예시"}, {"t": "h", "text": "(연수신청)"}, {"t": "p", "text": "선착순 마감 연수신청 할 때"}, {"t": "links", "items": [{"label": "연수 명단 시트", "url": "https://docs.google.com/spreadsheets/d/1pcii0JFp3MJ7e5C1_QOtON3YobRxl1mw48OGxK7qn1A/edit?usp=sharing"}]}, {"t": "p", "text": "원본 페이지에서는 이 자리에 아래 화면이 바로 들어 있어요. 이 사이트에서는 보안 규칙상 다른 사이트를 끼워 넣을 수 없어서 새 창으로 엽니다."}, {"t": "links", "items": [{"label": "연수신청 웹앱 열기", "url": "https://script.google.com/macros/s/AKfycbzRlgGkFfQGskNQsHOc7pdtO-RolUt14G74M9GkuRC--VVAZtNwBdM6KdiHoe8BK4eI/exec"}]}]}, {"id": "dddd", "title": "dddd", "parent": "appscript", "tag": "", "desc": "", "blocks": [{"t": "h", "text": "dddd"}, {"t": "h", "text": "CODE GS"}, {"t": "prompt", "label": "Code.gs (칭찬팡 도장)", "text": "/**\n * 🌟 칭찬팡 도장 - Google Apps Script 웹앱\n * 시트 구성: 학생명단 / 도장기록 / 설정\n * 사용 순서: ① 메뉴 [🌟 칭찬팡 > 초기 설정] 실행 → ② 학생명단 입력 → ③ 웹 앱으로 배포\n */\nconst SHEET_STUDENTS = '학생명단';\nconst SHEET_LOG = '도장기록';\nconst SHEET_SETTINGS = '설정';\nconst TZ = 'Asia/Seoul';\n\n/* ---------- 웹앱 진입 ---------- */\nfunction doGet() {\n  return HtmlService.createHtmlOutputFromFile('Index')\n    .setTitle('칭찬팡 도장')\n    .addMetaTag('viewport', 'width=device-width, initial-scale=1')\n    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);\n}\n\n/* ---------- 시트 메뉴 ---------- */\nfunction onOpen() {\n  SpreadsheetApp.getUi()\n    .createMenu('🌟 칭찬팡')\n    .addItem('초기 설정 (시트 만들기)', 'setup')\n    .addToUi();\n}\n\n/* ---------- 초기 설정: 필요한 시트 자동 생성 ---------- */\nfunction setup() {\n  const ss = SpreadsheetApp.getActiveSpreadsheet();\n  let st = ss.getSheetByName(SHEET_STUDENTS);\n  if (!st) {\n    st = ss.insertSheet(SHEET_STUDENTS);\n    st.getRange(1, 1, 1, 3).setValues([['반', '번호', '이름']]).setFontWeight('bold').setBackground('#fff3c4');\n    const sample = [];\n    for (let i = 1; i \u003c= 5; i++) sample.push(['1', i, '학생' + i]);\n    for (let i = 1; i \u003c= 5; i++) sample.push(['2', i, '학생' + (i + 5)]);\n    st.getRange(2, 1, sample.length, 3).setValues(sample);\n    st.getRange('A:A').setNumberFormat('@'); // 반은 글자로 저장\n    st.setFrozenRows(1);\n  }\n  let lg = ss.getSheetByName(SHEET_LOG);\n  if (!lg) {\n    lg = ss.insertSheet(SHEET_LOG);\n    lg.getRange(1, 1, 1, 5).setValues([['일시', '반', '번호', '이름', '칭찬내용']]).setFontWeight('bold').setBackground('#ffd6d6');\n    lg.setFrozenRows(1);\n  }\n  let se = ss.getSheetByName(SHEET_SETTINGS);\n  if (!se) {\n    se = ss.insertSheet(SHEET_SETTINGS);\n    se.getRange(1, 1, 4, 2).setValues([\n      ['항목', '값'],\n      ['목표도장수', 10],\n      ['칭찬항목', '수업 참여 최고, 친구를 도와줌, 바른 태도, 과제 완벽, 정리정돈, 배려왕, 끝까지 노력'],\n      ['도장문구', '참 잘했어요']\n    ]);\n    se.getRange(1, 1, 1, 2).setFontWeight('bold').setBackground('#d6ecff');\n    se.setColumnWidth(2, 500);\n  }\n  SpreadsheetApp.getActive().toast('칭찬팡 시트가 준비됐어요! 학생명단을 입력해 주세요.', '🌟 칭찬팡');\n}\n\n/* ---------- 내부 함수 ---------- */\nfunction key_(cls, num) {\n  return String(cls).trim() + '|' + String(num).trim();\n}\nfunction sheet_(name) {\n  const sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(name);\n  if (!sh) throw new Error('\"' + name + '\" 시트가 없어요. 메뉴에서 [초기 설정]을 먼저 실행해 주세요.');\n  return sh;\n}\nfunction readStudents_() {\n  const sh = sheet_(SHEET_STUDENTS);\n  const last = sh.getLastRow();\n  if (last \u003c 2) return [];\n  return sh.getRange(2, 1, last - 1, 3).getDisplayValues()\n    .filter(r => r[0] !== '' && r[2] !== '')\n    .map(r => ({ cls: String(r[0]).trim(), num: String(r[1]).trim(), name: String(r[2]).trim() }));\n}\nfunction readSettings_() {\n  const sh = sheet_(SHEET_SETTINGS);\n  const map = {};\n  const last = sh.getLastRow();\n  if (last >= 2) {\n    sh.getRange(2, 1, last - 1, 2).getDisplayValues().forEach(r => { map[String(r[0]).trim()] = r[1]; });\n  }\n  const goal = parseInt(map['목표도장수'], 10);\n  return {\n    goal: goal > 0 ? goal : 10,\n    reasons: String(map['칭찬항목'] || '참 잘했어요').split(',').map(s => s.trim()).filter(Boolean),\n    stampText: String(map['도장문구'] || '참 잘했어요').trim()\n  };\n}\nfunction computeCounts_() {\n  const sh = sheet_(SHEET_LOG);\n  const last = sh.getLastRow();\n  const counts = {};\n  if (last \u003c 2) return counts;\n  sh.getRange(2, 2, last - 1, 2).getDisplayValues().forEach(r => {\n    const k = key_(r[0], r[1]);\n    counts[k] = (counts[k] || 0) + 1;\n  });\n  return counts;\n}\n\n/* ---------- 웹앱에서 호출하는 함수 ---------- */\nfunction getInitData() {\n  return {\n    students: readStudents_(),\n    counts: computeCounts_(),\n    settings: readSettings_()\n  };\n}\n\n/** 여러 학생(1명도 가능)에게 도장 찍기 */\nfunction addStamps(list, reason) {\n  if (!list || !list.length) throw new Error('학생을 선택해 주세요.');\n  const lock = LockService.getScriptLock();\n  lock.waitLock(10000);\n  try {\n    const sh = sheet_(SHEET_LOG);\n    const now = Utilities.formatDate(new Date(), TZ, 'yyyy-MM-dd HH:mm:ss');\n    const rows = list.map(s => [now, String(s.cls), String(s.num), String(s.name), String(reason || '칭찬')]);\n    const start = sh.getLastRow() + 1;\n    sh.getRange(start, 1, rows.length, 5).setNumberFormat('@').setValues(rows);\n    SpreadsheetApp.flush();\n    return computeCounts_();\n  } finally {\n    lock.releaseLock();\n  }\n}\n\n/** 해당 학생의 가장 최근 도장 1개 취소 */\nfunction undoLast(cls, num) {\n  const lock = LockService.getScriptLock();\n  lock.waitLock(10000);\n  try {\n    const sh = sheet_(SHEET_LOG);\n    const last = sh.getLastRow();\n    if (last >= 2) {\n      const vals = sh.getRange(2, 2, last - 1, 2).getDisplayValues();\n      const target = key_(cls, num);\n      for (let i = vals.length - 1; i >= 0; i--) {\n        if (key_(vals[i][0], vals[i][1]) === target) {\n          sh.deleteRow(i + 2);\n          break;\n        }\n      }\n    }\n    SpreadsheetApp.flush();\n    return computeCounts_();\n  } finally {\n    lock.releaseLock();\n  }\n}\n\n/** 학생 한 명의 최근 칭찬 기록 (최신순 20개) */\nfunction getHistory(cls, num) {\n  const sh = sheet_(SHEET_LOG);\n  const last = sh.getLastRow();\n  if (last \u003c 2) return [];\n  const target = key_(cls, num);\n  return sh.getRange(2, 1, last - 1, 5).getDisplayValues()\n    .filter(r => key_(r[1], r[2]) === target)\n    .map(r => ({ time: r[0], reason: r[4] }))\n    .reverse()\n    .slice(0, 20);\n}\n"}, {"t": "h", "text": "index"}, {"t": "prompt", "label": "index.html (칭찬팡 도장)", "text": "\u003c!DOCTYPE html>\n\u003chtml>\n\u003chead>\n\u003cbase target=\"_top\">\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{\n--bg:#fff8ec; --card:#ffffff; --ink:#3b2f2f; --muted:#9a8b80;\n--red:#e03131; --red-soft:#ffe3e3; --yellow:#ffd43b; --line:#f1e4d0;\n--green:#2f9e44; --blue:#1c7ed6;\n}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif;padding-bottom:110px}\nheader{background:linear-gradient(135deg,#ffec99,#ffc9c9);padding:18px 16px 12px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.06)}\nh1{font-family:'Jua',sans-serif;margin:0 0 10px;font-size:28px;letter-spacing:1px}\nh1 span{color:var(--red)}\n.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}\n.tab{flex:none;border:none;background:#fff;padding:8px 16px;border-radius:999px;font-family:'Jua';font-size:16px;color:var(--ink);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08)}\n.tab.on{background:var(--red);color:#fff}\n.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;flex-wrap:wrap}\n.toolbar .sum{font-size:14px;color:var(--muted)}\n.btn{border:none;border-radius:12px;padding:9px 14px;font-family:'Jua';font-size:15px;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}\n.btn.on{background:var(--blue);color:#fff}\n.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:0 16px}\n.card{background:var(--card);border-radius:18px;padding:14px 12px;cursor:pointer;border:3px solid transparent;transition:transform .12s, border-color .12s;position:relative;user-select:none}\n.card:active{transform:scale(.97)}\n.card.sel{border-color:var(--blue);background:#e7f5ff}\n.card .num{font-size:12px;color:var(--muted)}\n.card .name{font-family:'Jua';font-size:22px;margin:2px 0 8px}\n.dots{display:flex;flex-wrap:wrap;gap:4px}\n.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}\n.dot.f{background:var(--red)}\n.card .meta{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--muted)}\n.card .meta b{color:var(--red)}\n.pangbadge{position:absolute;top:10px;right:10px;font-family:'Jua';font-size:13px;background:var(--yellow);padding:2px 8px;border-radius:999px}\n.check{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;display:none;align-items:center;justify-content:center;font-size:14px}\n.card.sel .check{display:flex}\n.card.sel .pangbadge{display:none}\n#bulkBar{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:#fff;box-shadow:0 -4px 16px rgba(0,0,0,.08);display:flex;gap:10px;align-items:center;z-index:6}\n#bulkBar .info{flex:1;font-family:'Jua';font-size:17px}\n.big{border:none;background:var(--red);color:#fff;font-family:'Jua';font-size:20px;padding:14px 22px;border-radius:16px;cursor:pointer;box-shadow:0 4px 0 #a61e1e}\n.big:active{transform:translateY(3px);box-shadow:0 1px 0 #a61e1e}\n.big:disabled{opacity:.5}\n/* 모달 */\n.overlay{position:fixed;inset:0;background:rgba(40,25,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}\n.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));position:relative;animation:up .25s ease}\n@media(min-width:640px){.overlay{align-items:center}.sheet{border-radius:24px}}\n@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}\n.close{position:absolute;top:12px;right:14px;border:none;background:none;font-size:28px;color:var(--muted);cursor:pointer}\n.sheet h2{font-family:'Jua';font-size:26px;margin:0}\n.sheet .sub{color:var(--muted);margin:4px 0 14px;font-size:14px}\n.board{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;background:#fffaf0;border:2px dashed #f2c98a;border-radius:16px;padding:12px;margin-bottom:16px}\n.slot{aspect-ratio:1;border-radius:50%;background:#fff;border:2px dashed #ead7bd;display:flex;align-items:center;justify-content:center;color:#e5d3ba;font-family:'Jua';font-size:13px}\n.label{font-family:'Jua';font-size:16px;margin:6px 0 8px}\n.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}\n.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;font-family:'Noto Sans KR'}\n.chip.on{border-color:var(--red);background:var(--red-soft);color:var(--red);font-weight:700}\n.input{width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;font-size:15px;font-family:'Noto Sans KR';margin-bottom:14px}\n.input:focus{outline:none;border-color:var(--red)}\n.sheet .big{width:100%}\n.histhead{display:flex;justify-content:space-between;align-items:center;margin-top:20px}\n.undo{border:none;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}\n.hist{list-style:none;padding:0;margin:0}\n.hist li{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}\n.hist li span:last-child{color:var(--muted);font-size:12px;flex:none}\n.empty{color:var(--muted);font-size:14px;padding:8px 2px}\n/* 도장 마크 */\n.mark{width:100%;height:100%;border-radius:50%;border:3px solid var(--red);color:var(--red);display:flex;align-items:center;justify-content:center;text-align:center;font-family:'Jua';line-height:1.05;transform:rotate(-14deg);box-shadow:inset 0 0 0 2px #fff, inset 0 0 0 4px var(--red);background:rgba(255,227,227,.35);word-break:keep-all;padding:4px}\n.slot .mark{font-size:10px}\n.slot.new .mark{animation:slam .45s cubic-bezier(.2,1.6,.4,1)}\n/* 쾅 효과 */\n.fx{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;pointer-events:none}\n.fx .mark{width:210px;height:210px;font-size:34px;border-width:7px;box-shadow:inset 0 0 0 5px #fff, inset 0 0 0 10px var(--red);background:rgba(255,255,255,.92);animation:slam .5s cubic-bezier(.2,1.6,.4,1)}\n.fx .who{margin-top:18px;font-family:'Jua';font-size:22px;background:#fff;padding:8px 18px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.12)}\n@keyframes slam{0%{transform:scale(2.6) rotate(-30deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-14deg);opacity:1}}\n.pang{font-family:'Jua';font-size:120px;color:var(--red);text-shadow:4px 4px 0 var(--yellow),8px 8px 0 rgba(0,0,0,.08);animation:pop .7s cubic-bezier(.2,1.8,.4,1)}\n.pangmsg{font-family:'Jua';font-size:24px;background:#fff;padding:10px 22px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.15);text-align:center;max-width:90vw}\n@keyframes pop{0%{transform:scale(0) rotate(-20deg)}100%{transform:scale(1) rotate(0)}}\n.confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:19;pointer-events:none;animation:fall linear forwards}\n@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}\n#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:'Jua';font-size:22px;z-index:30}\n#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;z-index:40;pointer-events:none}\n#toast.show{opacity:1}\n.hidden{display:none!important}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\n\u003ch1>칭찬\u003cspan>팡\u003c/span> 도장 🌟\u003c/h1>\n\u003cdiv class=\"tabs\" id=\"tabs\">\u003c/div>\n\u003c/header>\n\u003cdiv class=\"toolbar\">\n\u003cspan class=\"sum\" id=\"sum\">\u003c/span>\n\u003cdiv>\n\u003cbutton class=\"btn\" id=\"sortBtn\">번호순\u003c/button>\n\u003cbutton class=\"btn\" id=\"multiBtn\">여러 명 선택\u003c/button>\n\u003c/div>\n\u003c/div>\n\u003cmain class=\"grid\" id=\"grid\">\u003c/main>\n\u003cdiv id=\"bulkBar\" class=\"hidden\">\n\u003cdiv class=\"info\" id=\"bulkInfo\">0명 선택\u003c/div>\n\u003cbutton class=\"btn\" id=\"allBtn\">전체\u003c/button>\n\u003cbutton class=\"big\" id=\"bulkGo\" disabled>도장 쾅!\u003c/button>\n\u003c/div>\n\u003c!-- 도장 찍기 모달 -->\n\u003cdiv id=\"modal\" class=\"overlay hidden\">\n\u003cdiv class=\"sheet\">\n\u003cbutton class=\"close\" id=\"closeBtn\">×\u003c/button>\n\u003ch2 id=\"mTitle\">\u003c/h2>\n\u003cp class=\"sub\" id=\"mSub\">\u003c/p>\n\u003cdiv class=\"board\" id=\"board\">\u003c/div>\n\u003cdiv class=\"label\">어떤 점을 칭찬할까요?\u003c/div>\n\u003cdiv class=\"chips\" id=\"reasons\">\u003c/div>\n\u003cinput class=\"input\" id=\"custom\" placeholder=\"직접 입력하기 (입력하면 이 내용으로 저장돼요)\">\n\u003cbutton class=\"big\" id=\"stampBtn\">도장 쾅! 🔴\u003c/button>\n\u003cdiv id=\"histWrap\">\n\u003cdiv class=\"histhead\">\n\u003cspan class=\"label\">최근 칭찬 기록\u003c/span>\n\u003cbutton class=\"undo\" id=\"undoBtn\">마지막 도장 취소\u003c/button>\n\u003c/div>\n\u003cul class=\"hist\" id=\"hist\">\u003c/ul>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cdiv id=\"stampFx\" class=\"fx hidden\">\u003cdiv class=\"mark\" id=\"fxMark\">\u003c/div>\u003cdiv class=\"who\" id=\"fxWho\">\u003c/div>\u003c/div>\n\u003cdiv id=\"pangFx\" class=\"fx hidden\">\u003cdiv class=\"pang\">팡!\u003c/div>\u003cdiv class=\"pangmsg\" id=\"pangMsg\">\u003c/div>\u003c/div>\n\u003cdiv id=\"loading\">칭찬 도장 꺼내는 중… 🔴\u003c/div>\n\u003cdiv id=\"toast\">\u003c/div>\n\u003cscript>\nconst S = {\n  students: [], counts: {}, settings: {goal:10, reasons:[], stampText:'참 잘했어요'},\n  cls: null, multi: false, selected: new Set(), sort: 'num',\n  target: [], reason: null, busy: false\n};\nconst $ = id => document.getElementById(id);\nconst key = (c, n) => String(c).trim() + '|' + String(n).trim();\nconst esc = s => String(s).replace(/[&\u003c>\"']/g, m => ({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[m]));\nconst cnt = s => S.counts[key(s.cls, s.num)] || 0;\nfunction toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2000); }\nfunction fail(e){ S.busy=false; setBusy(false); toast('⚠️ ' + (e && e.message ? e.message : e)); }\nfunction setBusy(b){ $('stampBtn').disabled=b; $('bulkGo').disabled=b || S.selected.size===0; }\n/* ---------- 시작 ---------- */\nfunction load(){\n  google.script.run.withSuccessHandler(d => {\n    S.students = d.students; S.counts = d.counts; S.settings = d.settings;\n    const classes = [...new Set(d.students.map(s => s.cls))];\n    S.cls = S.cls && classes.includes(S.cls) ? S.cls : classes[0];\n    $('loading').classList.add('hidden');\n    renderTabs(); render();\n  }).withFailureHandler(e => { $('loading').textContent = '⚠️ ' + (e.message || e); }).getInitData();\n}\nfunction classList(){ return [...new Set(S.students.map(s => s.cls))]; }\nfunction renderTabs(){\n  $('tabs').innerHTML = classList().map(c =>\n    `\u003cbutton class=\"tab ${c===S.cls?'on':''}\" data-c=\"${esc(c)}\">${esc(c)}반\u003c/button>`).join('');\n  $('tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => {\n    S.cls = b.dataset.c; S.selected.clear(); renderTabs(); render();\n  });\n}\nfunction current(){\n  const list = S.students.filter(s => s.cls === S.cls);\n  if (S.sort === 'num') list.sort((a,b) => (parseInt(a.num)||0) - (parseInt(b.num)||0));\n  else list.sort((a,b) => cnt(b) - cnt(a) || (parseInt(a.num)||0) - (parseInt(b.num)||0));\n  return list;\n}\nfunction render(){\n  const g = S.settings.goal, list = current();\n  const total = list.reduce((a,s) => a + cnt(s), 0);\n  $('sum').textContent = list.length ? `${S.cls}반 · ${list.length}명 · 도장 총 ${total}개` : '학생명단 시트에 학생을 입력해 주세요';\n  $('grid').innerHTML = list.map(s => {\n    const c = cnt(s), filled = c % g, pang = Math.floor(c / g), k = key(s.cls, s.num);\n    let dots = ''; for (let i=0;i\u003cg;i++) dots += `\u003cspan class=\"dot ${i\u003cfilled?'f':''}\">\u003c/span>`;\n    return `\u003cdiv class=\"card ${S.selected.has(k)?'sel':''}\" data-k=\"${esc(k)}\">\n      ${pang ? `\u003cspan class=\"pangbadge\">🎉 팡×${pang}\u003c/span>` : ''}\n      \u003cspan class=\"check\">✓\u003c/span>\n      \u003cdiv class=\"num\">${esc(s.num)}번\u003c/div>\n      \u003cdiv class=\"name\">${esc(s.name)}\u003c/div>\n      \u003cdiv class=\"dots\">${dots}\u003c/div>\n      \u003cdiv class=\"meta\">\u003cspan>${filled}/${g}\u003c/span>\u003cspan>총 \u003cb>${c}\u003c/b>개\u003c/span>\u003c/div>\n    \u003c/div>`;\n  }).join('');\n  $('grid').querySelectorAll('.card').forEach(el => el.onclick = () => onCard(el.dataset.k));\n  $('bulkBar').classList.toggle('hidden', !S.multi);\n  $('bulkInfo').textContent = `${S.selected.size}명 선택`;\n  $('bulkGo').disabled = S.selected.size === 0;\n}\nfunction findByKey(k){ return S.students.find(s => key(s.cls, s.num) === k); }\nfunction onCard(k){\n  if (S.multi){\n    S.selected.has(k) ? S.selected.delete(k) : S.selected.add(k);\n    render(); return;\n  }\n  openModal([findByKey(k)]);\n}\n/* ---------- 모달 ---------- */\nfunction openModal(targets){\n  S.target = targets; S.reason = S.settings.reasons[0] || '칭찬';\n  $('custom').value = '';\n  const single = targets.length === 1;\n  if (single){\n    const s = targets[0];\n    $('mTitle').textContent = `${s.name}`;\n    $('mSub').textContent = `${s.cls}반 ${s.num}번 · 지금까지 도장 ${cnt(s)}개`;\n    renderBoard(false);\n    $('board').classList.remove('hidden');\n    $('histWrap').classList.remove('hidden');\n    loadHist();\n  } else {\n    $('mTitle').textContent = `${targets.length}명에게 도장`;\n    $('mSub').textContent = targets.map(s => s.name).join(', ');\n    $('board').classList.add('hidden');\n    $('histWrap').classList.add('hidden');\n  }\n  renderReasons();\n  $('modal').classList.remove('hidden');\n}\nfunction closeModal(){ $('modal').classList.add('hidden'); }\nfunction stampMark(){ return `\u003cdiv class=\"mark\">${esc(S.settings.stampText)}\u003c/div>`; }\nfunction renderBoard(animateLast){\n  const s = S.target[0], g = S.settings.goal, filled = cnt(s) % g;\n  let h = '';\n  for (let i=0;i\u003cg;i++){\n    const isNew = animateLast && i === filled - 1;\n    h += `\u003cdiv class=\"slot ${isNew?'new':''}\">${i \u003c filled ? stampMark() : (i+1)}\u003c/div>`;\n  }\n  $('board').innerHTML = h;\n}\nfunction renderReasons(){\n  $('reasons').innerHTML = S.settings.reasons.map(r =>\n    `\u003cbutton class=\"chip ${r===S.reason?'on':''}\" data-r=\"${esc(r)}\">${esc(r)}\u003c/button>`).join('');\n  $('reasons').querySelectorAll('.chip').forEach(b => b.onclick = () => {\n    S.reason = b.dataset.r; $('custom').value=''; renderReasons();\n  });\n}\nfunction loadHist(){\n  const s = S.target[0];\n  $('hist').innerHTML = '\u003cli class=\"empty\">불러오는 중…\u003c/li>';\n  google.script.run.withSuccessHandler(rows => {\n    $('hist').innerHTML = rows.length\n      ? rows.map(r => `\u003cli>\u003cspan>${esc(r.reason)}\u003c/span>\u003cspan>${esc(r.time.slice(5,16))}\u003c/span>\u003c/li>`).join('')\n      : '\u003cli class=\"empty\">아직 기록이 없어요. 첫 도장을 찍어 주세요!\u003c/li>';\n  }).withFailureHandler(fail).getHistory(s.cls, s.num);\n}\n/* ---------- 도장 찍기 ---------- */\nfunction doStamp(){\n  if (S.busy) return;\n  const reason = $('custom').value.trim() || S.reason || '칭찬';\n  const targets = S.target.slice();\n  const before = {}; targets.forEach(s => before[key(s.cls,s.num)] = cnt(s));\n  S.busy = true; setBusy(true);\n  // 먼저 효과 보여주기\n  showStampFx(targets.length === 1 ? `${targets[0].name} · ${reason}` : `${targets.length}명 · ${reason}`);\n  google.script.run.withSuccessHandler(counts => {\n    S.busy = false; setBusy(false);\n    S.counts = counts;\n    const g = S.settings.goal;\n    const done = targets.filter(s => Math.floor(cnt(s)/g) > Math.floor(before[key(s.cls,s.num)]/g));\n    if (targets.length === 1){\n      const s = targets[0];\n      $('mSub').textContent = `${s.cls}반 ${s.num}번 · 지금까지 도장 ${cnt(s)}개`;\n      renderBoard(true); loadHist();\n    } else {\n      closeModal(); S.selected.clear();\n    }\n    render();\n    if (done.length) setTimeout(() => showPang(done), 900);\n  }).withFailureHandler(fail).addStamps(targets, reason);\n}\nfunction doUndo(){\n  const s = S.target[0];\n  if (!cnt(s)) { toast('취소할 도장이 없어요'); return; }\n  if (!confirm(`${s.name} 학생의 마지막 도장을 취소할까요?`)) return;\n  google.script.run.withSuccessHandler(counts => {\n    S.counts = counts;\n    $('mSub').textContent = `${s.cls}반 ${s.num}번 · 지금까지 도장 ${cnt(s)}개`;\n    renderBoard(false); loadHist(); render(); toast('마지막 도장을 취소했어요');\n  }).withFailureHandler(fail).undoLast(s.cls, s.num);\n}\n/* ---------- 효과 ---------- */\nfunction showStampFx(who){\n  $('fxMark').textContent = S.settings.stampText;\n  $('fxWho').textContent = who;\n  const fx = $('stampFx');\n  fx.classList.remove('hidden');\n  const m = $('fxMark'); m.style.animation='none'; void m.offsetWidth; m.style.animation='';\n  if (navigator.vibrate) navigator.vibrate(40);\n  clearTimeout(fx._h); fx._h = setTimeout(() => fx.classList.add('hidden'), 850);\n}\nfunction showPang(list){\n  $('pangMsg').innerHTML = `🎉 ${list.map(s => esc(s.name)).join(', ')}\u003cbr>도장판 완성! 칭찬팡 터졌다!`;\n  const fx = $('pangFx'); fx.classList.remove('hidden');\n  confetti();\n  clearTimeout(fx._h); fx._h = setTimeout(() => fx.classList.add('hidden'), 2600);\n}\nfunction confetti(){\n  const colors = ['#e03131','#ffd43b','#40c057','#228be6','#f783ac','#ff922b'];\n  for (let i=0;i\u003c80;i++){\n    const p = document.createElement('span');\n    p.className = 'confetti';\n    p.style.left = Math.random()*100 + 'vw';\n    p.style.background = colors[i % colors.length];\n    p.style.animationDuration = (1.8 + Math.random()*1.6) + 's';\n    p.style.animationDelay = (Math.random()*0.4) + 's';\n    p.style.borderRadius = Math.random() > .5 ? '50%' : '2px';\n    document.body.appendChild(p);\n    setTimeout(() => p.remove(), 4200);\n  }\n}\n/* ---------- 버튼 연결 ---------- */\n$('closeBtn').onclick = closeModal;\n$('modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };\n$('stampBtn').onclick = doStamp;\n$('undoBtn').onclick = doUndo;\n$('custom').oninput = () => { S.reason = null; renderReasons(); if (!$('custom').value.trim()) { S.reason = S.settings.reasons[0]; renderReasons(); } };\n$('multiBtn').onclick = () => {\n  S.multi = !S.multi; S.selected.clear();\n  $('multiBtn').classList.toggle('on', S.multi);\n  $('multiBtn').textContent = S.multi ? '선택 끝내기' : '여러 명 선택';\n  render();\n};\n$('sortBtn').onclick = () => {\n  S.sort = S.sort === 'num' ? 'rank' : 'num';\n  $('sortBtn').textContent = S.sort === 'num' ? '번호순' : '도장많은순';\n  render();\n};\n$('allBtn').onclick = () => {\n  const list = current();\n  if (S.selected.size === list.length) S.selected.clear();\n  else list.forEach(s => S.selected.add(key(s.cls, s.num)));\n  render();\n};\n$('bulkGo').onclick = () => openModal([...S.selected].map(findByKey).filter(Boolean));\nload();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}]}, {"id": "api", "title": "API", "parent": null, "tag": "", "desc": "", "blocks": [{"t": "h", "text": "API"}]}, {"id": "api-prac", "title": "API 실습", "parent": "api", "tag": "", "desc": "", "blocks": [{"t": "h", "text": "API 실습"}]}, {"id": "api-concept", "title": "API 개념", "parent": "api", "tag": "", "desc": "", "blocks": [{"t": "h", "text": "API 개념"}]}, {"id": "api-ex", "title": "API활용 예시", "parent": "api", "tag": "", "desc": "", "blocks": [{"t": "h", "text": "API활용 예시"}]}]}</script>
<script id="app">
(function(){
'use strict';

var data=JSON.parse(document.getElementById('site-data').textContent);

if(!data) data={v:1,pages:[{id:'home',title:'불러오는 중…',parent:null,tag:'',desc:'',blocks:[]}]};

// Which site this page shows: /sheets → 'sheets', / → '' (the main site). ?site= wins (used right after creating a site).
var SLUG=(function(){
  try{var q=new URLSearchParams(location.search).get('site');if(q!==null)return q;}catch(e){}
  var m=location.pathname.match(/^\/([a-z0-9][a-z0-9-]*)(\.html)?\/?$/);
  return m&&m[1]!=='admin'&&m[1]!=='index'?m[1]:'';
})();
function siteHome(slug){return slug?'/'+slug:'/';}
var PREVIEW={}; // uploaded image path -> local data URL, until the next deploy serves the file
var S={cur:'home',edit:false,dirty:false,can:false,ns:null,eb:null,nav:false,arm:null,saving:false,msg:'',err:false,admin:false,token:null,ins:null,hist:[],fut:[],preview:false,q:'',menu:false,open:{}};
var PROPS={value:1,checked:1,selected:1,srcdoc:1,disabled:1,hidden:1};

function el(tag,props){
  var e=document.createElement(tag);
  for(var k in (props||{})){

function api(body){
  if(S.token) body.token=S.token;
  if(body.site===undefined) body.site=SLUG;
  return fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){
    return r.json().catch(function(){return {};}).then(function(j){
      if(r.ok) return j;
      var e=new Error(j.message||('서버 오류가 났어요 ('+r.status+')')); e.code=j.error; throw e;
    });
  });
}
function readAsDataURL(blob){return new Promise(function(ok,no){var r=new FileReader();r.onload=function(){ok(r.result);};r.onerror=function(){no(new Error('사진을 읽지 못했어요.'));};r.readAsDataURL(blob);});}
function shrink(file){
  if(file.type==='image/gif') return readAsDataURL(file);
  return readAsDataURL(file).then(function(url){return new Promise(function(ok,no){
    var im=new Image();
    im.onload=function(){
      var k=Math.min(1,1600/Math.max(im.width,im.height)), c=document.createElement('canvas');
      c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      var out=c.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',0.85);
      if(out.length>4000000) out=c.toDataURL('image/jpeg',0.85);
      ok(out);
    };
    im.onerror=function(){no(new Error('사진을 읽지 못했어요.'));};
    im.src=url;
  });});
}
function uploadImage(file){
  return shrink(file).then(function(url){
    if(!S.admin) return url; // no upload server (artifact): keep the picture inside the page data
    var m=/^data:(image\/[a-z]+);base64,(.*)$/.exec(url);
    if(!m) throw new Error('이 사진 형식은 올릴 수 없어요.');
    return api({action:'upload',type:m[1],base64:m[2]}).then(function(r){PREVIEW[r.src]=url;return r.src;});
  });
}

function say(m,err){S.msg=m;S.err=!!err;renderBar();}
function save(){
  if(S.saving) return;
  if(S.admin){
    S.saving=true; say('저장하는 중이에요…');
    api({action:'save',data:data,baseRev:data.rev||0}).then(function(r){
      data.rev=r.rev; data.updated=r.updated; orig=JSON.stringify(data); S.dirty=false; S.saving=false;
      say('저장했어요. 1~2분 뒤 모든 사람 화면에 반영돼요.');
    },function(e){
      S.saving=false;
      if(e.code==='conflict') say('다른 곳에서 먼저 저장한 내용이 있어요. 고친 내용을 따로 복사해 두고 새로고침한 뒤 다시 고쳐 주세요.',true);
      else if(e.code==='auth'){say('로그인이 끝났어요. 다시 로그인한 뒤 “저장하고 게시”를 누르세요.',true);S.token=null;store('vc-admin',null);showLogin();}
      else say(e.message||'저장하지 못했어요. 잠시 뒤 다시 눌러 주세요.',true);
    });
    return;
  }
  if(!S.ns) return;
  S.saving=true; say('저장하는 중이에요…');
  S.ns.publish(buildDoc()).then(function(){say('저장했어요. 화면이 새 버전으로 바뀝니다.');S.saving=false;},function(e){
    S.saving=false; var c=e&&e.code;
    if(c==='conflict') say('다른 편집이 먼저 저장됐어요. 화면이 최신 버전으로 바뀌고, 지금 수정한 내용은 다시 입력해야 해요.',true);
    else if(c==='not_granted'||c==='not_writer') say('이 페이지를 저장할 권한이 없어요.',true);
    else say('저장하지 못했어요. 잠시 뒤 다시 눌러 주세요.',true);
  });
}
