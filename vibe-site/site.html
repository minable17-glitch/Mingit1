<title>바이브 코딩 연수(체육)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style id="css">
/* Layout concept: dark halftone banner (like the reference Google Site), left page tree, single reading column; editors get an inline edit mode that republishes the page. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --fg:#14171c; --muted:#596070; --line:#dde0e7; --soft:#eceef3;
  --accent:#e5393a; --accent-fg:#ffffff; --accent-text:#c42a2b;
  --hero:#121418; --hero-fg:#ffffff; --hero-mute:#a7adb9;
  --tip-bg:#e6f4ec; --tip-fg:#14522f; --warn-bg:#fdf0d8; --warn-fg:#6a4300; --info-bg:#e3edfb; --info-fg:#17407a;
  --ok:#1b7f48; --bad:#c42a2b;
  --font-display:'Black Han Sans','Noto Sans KR',system-ui,sans-serif;
  --font-body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1013; --surface:#171a1f; --fg:#e9ecf1; --muted:#98a0ad; --line:#2a2f37; --soft:#1f242b;
    --accent:#ff5b59; --accent-fg:#1a0b0b; --accent-text:#ff7b79;
    --hero:#0a0b0d; --hero-fg:#ffffff; --hero-mute:#98a0ad;
    --tip-bg:#13301f; --tip-fg:#9fdcb7; --warn-bg:#3a2a0a; --warn-fg:#f1cd8a; --info-bg:#142b4d; --info-fg:#a9c8f5;
    --ok:#5ccf8f; --bad:#ff7b79;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1013; --surface:#171a1f; --fg:#e9ecf1; --muted:#98a0ad; --line:#2a2f37; --soft:#1f242b;
  --accent:#ff5b59; --accent-fg:#1a0b0b; --accent-text:#ff7b79;
  --hero:#0a0b0d; --hero-fg:#ffffff; --hero-mute:#98a0ad;
  --tip-bg:#13301f; --tip-fg:#9fdcb7; --warn-bg:#3a2a0a; --warn-fg:#f1cd8a; --info-bg:#142b4d; --info-fg:#a9c8f5;
  --ok:#5ccf8f; --bad:#ff7b79;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--hero)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (min-width:1100px){.wrap{padding-left:32px!important;padding-right:32px!important}}
.wrap{max-width:1600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--hero);color:var(--hero-fg)}
.top .wrap{display:flex;align-items:center;gap:12px;height:56px}
.burger{display:none;background:none;border:0;color:inherit;font-size:24px;line-height:1;padding:6px 8px;cursor:pointer}
.brand{font-weight:700;font-size:1.05rem;text-decoration:none;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-edit{background:transparent;border:1px solid var(--hero-mute);color:var(--hero-fg);border-radius:999px;padding:4px 14px;font-size:.9rem;cursor:pointer}
.top-edit[disabled]{border-color:var(--accent);color:var(--accent);cursor:default}

/* banner */
.banner{background-color:var(--hero);background-image:radial-gradient(rgba(255,255,255,.1) 1.2px,transparent 1.5px);background-size:7px 7px;color:var(--hero-fg);text-align:center}
.banner .wrap{padding-top:44px;padding-bottom:40px}
.banner h1{font-family:var(--font-display);font-weight:400;font-size:clamp(2.3rem,7vw,3.8rem);line-height:1.15;margin:0 0 18px;text-wrap:balance}
.banner .bar{height:8px;background:var(--accent);max-width:560px;margin:0 auto}
.banner .desc{color:var(--hero-mute);margin:16px auto 0;max-width:620px}

/* shell */
.shell{display:grid;grid-template-columns:262px minmax(0,1fr);gap:36px;padding-top:28px;padding-bottom:110px}
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);align-self:start;max-height:calc(100vh - 96px);overflow:auto;padding-right:4px}
.nav-row{display:flex;align-items:center;gap:4px}
.nav-caret{flex:none;width:28px;height:28px;border:0;border-radius:7px;background:transparent;color:var(--muted);cursor:pointer;position:relative}
.nav-caret:hover{background:var(--soft)}
.nav-caret::before{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translate(-65%,-50%) rotate(-45deg);transition:transform .15s}
.nav-caret.open::before{transform:translate(-50%,-70%) rotate(45deg)}
.nav a{display:block;flex:1;min-width:0;text-decoration:none;border-radius:8px;padding:7px 12px;color:var(--fg)}
.nav a:hover{background:var(--soft)}
.nav a.nav-top{font-weight:700;margin-top:6px}
.nav a.nav-sub{padding-left:26px;color:var(--muted);font-size:.95rem;padding-top:5px;padding-bottom:5px}
.nav a.nav-sub2{padding-left:44px;font-size:.9rem}
.nav a.nav-sub3{padding-left:62px;font-size:.86rem}
.tbox{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.tbox.soft{background:var(--soft);border-color:transparent}
.tbox.accent{border:2px solid var(--accent)}
.tbox .tt{font-weight:800;font-size:1.05rem}
.fold{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.fold>summary{cursor:pointer;list-style:none;padding:13px 16px;font-weight:700;display:flex;gap:10px;align-items:center}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"▸";color:var(--accent-text);transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .hint{margin-left:auto;color:var(--muted);font-weight:400;font-size:.85rem}
.fold[open]>summary .hint{display:none}
.fold>.fb{padding:0 16px 16px 16px}
.fold-fig{margin:14px 0 0}.fold-fig img{border:1px solid var(--line);border-radius:10px}
.fold>.fb .codebox{margin-top:2px}
.nav a.on{background:var(--soft);color:var(--accent-text);font-weight:700}
.mv{display:flex;gap:2px}
.mvb{background:var(--surface);border:1px solid var(--line);border-radius:6px;width:26px;height:26px;cursor:pointer;line-height:1;font-size:13px}
.scrim{display:none}
.addpage{margin-top:18px;padding:12px;border:1px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;gap:8px;font-size:.92rem}

/* document */
.main{min-width:0}
.doc{max-width:1240px;display:flex;flex-direction:column;gap:22px}
/* hands-on labs (code | result side by side) get the whole column width */
.doc:has(.lab){max-width:none}.doc:has(.lab)>.blk:not(:has(.lab)){max-width:1240px;width:100%}
.doc h2{font-size:1.55rem;line-height:1.35;margin:18px 0 0;font-weight:800;text-wrap:balance;padding-left:12px;border-left:5px solid var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;counter-reset:cd}
.cards.c2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card b{font-size:1.02rem;line-height:1.45}
.card .cb{color:var(--muted);font-size:.95rem;line-height:1.65}
.cards.num .card b::before{counter-increment:cd;content:counter(cd);display:inline-grid;place-items:center;width:1.6em;height:1.6em;margin-right:8px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:.8rem;vertical-align:1px}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.gallery.c2{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.gallery figure{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.gallery .frame{height:260px;background:var(--soft);border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;overflow:hidden;padding:8px}
.gallery img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.gallery figcaption{color:var(--muted);font-size:.88rem;line-height:1.5;text-align:center}
.mvb.del{color:var(--bad)}
.para{margin:0}
.doc code,.para code{font-family:var(--font-mono);font-size:.9em;background:var(--soft);padding:1px 6px;border-radius:5px}
.tag{display:inline-block;border:1px solid var(--accent);color:var(--accent-text);border-radius:999px;font-size:.82rem;padding:1px 12px;margin-bottom:14px}
.note{padding:14px 18px;border-radius:12px}
.note.tip{background:var(--tip-bg);color:var(--tip-fg)}
.note.warn{background:var(--warn-bg);color:var(--warn-fg)}
.note.info{background:var(--info-bg);color:var(--info-fg)}
.note b.chip{display:inline-block;font-size:.78rem;letter-spacing:.06em;border:1px solid currentColor;border-radius:999px;padding:0 9px;margin-right:8px;font-weight:700}

.steps{display:flex;flex-direction:column;gap:8px;counter-reset:st}
.steps details{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.steps summary{cursor:pointer;list-style:none;padding:13px 16px;font-weight:700;display:flex;gap:12px;align-items:baseline}
.steps summary::-webkit-details-marker{display:none}
.steps summary::before{counter-increment:st;content:counter(st);font-family:var(--font-mono);color:var(--accent-text);min-width:1.4em}
.steps summary::after{content:"+";margin-left:auto;color:var(--muted);font-weight:400}
.steps details[open] summary::after{content:"–"}
.steps .body{padding:0 16px 16px 50px;color:var(--fg)}

.codebox{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.codebox .hd{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--soft);font-size:.88rem;color:var(--muted)}
.codebox .hd span{flex:1;min-width:0}
.codebox pre{margin:0;padding:14px 16px;overflow-x:auto;font-family:var(--font-mono);font-size:.88rem;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:.92rem;text-decoration:none}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.small{padding:2px 10px;font-size:.85rem}
.btn[disabled]{opacity:.5;cursor:default}

.lab{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lab .hd{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;background:var(--soft)}
.lab .hd b{flex:1;min-width:8em}
.lab iframe{display:block;width:100%;border:0;background:#fff}
.lab .src{padding:12px;border-top:1px solid var(--line)}
.lab textarea{width:100%;min-height:240px}
.lab .foot{font-size:.85rem;color:var(--muted);margin-top:6px}
.lab-fail{padding:12px 16px;background:var(--warn-bg);color:var(--warn-fg);font-size:.92rem}

.quiz{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.quiz .q{margin:0;font-weight:700}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 14px;cursor:pointer}
.opt:hover:not([disabled]){background:var(--soft)}
.opt.right{border-color:var(--ok);background:var(--tip-bg);color:var(--tip-fg)}
.opt.wrong{border-color:var(--bad);background:var(--warn-bg);color:var(--warn-fg)}
.q-res{font-size:.95rem}
.qs{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;touch-action:pan-y;overflow:hidden}
.qs-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.qs-head b{flex:1;font-size:1.02rem}
.qs-dots{display:flex;gap:6px}
.qs-dot{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font:inherit;font-size:.82rem;font-weight:700;cursor:pointer;color:var(--muted)}
.qs-dot.on{border:2px solid var(--accent);color:var(--fg)}
.qs-dot.ok{background:var(--tip-bg);border-color:var(--ok);color:var(--tip-fg)}
.qs-dot.no{background:var(--warn-bg);border-color:var(--bad);color:var(--warn-fg)}
.qs-slide{display:flex;flex-direction:column;gap:10px}
.qs-slide.from-r{animation:qsR .22s ease-out}.qs-slide.from-l{animation:qsL .22s ease-out}
@keyframes qsR{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes qsL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.qs-n{font-size:.8rem;font-weight:800;color:var(--accent-text)}
.qs .q{margin:0;font-weight:700;font-size:1.05rem}
.qs .q-res{padding:10px 12px;border-radius:10px;background:var(--soft);line-height:1.6}
.qs .q-res.ok{background:var(--tip-bg);color:var(--tip-fg)}.qs .q-res.no{background:var(--warn-bg);color:var(--warn-fg)}
.qs-nav{display:flex;justify-content:space-between;gap:8px}
.qs-end{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:8px 0}
.qs-big{font-size:2.6rem;line-height:1}.qs-score{font-size:1.2rem}.qs-score b{color:var(--accent-text);font-size:1.5rem}
.qs-list{list-style:none;margin:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.qs-list li{padding:8px 10px;border-radius:10px;background:var(--soft);font-size:.92rem}
@media (prefers-reduced-motion:reduce){.qs-slide{animation:none!important}}

.links{display:flex;flex-wrap:wrap;gap:8px}
.embedbox{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.embedbox .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:var(--soft)}
.embed-frame{display:block;width:100%;border:0;background:#fff}
.zoomwrap{overflow:hidden;position:relative}
.zoomwrap>iframe{transform-origin:0 0}
.figure{margin:0}
.figure img{display:block;max-width:100%;height:auto;margin:0 auto;border-radius:12px;border:1px solid var(--line)}
.figure figcaption{color:var(--muted);font-size:.9rem;margin-top:6px;text-align:center}
.hr{border:0;border-top:1px solid var(--line);margin:6px 0;width:100%}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.nav a.is-hidden{opacity:.55}
.foot-admin{text-align:right;padding-bottom:28px;font-size:.85rem}
.foot-admin a{color:var(--muted)}
.dlg-back{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--surface);color:var(--fg);border-radius:14px;padding:20px;width:min(460px,100%);max-height:85vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dlg h3{margin:0;font-size:1.2rem}
.dlg form{display:flex;flex-direction:column;gap:10px}
.hist{display:flex;flex-direction:column;gap:8px}
.hist-row{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.hist-row small{color:var(--muted)}
.chk{display:flex;align-items:center;gap:8px}
.gbox{min-height:44px}
.top .wrap{position:relative}
.top-actions{flex-wrap:nowrap!important}
.top-more{display:none!important;font-size:1.2rem;line-height:1;padding:4px 12px!important}
.top-menu{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:52px;z-index:80;min-width:200px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.22);display:flex;flex-direction:column;overflow:hidden}
.top-menu button{background:none;border:0;border-bottom:1px solid var(--line);padding:13px 16px;text-align:left;font-size:1rem;cursor:pointer;color:inherit}
.top-menu button:last-child{border-bottom:0}.top-menu button:hover{background:var(--soft)}.top-menu .danger{color:var(--bad)}
.top-install{white-space:nowrap}
.ebtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ebtns .ic{min-width:40px;justify-content:center}
@media (max-width:860px){
  .top-wide{display:none!important}
  .top-more{display:inline-flex!important}
  .top .wrap{gap:8px}
  .editbar{padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .editbar .in{gap:6px}
  .editbar .st{flex-basis:100%;font-size:.84rem;line-height:1.4}
  .ebtns{flex-wrap:nowrap;width:100%;overflow-x:auto;scrollbar-width:none}
  .ebtns::-webkit-scrollbar{display:none}
  .ebtns .btn{padding:7px 10px;flex:0 0 auto}
  .ebtns .lbl{display:none}
  .ebtns .grow{margin-left:auto}
}
.flist{margin:4px 0;padding-left:1.4em}.flist li{margin:2px 0}
mark{background:#fff1a8;color:#3a2f00;padding:0 3px;border-radius:3px}
/* {빨강:글자} {크게:글자} text colors and sizes */
:root{--fc-red:#d42a20;--fc-blue:#1c5bd0;--fc-green:#12804a;--fc-orange:#d4520a;--fc-purple:#7034e0;--fc-gray:#6b7280}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--fc-red:#ff7a70;--fc-blue:#7fb0ff;--fc-green:#5fd497;--fc-orange:#ffa266;--fc-purple:#b998ff;--fc-gray:#a3aab6}}
.fc-red{color:var(--fc-red)}.fc-blue{color:var(--fc-blue)}.fc-green{color:var(--fc-green)}.fc-orange{color:var(--fc-orange)}.fc-purple{color:var(--fc-purple)}.fc-gray{color:var(--fc-gray)}
.fs-sm{font-size:.86em}.fs-lg{font-size:1.25em;line-height:1.45}.fs-xl{font-size:1.6em;line-height:1.35;font-weight:700}
.bg-yellow{background:#fff1a8;color:#3a2f00;padding:0 3px;border-radius:3px}
.para.pfs-sm{font-size:.92rem}.para.pfs-lg{font-size:1.15rem}.para.pfs-xl{font-size:1.35rem;line-height:1.6}
/* editor formatting toolbar */
.fbar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:5px;border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;background:var(--soft)}
.fbar+textarea{border-top-left-radius:0;border-top-right-radius:0}
.fbar button{min-width:30px;height:30px;padding:0 7px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--fg);font:inherit;font-size:.86rem;cursor:pointer;line-height:1}
.fbar button:hover{background:var(--surface);border-color:var(--line)}
.fbar .sep{width:1px;height:20px;background:var(--line);margin:0 3px}
.fbar .sw{width:22px;height:22px;min-width:22px;padding:0;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.fpv{margin-top:6px;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;background:var(--surface);font-size:.95rem}
.fpv>small{display:block;color:var(--muted);font-size:.75rem;margin-bottom:4px}
.fld.rich{display:flex;flex-direction:column;gap:4px}
.ptbox{display:inline-flex;align-items:center;gap:3px;white-space:nowrap;flex:none}.fbar .ptbox button{min-width:auto;white-space:nowrap}.ptl{font-size:.8rem;color:var(--muted)}
.ptin{width:56px;height:30px;padding:0 6px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--fg);font:inherit;font-size:.9rem}
.fbar .ptbox button{border-color:var(--line);background:var(--surface)}
.para a,.tbox a,.card a,.note a,.fold a,.col a,.site-foot a{color:var(--accent-text);text-decoration:underline}
.doc h3{font-size:1.2rem;line-height:1.4;margin:6px 0 0;font-weight:800}
.al-c{text-align:center}.al-c .flist{display:inline-block;text-align:left}
.toc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.toc b{display:block;margin-bottom:6px}
.toc a{display:block;padding:4px 0;color:var(--fg);text-decoration:none;border-bottom:1px dashed var(--line)}
.toc a:last-child{border-bottom:0}.toc a.sub{padding-left:18px;color:var(--muted);font-size:.95rem}.toc a:hover{color:var(--accent-text)}
.carousel{position:relative;border-radius:12px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}

  .tag{display:inline-block; font-size:12px; font-weight:500; color:var(--shop-ink);\n       background:var(--shop-soft); border:1px solid #f7c9ac; padding:2px 9px; border-radius:999px; margin-bottom:10px}\n\n  .stage{position:relative; display:grid; grid-template-columns:1fr 1fr; gap:16px}\n  @media (max-width:800px){ .stage{grid-template-columns:1fr} body{padding:14px} }\n\n  .panel{border-radius:16px; overflow:hidden; border:1px solid var(--line)}\n  .phead{display:flex; align-items:baseline; gap:8px; padding:12px 16px; font-weight:600; font-size:15px}\n  .phead small{font-weight:400; font-size:12.5px; opacity:.85}\n\n  /* ---- FRONTEND ---- */\n  .front{background:var(--paper)}\n  .front .phead{background:var(--shop); color:#fff}\n  .front .phead small{color:#ffe6d6}\n  .front .body{padding:16px}\n  .searchrow{display:flex; gap:8px; margin-bottom:14px}\n  .searchrow input{flex:1; min-width:0; font-family:var(--sans); font-size:15px; padding:10px 12px;\n        border:1px solid var(--line); border-radius:10px; color:var(--ink)}\n  .searchrow input:focus{outline:2px solid var(--shop); outline-offset:1px; border-color:var(--shop)}\n  .btn{font-family:var(--sans); font-size:14px; font-weight:500; border:0; border-radius:10px;\n       padding:10px 14px; cursor:pointer; transition:filter .12s}\n  .btn:hover{filter:brightness(.94)} .btn:active{filter:brightness(.88)}\n  .btn:focus-visible{outline:2px solid var(--ink); outline-offset:2px}\n  .btn.shop{background:var(--shop); color:#fff}\n  .btn.ghost{background:#fff; color:var(--ink); border:1px solid var(--line)}\n\n  .grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}\n  .card{border:1px solid var(--line); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:8px; background:#fff}\n  .card .emoji{font-size:30px; line-height:1}\n  .card .nm{font-weight:500; font-size:14.5px}\n  .card .pr{color:var(--shop-ink); font-weight:600; font-size:14px}\n  .card .soldout{font-size:12px; color:#b42318; font-weight:500}\n  .card .btn{width:100%; padding:8px}\n  .card .btn:disabled{background:#e9edf2; color:#9aa7b4; cursor:not-allowed; filter:none}\n\n  .cartbox{margin-top:14px; border-top:1px dashed var(--line); padding-top:14px}\n  .cartrow{display:flex; align-items:center; justify-content:space-between; gap:10px}\n  .cartrow .lbl{font-weight:500; font-size:14px}\n  .badge{background:var(--shop-soft); color:var(--shop-ink); border:1px solid #f7c9ac;\n         border-radius:999px; padding:2px 10px; font-weight:600; font-size:13px; font-variant-numeric:tabular-nums}\n  .total{color:var(--muted); font-size:13px; margin:8px 0 12px; font-variant-numeric:tabular-nums}\n  .btn.checkout{width:100%; background:var(--ink); color:#fff}\n  .done{margin-top:12px; background:#ecfdf3; border:1px solid #abe4c1; color:#116932;\n        border-radius:10px; padding:10px 12px; font-size:13.5px; display:none}\n  .done.show{display:block}\n\n  /* ---- BACKEND ---- */\n  .back{background:var(--srv)}\n  .back .phead{background:var(--srv-2); color:#eef3f8; border-bottom:1px solid var(--srv-line)}\n  .back .phead small{color:var(--srv-dim)}\n  .back .body{padding:14px}\n  .sublabel{font-family:var(--mono); font-size:11px; letter-spacing:.04em; color:var(--srv-dim); margin:0 0 6px}\n\n  .log{background:#0e131b; border:1px solid var(--srv-line); border-radius:10px; padding:10px 12px;\n       height:172px; overflow-y:auto; font-family:var(--mono); font-size:12.5px; line-height:1.7; margin-bottom:14px}\n  .log p{margin:0; white-space:pre-wrap; color:var(--srv-text)}\n  .log .req{color:var(--req)} .log .res{color:var(--ok)} .log .db{color:var(--warn)}\n  .log .proc{color:var(--srv-text)} .log .warn{color:#f87171}\n  .log .idle{color:var(--srv-dim)}\n\n  .tables{display:grid; grid-template-columns:1fr; gap:12px}\n  table{width:100%; border-collapse:collapse; font-size:12.5px; font-family:var(--mono)}\n  table caption{text-align:left; font-family:var(--mono); font-size:11px; letter-spacing:.04em;\n        color:var(--srv-dim); padding-bottom:5px}\n  th,td{text-align:left; padding:6px 8px; border-bottom:1px solid var(--srv-line); color:var(--srv-text)}\n  th{color:var(--srv-dim); font-weight:500}\n  td.num{text-align:right; font-variant-numeric:tabular-nums}\n  tr.flash td{animation:flash .8s ease}\n  @keyframes flash{0%{background:#3a2f12}100%{background:transparent}}\n  .empty{color:var(--srv-dim); font-family:var(--mono); font-size:12px; padding:6px 8px}\n  .orders{margin-top:2px; font-family:var(--mono); font-size:12px; color:var(--srv-dim)}\n  .orders b{color:var(--ok); font-weight:500}\n\n  /* ---- PACKET ---- */\n  .packet{position:absolute; top:0; left:0; z-index:5; pointer-events:none;\n      font-family:var(--mono); font-size:11px; font-weight:500; color:#fff;\n      padding:3px 9px; border-radius:999px; white-space:nowrap;\n      box-shadow:0 4px 12px rgba(0,0,0,.25)}\n\n  footer.legend{display:flex; flex-wrap:wrap; align-items:center; gap:14px; margin-top:16px;\n      color:var(--muted); font-size:13px}\n  .key{display:inline-flex; align-items:center; gap:6px}\n  .dot{width:11px; height:11px; border-radius:50%; display:inline-block}\n  footer .spacer{flex:1}\n  .note{margin-top:10px; font-size:12.5px; color:var(--muted); max-width:70ch}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv class=\"wrap\">\n  \u003cheader class=\"top\">\n    \u003cspan class=\"tag\">프론트엔드 ↔ 백엔드 · 수업용\u003c/span>\n    \u003ch1>보이는 쇼핑몰\u003c/h1>\n    \u003cp>왼쪽은 손님이 보는 화면(프론트엔드), 오른쪽은 평소 숨어 있는 서버와 데이터베이스(백엔드)예요.\n       버튼을 눌러 보세요. 요청이 백엔드로 날아가고, 서버가 하는 일과 재고 변화가 그대로 보입니다.\u003c/p>\n  \u003c/header>\n\n  \u003cdiv class=\"stage\" id=\"stage\">\n    \u003c!-- FRONTEND -->\n    \u003csection class=\"panel front\">\n      \u003cdiv class=\"phead\">프론트엔드 \u003csmall>· 여러분이 보고 누르는 화면\u003c/small>\u003c/div>\n      \u003cdiv class=\"body\">\n        \u003cdiv class=\"searchrow\">\n          \u003cinput id=\"kw\" type=\"text\" placeholder=\"상품 검색 (예: 운동화)\" aria-label=\"상품 검색\">\n          \u003cbutton class=\"btn shop\" id=\"searchBtn\">검색\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"grid\" id=\"products\">\u003c/div>\n\n        \u003cdiv class=\"cartbox\" id=\"cartBox\">\n          \u003cdiv class=\"cartrow\">\n            \u003cspan class=\"lbl\">장바구니\u003c/span>\n            \u003cspan class=\"badge\" id=\"cartBadge\">0개\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"total\" id=\"cartTotal\">담긴 상품 없음\u003c/div>\n          \u003cbutton class=\"btn checkout\" id=\"checkoutBtn\">결제하기\u003c/button>\n          \u003cdiv class=\"done\" id=\"done\">\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- BACKEND -->\n    \u003csection class=\"panel back\">\n      \u003cdiv class=\"phead\">백엔드 \u003csmall>· 평소엔 안 보여요\u003c/small>\u003c/div>\n      \u003cdiv class=\"body\" id=\"backendBody\">\n        \u003cp class=\"sublabel\">서버 로그 — 서버가 하는 일\u003c/p>\n        \u003cdiv class=\"log\" id=\"log\">\u003c/div>\n\n        \u003cp class=\"sublabel\">데이터베이스 — 진짜 데이터가 저장된 곳\u003c/p>\n        \u003cdiv class=\"tables\">\n          \u003ctable id=\"prodTable\">\n            \u003ccaption>상품 (products)\u003c/caption>\n            \u003cthead>\u003ctr>\u003cth>상품\u003c/th>\u003cth class=\"num\">가격\u003c/th>\u003cth class=\"num\">재고\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\u003c/tbody>\n          \u003c/table>\n          \u003cdiv>\n            \u003ctable id=\"cartTable\">\n              \u003ccaption>장바구니 (cart)\u003c/caption>\n              \u003cthead>\u003ctr>\u003cth>상품\u003c/th>\u003cth class=\"num\">수량\u003c/th>\u003c/tr>\u003c/thead>\n              \u003ctbody>\u003c/tbody>\n            \u003c/table>\n            \u003cdiv class=\"orders\" id=\"orders\">주문 완료: \u003cb>0\u003c/b>건\u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n  \u003c/div>\n\n  \u003cfooter class=\"legend\">\n    \u003cspan class=\"key\">\u003cspan class=\"dot\" style=\"background:var(--req)\">\u003c/span> 요청 (화면 → 서버)\u003c/span>\n    \u003cspan class=\"key\">\u003cspan class=\"dot\" style=\"background:var(--res)\">\u003c/span> 응답 (서버 → 화면)\u003c/span>\n    \u003cspan class=\"spacer\">\u003c/span>\n    \u003cbutton class=\"btn ghost\" id=\"resetBtn\">처음으로 되돌리기\u003c/button>\n  \u003c/footer>\n  \u003cp class=\"note\">포인트: 재고 숫자는 백엔드(오른쪽)에만 있어요. 화면은 재고를 모릅니다. 그래서 품절 여부는 서버가 판단하고, 화면은 그 응답을 받을 뿐이에요.\u003c/p>\n\u003c/div>\n\n\u003cscript>\n(function(){\n  \"use strict\";\n  const REQ=\"#f76707\", RES=\"#22c55e\";\n  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;\n  const won = n => n.toLocaleString('ko-KR') + '원';\n  const sleep = ms => new Promise(r=>setTimeout(r, reduce?0:ms));\n\n  const seed = () => ({\n    products:[\n      {id:1, name:'운동화',   emoji:'👟', price:59000, stock:5},\n      {id:2, name:'백팩',     emoji:'🎒', price:39000, stock:3},\n      {id:3, name:'텀블러',   emoji:'🥤', price:15000, stock:8},\n      {id:4, name:'무선이어폰', emoji:'🎧', price:89000, stock:2},\n    ],\n    cart:[],\n    orderCount:0\n  });\n  let db = seed();\n  let shown = db.products.map(p=>p.id); // ids currently on the frontend\n  let busy = false;\n\n  const $ = s => document.querySelector(s);\n  const stage=$('#stage'), logEl=$('#log'), backend=$('#backendBody');\n  const productsEl=$('#products'), cartBox=$('#cartBox');\n\n  function log(type, text){\n    const p=document.createElement('p');\n    p.className=type; p.textContent=text;\n    logEl.appendChild(p); logEl.scrollTop=logEl.scrollHeight;\n  }\n  function idle(){ logEl.innerHTML=''; log('idle','대기 중… 왼쪽에서 버튼을 눌러 보세요.'); }\n\n  function flyPacket(fromEl, toEl, color, label){\n    return new Promise(resolve=>{\n      if(reduce){ resolve(); return; }\n      const sb=stage.getBoundingClientRect();\n      const a=fromEl.getBoundingClientRect(), b=toEl.getBoundingClientRect();\n      const x1=a.left+a.width/2-sb.left, y1=a.top+a.height/2-sb.top;\n      const x2=b.left+b.width/2-sb.left, y2=b.top+b.height/2-sb.top;\n      const p=document.createElement('div');\n      p.className='packet'; p.textContent=label; p.style.background=color;\n      stage.appendChild(p);\n      const pw=p.offsetWidth/2, ph=p.offsetHeight/2;\n      const from=`translate(${x1-pw}px,${y1-ph}px)`, to=`translate(${x2-pw}px,${y2-ph}px)`;\n      const anim=p.animate([\n        {transform:from, opacity:0},\n        {transform:from, opacity:1, offset:.12},\n        {transform:to,   opacity:1, offset:.88},\n        {transform:to,   opacity:0}\n      ], {duration:850, easing:'cubic-bezier(.4,0,.2,1)'});\n      anim.onfinish=()=>{ p.remove(); resolve(); };\n    });\n  }\n\n  // ---------- rendering ----------\n  function renderProducts(){\n    productsEl.innerHTML='';\n    const list = db.products.filter(p=>shown.includes(p.id));\n    if(list.length===0){\n      productsEl.innerHTML='\u003cdiv style=\"grid-column:1/-1;color:var(--muted);font-size:14px;padding:8px\">검색 결과가 없어요.\u003c/div>';\n      return;\n    }\n    for(const p of list){\n      const inCart=(db.cart.find(c=>c.id===p.id)||{}).qty||0;\n      const sold = p.stock - inCart \u003c= 0;\n      const card=document.createElement('div'); card.className='card';\n      card.innerHTML=`\u003cspan class=\"emoji\">${p.emoji}\u003c/span>\n        \u003cspan class=\"nm\">${p.name}\u003c/span>\n        \u003cspan class=\"pr\">${won(p.price)}\u003c/span>\n        ${sold?'\u003cspan class=\"soldout\">품절\u003c/span>':''}\n        \u003cbutton class=\"btn shop\" data-add=\"${p.id}\" ${sold?'disabled':''}>담기\u003c/button>`;\n      productsEl.appendChild(card);\n    }\n  }\n  function cartCount(){ return db.cart.reduce((s,c)=>s+c.qty,0); }\n  function cartTotal(){ return db.cart.reduce((s,c)=>s+c.qty*db.products.find(p=>p.id===c.id).price,0); }\n  function renderCart(){\n    const n=cartCount();\n    $('#cartBadge').textContent=n+'개';\n    $('#cartTotal').textContent = n? '합계 '+won(cartTotal()) : '담긴 상품 없음';\n  }\n  function renderDB(flashId){\n    const tb=$('#prodTable tbody'); tb.innerHTML='';\n    for(const p of db.products){\n      const tr=document.createElement('tr');\n      if(flashId===p.id) tr.className='flash';\n      tr.innerHTML=`\u003ctd>${p.emoji} ${p.name}\u003c/td>\u003ctd class=\"num\">${won(p.price)}\u003c/td>\u003ctd class=\"num\">${p.stock}\u003c/td>`;\n      tb.appendChild(tr);\n    }\n    const ctb=$('#cartTable tbody'); ctb.innerHTML='';\n    if(db.cart.length===0){\n      ctb.innerHTML='\u003ctr>\u003ctd colspan=\"2\" class=\"empty\">비어 있음\u003c/td>\u003c/tr>';\n    }else{\n      for(const c of db.cart){\n        const p=db.products.find(x=>x.id===c.id);\n        ctb.innerHTML+=`\u003ctr>\u003ctd>${p.name}\u003c/td>\u003ctd class=\"num\">${c.qty}\u003c/td>\u003c/tr>`;\n      }\n    }\n    $('#orders').innerHTML='주문 완료: \u003cb>'+db.orderCount+'\u003c/b>건';\n  }\n\n  // ---------- actions (frontend talks to backend only through server()) ----------\n  async function doSearch(){\n    if(busy) return; busy=true;\n    const kw=$('#kw').value.trim();\n    log('req', '요청 받음  →  검색(\"'+(kw||'전체')+'\")');\n    await flyPacket($('#searchBtn'), backend, REQ, '요청');\n    await sleep(320);\n    const res=db.products.filter(p=>p.name.includes(kw));\n    log('db', '데이터베이스 조회  →  '+res.length+'개 상품 찾음');\n    await sleep(320);\n    log('res', '응답 전송  →  상품 목록 '+res.length+'개');\n    await flyPacket(backend, productsEl, RES, '응답');\n    shown=res.map(p=>p.id); renderProducts();\n    busy=false;\n  }\n\n  async function addToCart(id){\n    if(busy) return; busy=true;\n    const btn=document.querySelector('[data-add=\"'+id+'\"]');\n    const p=db.products.find(x=>x.id===id);\n    log('req', '요청 받음  →  장바구니 담기('+p.name+')');\n    await flyPacket(btn||$('#searchBtn'), backend, REQ, '요청');\n    await sleep(300);\n    const inCart=(db.cart.find(c=>c.id===id)||{}).qty||0;\n    if(inCart+1 > p.stock){\n      log('warn', '재고 확인  →  '+p.name+' 부족 ✕  (남은 재고 '+p.stock+'개)');\n      await sleep(280);\n      log('res', '응답 전송  →  품절 안내');\n      await flyPacket(backend, cartBox, RES, '응답');\n      renderProducts(); busy=false; return;\n    }\n    log('db', '재고 확인  →  '+p.name+' '+p.stock+'개 있음 ✓');\n    await sleep(300);\n    const item=db.cart.find(c=>c.id===id);\n    if(item) item.qty++; else db.cart.push({id, qty:1});\n    log('proc', '장바구니에 저장 완료');\n    renderDB(); await sleep(300);\n    log('res', '응답 전송  →  장바구니 '+cartCount()+'개');\n    await flyPacket(backend, $('#cartBadge'), RES, '응답');\n    renderCart(); renderProducts();\n    busy=false;\n  }\n\n  async function checkout(){\n    if(busy) return;\n    if(db.cart.length===0){ idle(); log('warn','장바구니가 비어 있어요.'); return; }\n    busy=true; $('#done').classList.remove('show');\n    log('req', '요청 받음  →  결제하기(checkout)');\n    await flyPacket($('#checkoutBtn'), backend, REQ, '요청');\n    await sleep(320);\n    for(const c of db.cart){\n      const p=db.products.find(x=>x.id===c.id);\n      p.stock-=c.qty;\n      log('db', p.name+' 재고 차감  →  남은 재고 '+p.stock+'개');\n      renderDB(p.id); await sleep(360);\n    }\n    const total=cartTotal();\n    db.orderCount++;\n    log('proc', '주문 저장 완료  →  주문번호 #'+(1000+db.orderCount));\n    db.cart=[]; renderDB(); await sleep(300);\n    log('res', '응답 전송  →  주문 완료 ('+won(total)+')');\n    await flyPacket(backend, cartBox, RES, '응답');\n    renderCart(); renderProducts();\n    const done=$('#done'); done.textContent='주문이 완료됐어요 · 주문번호 #'+(1000+db.orderCount)+' · '+won(total);\n    done.classList.add('show');\n    busy=false;\n  }\n\n  function reset(){\n    if(busy) return;\n    db=seed(); shown=db.products.map(p=>p.id);\n    $('#done').classList.remove('show');\n    renderProducts(); renderCart(); renderDB(); idle();\n  }\n\n  // ---------- events ----------\n  productsEl.addEventListener('click', e=>{\n    const b=e.target.closest('[data-add]'); if(b) addToCart(+b.dataset.add);\n  });\n  $('#searchBtn').addEventListener('click', doSearch);\n  $('#kw').addEventListener('keydown', e=>{ if(e.key==='Enter') doSearch(); });\n  $('#checkoutBtn').addEventListener('click', checkout);\n  $('#resetBtn').addEventListener('click', reset);\n\n  // ---------- init ----------\n  renderProducts(); renderCart(); renderDB(); idle();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "height": 760}]}, {"id": "frontend", "title": "프론트엔드의 구조(html.css.javascript)", "parent": "basics", "tag": "", "desc": "", "blocks": [{"t": "html", "title": "껐다 켜보는 HTML · CSS · JavaScript", "code": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>직접 만져보는 HTML · CSS · JavaScript\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n  :root{\n    --ink:#16202b; --muted:#5b6b7b; --paper:#ffffff; --stage:#e7ecf1; --line:#d7dee6;\n    --shop:#f76707; --shop-ink:#9a3d04; --shop-soft:#fff1e8;\n    --srv:#151b24; --srv-line:#2d3a49; --srv-text:#c3cfdc; --srv-dim:#7c8ba0;\n    --html:#2563a8; --css:#f76707; --js:#7c5cff;\n    --sans:'IBM Plex Sans KR', system-ui, -apple-system, sans-serif;\n    --mono:'IBM Plex Mono', ui-monospace, monospace;\n  }\n  *{box-sizing:border-box}\n  body{margin:0; background:var(--stage); color:var(--ink); font-family:var(--sans);\n       line-height:1.6; padding:22px; -webkit-font-smoothing:antialiased}\n  .wrap{max-width:960px; margin:0 auto}\n  .tag{display:inline-block; font-family:var(--mono); font-size:11.5px; letter-spacing:.03em;\n       color:var(--shop-ink); background:var(--shop-soft); border:1px solid #f7c9ac;\n       padding:3px 10px; border-radius:999px; margin-bottom:10px}\n  h1{font-size:24px; font-weight:600; margin:0 0 6px; letter-spacing:-.01em}\n  .lede{margin:0 0 20px; color:var(--muted); font-size:15px; max-width:64ch}\n\n  .stagegrid{display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start}\n  @media (max-width:800px){ .stagegrid{grid-template-columns:1fr} body{padding:15px} }\n\n  /* ---- live preview ---- */\n  .preview{background:var(--paper); border:1px solid var(--line); border-radius:14px; overflow:hidden}\n  .chrome{display:flex; align-items:center; gap:8px; padding:9px 12px; background:#f2f4f7; border-bottom:1px solid var(--line)}\n  .dots{display:flex; gap:5px}\n  .dots i{width:9px; height:9px; border-radius:50%; background:#cfd6de; display:block}\n  .addr{flex:1; font-family:var(--mono); font-size:11px; color:var(--muted); background:#fff;\n        border:1px solid var(--line); border-radius:6px; padding:3px 8px}\n  .cart{font-size:12.5px; color:var(--shop-ink); font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap}\n  .cart.pop{animation:pop .3s ease}\n  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}\n  .page{padding:22px; min-height:210px; display:flex; align-items:center; justify-content:center}\n\n  /* styled look (CSS on) */\n  .preview.styled .card{display:flex; flex-direction:column; align-items:center; gap:9px;\n      background:#fff; border:1px solid var(--line); border-radius:14px; padding:20px 26px; text-align:center}\n  .preview.styled .pv-img{font-size:56px; line-height:1}\n  .preview.styled .pv-name{font-weight:600; font-size:17px}\n  .preview.styled .pv-price{color:var(--shop-ink); font-weight:600; font-size:15px}\n  .preview.styled .pv-btn{margin-top:4px; color:#fff; border:0; cursor:pointer;\n      background:var(--btn-bg,#f76707);\n      border-radius:calc(var(--btn-radius,14) * 1px);\n      font-size:calc(var(--btn-size,14) * 1px);\n      padding:calc(var(--btn-size,14) * 0.6px) calc(var(--btn-size,14) * 1.15px);\n      font-family:var(--sans); font-weight:500; transition:filter .12s}\n  .preview.styled .pv-btn:hover{filter:brightness(.94)}\n\n  /* raw look (CSS off) — browser defaults, no colors */\n  .preview.raw .page{display:block; font-family:'Times New Roman', Times, serif}\n  .preview.raw .card{display:block}\n  .preview.raw .pv-img{font-size:40px}\n  .preview.raw .pv-name{font-size:17px; font-weight:bold; margin:6px 0}\n  .preview.raw .pv-price{margin:6px 0}\n  .preview.raw .pv-btn{margin:6px 0; font-family:var(--sans)}\n  .hidden{display:none !important}\n\n  .jsbanner{display:none; align-items:center; gap:6px; padding:9px 14px; font-size:12.5px;\n      background:#efeaff; color:#4a3aa0; border-top:1px solid #d9cffb; font-family:var(--mono)}\n  .preview.js-off .jsbanner{display:flex}\n  .pv-btn.dead{cursor:default !important}\n  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}\n  .pv-btn.shake{animation:shake .32s ease}\n\n  .pv-cart{margin-top:6px; font-size:13.5px; color:var(--muted); font-variant-numeric:tabular-nums}\n  .pv-cart b{color:var(--shop-ink); font-weight:600; font-size:15px}\n  .preview.raw .pv-cart{font-family:var(--sans)}\n  .pv-cart.pop b{animation:pop .32s ease; display:inline-block}\n\n  .layerbar{display:flex; gap:6px; margin-top:12px}\n  .lpill{font-family:var(--mono); font-size:11.5px; padding:4px 10px; border-radius:999px;\n         border:1px solid var(--line); background:#fff; color:var(--muted)}\n  .lpill.on{color:#fff; border-color:transparent}\n  .lpill.html.on{background:var(--html)} .lpill.css.on{background:var(--css)} .lpill.js.on{background:var(--js)}\n\n  /* ---- controls ---- */\n  .controls{display:flex; flex-direction:column; gap:12px}\n  .masters{background:var(--srv); border-radius:14px; padding:14px 16px; color:var(--srv-text)}\n  .masters .mrow{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:5px 0}\n  .masters .mrow + .mrow{border-top:1px solid var(--srv-line)}\n  .masters .mlabel{font-size:14px} .masters .mlabel small{display:block; color:var(--srv-dim); font-size:11.5px}\n\n  .switch{position:relative; width:44px; height:24px; flex:none; cursor:pointer}\n  .switch input{position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer}\n  .track{position:absolute; inset:0; background:#3a475a; border-radius:999px; transition:background .18s}\n  .knob{position:absolute; top:3px; left:3px; width:18px; height:18px; background:#fff; border-radius:50%; transition:transform .18s}\n  .switch input:checked + .track{background:var(--res,#22c55e)}\n  .switch input:checked ~ .knob{transform:translateX(20px)}\n  .switch input:focus-visible + .track{outline:2px solid #fff; outline-offset:2px}\n\n  .panel{background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 15px; border-top:3px solid var(--acc)}\n  .panel .head{display:flex; align-items:baseline; gap:8px; margin-bottom:10px}\n  .panel .key{font-family:var(--mono); font-size:12px; font-weight:500; color:var(--acc)}\n  .panel .role{color:var(--muted); font-size:12px}\n  .panel.off{opacity:.5}\n  .panel.off .body{pointer-events:none}\n  .offnote{font-size:12px; color:var(--muted); font-family:var(--mono)}\n\n  .checks{display:flex; flex-wrap:wrap; gap:8px 14px}\n  .checks label{display:inline-flex; align-items:center; gap:6px; font-size:13.5px; cursor:pointer}\n  .checks input{width:15px; height:15px; accent-color:var(--html)}\n\n  .field{margin:9px 0}\n  .field .flabel{display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); margin-bottom:3px}\n  .field .flabel b{color:var(--ink); font-weight:500; font-family:var(--mono)}\n  input[type=range]{width:100%; accent-color:var(--css)}\n  .swatches{display:flex; gap:7px; flex-wrap:wrap}\n  .sw{width:26px; height:26px; border-radius:7px; border:2px solid transparent; cursor:pointer; padding:0}\n  .sw[aria-pressed=true]{border-color:var(--ink)}\n  .sw:focus-visible{outline:2px solid var(--ink); outline-offset:2px}\n\n  .jsbody{font-size:13.5px}\n  .jsbody .live{margin-top:8px; font-family:var(--mono); font-size:12.5px; color:var(--muted)}\n\n  .code{font-family:var(--mono); font-size:11.5px; background:#0e131b; color:#e6ecf3;\n        border-radius:8px; padding:9px 11px; margin-top:11px; white-space:pre; overflow-x:auto; line-height:1.55}\n\n  .hint{margin-top:16px; font-size:13px; color:var(--muted); background:#fff; border:1px solid var(--line);\n        border-left:4px solid var(--shop); border-radius:0 12px 12px 0; padding:12px 15px}\n  .hint b{color:var(--ink)}\n\n  @media (prefers-reduced-motion: reduce){ .cart.pop{animation:none} .track,.knob{transition:none} }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n  \u003cspan class=\"tag\">직접 해보기\u003c/span>\n  \u003ch1>껐다 켜보는 HTML · CSS · JavaScript\u003c/h1>\n  \u003cp class=\"lede\">오른쪽 스위치로 CSS와 JavaScript를 꺼보세요. 왼쪽 상품 카드가 어떻게 변하는지 보면, 세 언어가 각자 무슨 일을 하는지 몸으로 알게 됩니다.\u003c/p>\n\n  \u003cdiv class=\"stagegrid\">\n    \u003c!-- LEFT: live preview -->\n    \u003cdiv>\n      \u003cdiv class=\"preview styled\" id=\"preview\">\n        \u003cdiv class=\"chrome\">\n          \u003cspan class=\"dots\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\n          \u003cspan class=\"addr\" id=\"addr\">shop.example\u003c/span>\n          \u003cspan class=\"cart\" id=\"cart\">🛒 0개\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"page\">\n          \u003cdiv class=\"card\" id=\"card\">\n            \u003cdiv class=\"pv-img\" id=\"el-img\">👟\u003c/div>\n            \u003cdiv class=\"pv-name\" id=\"el-name\">운동화\u003c/div>\n            \u003cdiv class=\"pv-price\" id=\"el-price\">59,000원\u003c/div>\n            \u003cbutton class=\"pv-btn\" id=\"pvBtn\">담기\u003c/button>\n            \u003cdiv class=\"pv-cart\" id=\"pvCart\">🛒 담긴 개수: \u003cb>0\u003c/b>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"jsbanner\" id=\"jsBanner\">⚡ JavaScript 꺼짐 — 담기 버튼을 눌러도 반응이 없어요\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"layerbar\">\n        \u003cspan class=\"lpill html on\" id=\"p-html\">HTML\u003c/span>\n        \u003cspan class=\"lpill css on\" id=\"p-css\">CSS\u003c/span>\n        \u003cspan class=\"lpill js on\" id=\"p-js\">JavaScript\u003c/span>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- RIGHT: controls -->\n    \u003cdiv class=\"controls\">\n      \u003cdiv class=\"masters\">\n        \u003cdiv class=\"mrow\">\n          \u003cspan class=\"mlabel\">CSS 스타일 \u003csmall>겉모습 · 꾸밈\u003c/small>\u003c/span>\n          \u003clabel class=\"switch\">\u003cinput type=\"checkbox\" id=\"cssToggle\" checked aria-label=\"CSS 스타일 켜기\">\u003cspan class=\"track\">\u003c/span>\u003cspan class=\"knob\">\u003c/span>\u003c/label>\n        \u003c/div>\n        \u003cdiv class=\"mrow\">\n          \u003cspan class=\"mlabel\">JavaScript 동작 \u003csmall>누르면 일어나는 일\u003c/small>\u003c/span>\n          \u003clabel class=\"switch\">\u003cinput type=\"checkbox\" id=\"jsToggle\" checked aria-label=\"JavaScript 동작 켜기\">\u003cspan class=\"track\">\u003c/span>\u003cspan class=\"knob\">\u003c/span>\u003c/label>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"panel\" id=\"htmlPanel\" style=\"--acc:var(--html)\">\n        \u003cdiv class=\"head\">\u003cspan class=\"key\">HTML\u003c/span>\u003cspan class=\"role\">무엇이 있는가\u003c/span>\u003c/div>\n        \u003cdiv class=\"body\">\n          \u003cdiv class=\"checks\">\n            \u003clabel>\u003cinput type=\"checkbox\" data-el=\"img\" checked> 상품 사진\u003c/label>\n            \u003clabel>\u003cinput type=\"checkbox\" data-el=\"name\" checked> 상품명\u003c/label>\n            \u003clabel>\u003cinput type=\"checkbox\" data-el=\"price\" checked> 가격\u003c/label>\n            \u003clabel>\u003cinput type=\"checkbox\" data-el=\"btn\" checked> 담기 버튼\u003c/label>\n          \u003c/div>\n          \u003cdiv class=\"code\" id=\"htmlCode\">\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"panel\" id=\"cssPanel\" style=\"--acc:var(--css)\">\n        \u003cdiv class=\"head\">\u003cspan class=\"key\">CSS\u003c/span>\u003cspan class=\"role\">어떻게 보이는가\u003c/span> \u003cspan class=\"offnote\" id=\"cssOff\" style=\"display:none\">— 꺼짐\u003c/span>\u003c/div>\n        \u003cdiv class=\"body\">\n          \u003cdiv class=\"field\">\n            \u003cdiv class=\"flabel\">버튼 색\u003c/div>\n            \u003cdiv class=\"swatches\" id=\"swatches\">\n              \u003cbutton class=\"sw\" style=\"background:#f76707\" data-c=\"#f76707\" aria-pressed=\"true\" aria-label=\"주황\">\u003c/button>\n              \u003cbutton class=\"sw\" style=\"background:#2563a8\" data-c=\"#2563a8\" aria-pressed=\"false\" aria-label=\"파랑\">\u003c/button>\n              \u003cbutton class=\"sw\" style=\"background:#16a34a\" data-c=\"#16a34a\" aria-pressed=\"false\" aria-label=\"초록\">\u003c/button>\n              \u003cbutton class=\"sw\" style=\"background:#e0518a\" data-c=\"#e0518a\" aria-pressed=\"false\" aria-label=\"분홍\">\u003c/button>\n              \u003cbutton class=\"sw\" style=\"background:#16202b\" data-c=\"#16202b\" aria-pressed=\"false\" aria-label=\"검정\">\u003c/button>\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"field\">\n            \u003cdiv class=\"flabel\">모서리 둥글기 \u003cb id=\"radiusVal\">14px\u003c/b>\u003c/div>\n            \u003cinput type=\"range\" id=\"radius\" min=\"0\" max=\"24\" value=\"14\">\n          \u003c/div>\n          \u003cdiv class=\"field\">\n            \u003cdiv class=\"flabel\">버튼 크기 \u003cb id=\"sizeVal\">14px\u003c/b>\u003c/div>\n            \u003cinput type=\"range\" id=\"size\" min=\"12\" max=\"22\" value=\"14\">\n          \u003c/div>\n          \u003cdiv class=\"code\" id=\"cssCode\">\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"panel\" id=\"jsPanel\" style=\"--acc:var(--js)\">\n        \u003cdiv class=\"head\">\u003cspan class=\"key\">JavaScript\u003c/span>\u003cspan class=\"role\">무슨 일이 일어나는가\u003c/span>\u003c/div>\n        \u003cdiv class=\"jsbody\">\n          \u003cspan id=\"jsNote\">담기 버튼을 눌러 보세요. 장바구니 숫자가 올라갑니다.\u003c/span>\n          \u003cdiv class=\"live\" id=\"jsLive\">지금까지 담은 횟수: 0\u003c/div>\n          \u003cdiv class=\"code\" id=\"jsCode\">\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"hint\">\n    \u003cb>이렇게 짚어주세요.\u003c/b> CSS를 끄면 색도 모양도 사라진 '민낯 HTML'이 드러나고, JavaScript를 끄면 버튼이 예뻐도 눌러봤자 아무 일이 없어요. HTML은 뼈대, CSS는 겉모습, JavaScript는 움직임 — 셋이 다 있어야 우리가 아는 화면이 됩니다.\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>\n(function(){\n  \"use strict\";\n  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;\n  var state = { css:true, js:true,\n    show:{img:true,name:true,price:true,btn:true},\n    color:'#f76707', radius:14, size:14, cart:0 };\n\n  var $ = function(s){ return document.querySelector(s); };\n  var preview=$('#preview'), card=$('#card'), addr=$('#addr'), cart=$('#cart');\n\n  function render(){\n    // layers\n    preview.classList.toggle('styled', state.css);\n    preview.classList.toggle('raw', !state.css);\n    preview.style.setProperty('--btn-bg', state.color);\n    preview.style.setProperty('--btn-radius', state.radius);\n    preview.style.setProperty('--btn-size', state.size);\n\n    // html show/hide\n    var elmap={img:'el-img', name:'el-name', price:'el-price', btn:'pvBtn'};\n    ['img','name','price','btn'].forEach(function(k){\n      document.getElementById(elmap[k]).classList.toggle('hidden', !state.show[k]);\n    });\n    document.getElementById('pvCart').classList.toggle('hidden', !state.show.btn);\n\n    // layer pills + address\n    $('#p-css').classList.toggle('on', state.css);\n    $('#p-js').classList.toggle('on', state.js);\n    preview.classList.toggle('js-off', !state.js);\n    $('#pvBtn').classList.toggle('dead', !state.js);\n    addr.textContent = state.css ? 'shop.example' : 'shop.example  (CSS 꺼짐 · HTML만)';\n\n    // css panel enabled state\n    $('#cssPanel').classList.toggle('off', !state.css);\n    $('#cssOff').style.display = state.css ? 'none' : 'inline';\n    $('#radiusVal').textContent = state.radius+'px';\n    $('#sizeVal').textContent = state.size+'px';\n\n    // js panel note\n    $('#jsNote').textContent = state.js\n      ? '담기 버튼을 눌러 보세요. 장바구니 숫자가 올라갑니다.'\n      : '동작이 꺼져 있어요. 버튼을 눌러도 아무 일도 없어요. 켜보세요.';\n    $('#jsLive').textContent = '지금까지 담은 횟수: ' + state.cart;\n    cart.textContent = '🛒 ' + state.cart + '개';\n    document.getElementById('pvCart').innerHTML = '🛒 담긴 개수: \u003cb>' + state.cart + '\u003c/b>';\n\n    renderCode();\n  }\n\n  function renderCode(){\n    var h=[];\n    if(state.show.img)   h.push('\u003cimg src=\"운동화.jpg\">');\n    if(state.show.name)  h.push('\u003ch3>운동화\u003c/h3>');\n    if(state.show.price) h.push('\u003cp>59,000원\u003c/p>');\n    if(state.show.btn)   h.push('\u003cbutton>담기\u003c/button>');\n    $('#htmlCode').textContent = h.length ? h.join('\\n') : '(내용이 없어요)';\n\n    $('#cssCode').textContent = state.css\n      ? '.담기버튼 {\\n  background: '+state.color+';\\n  border-radius: '+state.radius+'px;\\n  font-size: '+state.size+'px;\\n}'\n      : '/* CSS 꺼짐 — 꾸밈이 하나도 없어요 */';\n\n    $('#jsCode').textContent = state.js\n      ? '담기버튼.onclick = function() {\\n  장바구니에_담기();\\n};'\n      : '// 동작 없음 — 눌러도 반응이 없어요';\n  }\n\n  // events\n  $('#cssToggle').addEventListener('change', function(e){ state.css=e.target.checked; render(); });\n  $('#jsToggle').addEventListener('change', function(e){ state.js=e.target.checked; render(); });\n\n  document.querySelectorAll('.checks input').forEach(function(cb){\n    cb.addEventListener('change', function(){ state.show[cb.dataset.el]=cb.checked; render(); });\n  });\n\n  document.querySelectorAll('.sw').forEach(function(b){\n    b.addEventListener('click', function(){\n      state.color=b.dataset.c;\n      document.querySelectorAll('.sw').forEach(function(x){ x.setAttribute('aria-pressed', x===b?'true':'false'); });\n      render();\n    });\n  });\n  $('#radius').addEventListener('input', function(e){ state.radius=+e.target.value; render(); });\n  $('#size').addEventListener('input', function(e){ state.size=+e.target.value; render(); });\n\n  $('#pvBtn').addEventListener('click', function(){\n    if(!state.js){                     // JS off → nothing happens, just shake\n      if(!reduce){ this.classList.remove('shake'); void this.offsetWidth; this.classList.add('shake'); }\n      return;\n    }\n    state.cart++;\n    render();\n    if(!reduce){\n      cart.classList.remove('pop'); void cart.offsetWidth; cart.classList.add('pop');\n      var pc=document.getElementById('pvCart');\n      pc.classList.remove('pop'); void pc.offsetWidth; pc.classList.add('pop');\n    }\n  });\n\n  render();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "height": 760}]}, {"id": "terms", "title": "코딩 용어", "parent": "basics", "tag": "", "desc": "", "blocks": [{"t": "p", "text": "원본 페이지에서는 이 자리에 아래 화면이 바로 들어 있어요. 이 사이트에서는 보안 규칙상 다른 사이트를 끼워 넣을 수 없어서 새 창으로 엽니다."}, {"t": "links", "items": [{"label": "코딩 용어 카드 열기", "url": "https://coding-term-cards.minable17.chatgpt.site/"}]}]}, {"id": "webapp", "title": "웹앱 기초", "parent": null, "tag": "", "desc": "", "blocks": [{"t": "h", "text": "웹앱 만들기"}]}, {"id": "cases", "title": "사례", "parent": "webapp", "tag": "", "desc": "", "blocks": [{"t": "h", "text": "사례"}]}, {"id": "run", "title": "달리기 수업 웹앱", "parent": "cases", "tag": "", "desc": "", "blocks": [{"t": "h", "text": "PARA RUN"}, {"t": "p", "text": "학생으로 로그인 누르셔서 학번 9801 이름 코드테스트 1 비밀번호 123456 입력하고 어떤 구성인지 체험해보세요!"}, {"t": "p", "text": "원본 페이지에서는 이 자리에 아래 화면이 바로 들어 있어요. 이 사이트에서는 보안 규칙상 다른 사이트를 끼워 넣을 수 없어서 새 창으로 엽니다."}, {"t": "links", "items": [{"label": "달리기 수업 웹앱 열기", "url": "https://running-journal-wine.vercel.app/"}]}]}, {"id": "book", "title": "새싹책방", "parent": "cases", "tag": "", "desc": "", "blocks": [{"t": "h", "text": "새싹책방"}]}, {"id": "quiz", "title": "퀴즈형 웹앱 만들기(캔버스 구조 파악)", "parent": "webapp", "tag": "", "desc": "", "blocks": [{"t": "h", "text": "퀴즈형 웹앱 만들기(구조 파악)"}, {"t": "prompt", "label": "프롬프트", "text": "[내가 가르치는 과목-범위]의 기본 개념 학습을 위한 웹앱을 만들고 싶어 스테이지 별로 다양한 상황이 나오고, 그 상황에 따라 의사결정 및 문제를 제대로 풀었는지 평가 하고 싶어\n총 5문제를 풀게 하고 싶어 HTML 코드로 작성해줘"}]}, {"id": "make", "title": "웹앱 만들기(실습)", "parent": "webapp", "tag": "", "desc": "", "blocks": [{"t": "h", "text": "농구 타이머 만들기"}, {"t": "p", "text": "조건"}, {"t": "p", "text": "첫째, 우리 반 학생 이름 버튼들이 있을 것."}, {"t": "p", "text": "둘째, 이름 버튼을 누르면 그 학생 옆에 별(⭐)이 하나씩 늘어날 것."}, {"t": "h", "text": "완성된 프롬포트(힌트)"}, {"t": "prompt", "label": "프롬프트 예시", "text": "수업 중 교실 TV에 띄워놓을 칭찬 스티커판 웹웹을 만들어줘. 우리 반 학생 이름 버튼들이 있고, 버튼을 누를 때마다 그 학생 옆에 별(⭐)이 하나씩 늘어나게 해줘"}]}, {"id": "seat", "title": "자리배치표", "parent": "webapp", "tag": "", "desc": "", "blocks": [{"t": "h", "text": "자리배치표"}]}, {"id": "debug", "title": "디버깅", "parent": null, "tag": "", "desc": "", "blocks": [{"t": "html", "title": "버그를 찾아 고치는 법 — 디버깅", "code": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>디버깅 — 버그를 찾아 고치는 법\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n  :root{\n    --ink:#16202b; --muted:#5b6b7b; --paper:#ffffff; --stage:#e7ecf1; --line:#d7dee6;\n    --shop:#f76707; --shop-ink:#9a3d04; --shop-soft:#fff1e8;\n    --srv:#151b24; --srv-line:#2d3a49; --srv-text:#c3cfdc; --srv-dim:#7c8ba0;\n    --green:#16a34a; --green-soft:#f0fdf4; --red:#dc2626; --red-soft:#fef2f2;\n    --sans:'IBM Plex Sans KR', system-ui, -apple-system, sans-serif;\n    --mono:'IBM Plex Mono', ui-monospace, monospace;\n  }\n  *{box-sizing:border-box}\n  body{margin:0; background:var(--stage); color:var(--ink); font-family:var(--sans);\n       line-height:1.6; padding:24px; -webkit-font-smoothing:antialiased}\n  .wrap{max-width:940px; margin:0 auto}\n  .tag{display:inline-block; font-family:var(--mono); font-size:12.5px; letter-spacing:.03em;\n       color:var(--shop-ink); background:var(--shop-soft); border:1px solid #f7c9ac;\n       padding:4px 11px; border-radius:999px; margin-bottom:11px}\n  h1{font-size:28px; font-weight:600; margin:0 0 7px; letter-spacing:-.01em}\n  h2{font-size:21px; font-weight:600; margin:30px 0 14px; letter-spacing:-.01em}\n  .lede{margin:0 0 20px; color:var(--muted); font-size:17px; max-width:66ch}\n\n  .def-row{display:grid; grid-template-columns:1.4fr 1fr; gap:14px; margin-bottom:16px}\n  @media (max-width:720px){ .def-row{grid-template-columns:1fr} body{padding:16px} }\n  .def{background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px 20px}\n  .def .term{font-size:16.5px; margin-bottom:8px}\n  .def .term:last-child{margin-bottom:0}\n  .def b{color:var(--shop-ink)}\n  .aside{background:var(--srv); color:var(--srv-text); border-radius:14px; padding:18px 20px; font-size:14px}\n  .aside .big{font-size:26px; display:block; margin-bottom:6px}\n  .aside b{color:#fff; font-weight:500}\n\n  .callout{background:var(--green-soft); border:1px solid #abe4c1; border-left:4px solid var(--green);\n           border-radius:0 12px 12px 0; padding:16px 18px; font-size:16px; margin-bottom:8px}\n  .callout b{display:block; margin-bottom:4px; color:#116932; font-weight:600}\n\n  /* stepper */\n  .stepper{display:flex; position:relative; margin:0 0 16px}\n  .stepper::before{content:''; position:absolute; top:23px; left:13%; right:13%; height:2px; background:var(--line); z-index:0}\n  .step{flex:1; background:none; border:0; cursor:pointer; display:flex; flex-direction:column;\n        align-items:center; gap:9px; padding:4px; font-family:var(--sans)}\n  .step .num{width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center;\n        font-family:var(--mono); font-size:19px; font-weight:600; background:#fff; border:2px solid var(--line);\n        color:var(--muted); transition:transform .15s, background .15s, border-color .15s, color .15s; z-index:1}\n  .step .lbl{font-size:14px; font-weight:500; color:var(--muted); text-align:center; line-height:1.3}\n  .step:hover .num{transform:translateY(-2px)}\n  .step.active .num{background:var(--sacc); border-color:var(--sacc); color:#fff; box-shadow:0 4px 12px rgba(0,0,0,.12)}\n  .step.active .lbl{color:var(--ink); font-weight:600}\n\n  .detail{background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px 22px; border-left:5px solid var(--dacc)}\n  .detail .dq{font-family:var(--mono); font-size:13.5px; color:var(--dacc); margin-bottom:5px}\n  .detail h3{font-size:20px; font-weight:600; margin:0 0 9px}\n  .detail p{font-size:15.5px; margin:0 0 12px}\n  .detail .ex{background:#f6f8fa; border:1px solid var(--line); border-radius:10px; padding:11px 14px; font-size:14.5px; color:var(--muted)}\n  .detail .ex b{color:var(--ink); font-weight:500}\n  .detail .loop{margin:12px 0 0; font-size:13.5px; color:var(--muted)}\n\n  /* compare */\n  .compare{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px}\n  @media (max-width:720px){ .compare{grid-template-columns:1fr} }\n  .req{border-radius:14px; padding:16px 18px; font-size:15px}\n  .req .rhead{font-weight:600; font-size:15px; margin-bottom:8px; display:flex; align-items:center; gap:7px}\n  .req .quote{font-size:15px; line-height:1.55}\n  .req.bad{background:var(--red-soft); border:1px solid #f6b8b8}\n  .req.bad .rhead{color:var(--red)}\n  .req.good{background:var(--green-soft); border:1px solid #abe4c1}\n  .req.good .rhead{color:#116932}\n  .elements{background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px 18px; font-size:15px}\n  .elements b{font-weight:600}\n  .elements ol{margin:8px 0 0; padding-left:20px}\n  .elements li{margin:4px 0}\n\n  .cta{background:var(--srv); color:#fff; border-radius:16px; padding:20px 22px; margin-top:26px}\n  .cta h3{margin:0 0 6px; font-size:18px; font-weight:600}\n  .cta p{margin:0; color:var(--srv-text); font-size:15px}\n\n  @media (prefers-reduced-motion: reduce){ .step .num{transition:none} .step:hover .num{transform:none} }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n  \u003cspan class=\"tag\">디버깅\u003c/span>\n  \u003ch1>버그를 찾아 고치는 법 — 디버깅\u003c/h1>\n  \u003cp class=\"lede\">코드를 만들다 보면 오류(버그)는 반드시 생깁니다. 중요한 건 그걸 침착하게 찾아 고치는 방법이에요. 아래 4단계를 눌러가며 익혀 보세요.\u003c/p>\n\n  \u003cdiv class=\"def-row\">\n    \u003cdiv class=\"def\">\n      \u003cdiv class=\"term\">\u003cb>버그(bug)\u003c/b> — 코드에 생긴 오류. 원하는 대로 동작하지 않는 부분.\u003c/div>\n      \u003cdiv class=\"term\">\u003cb>디버깅(debugging)\u003c/b> — 그 버그를 찾아서 고치는 과정.\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"aside\">\n      \u003cspan class=\"big\">🐛\u003c/span>\n      1947년, 초창기 컴퓨터에 진짜 \u003cb>나방(bug)\u003c/b>이 끼어 오작동한 일이 있었어요. 그걸 꺼내 고친 데서 \"버그를 없앤다 = 디버깅\"이라는 말이 유명해졌습니다.\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"callout\">\n    \u003cb>버그는 실패가 아니에요.\u003c/b>\n    프로 개발자도 하루의 상당 시간을 디버깅에 씁니다. 오류가 났다는 건 잘못한 게 아니라, 무언가를 만들고 있다는 증거예요. 당황하지 말고 하나씩 따라가면 됩니다.\n  \u003c/div>\n\n  \u003ch2>디버깅 4단계\u003c/h2>\n  \u003cdiv class=\"stepper\" id=\"stepper\">\u003c/div>\n  \u003cdiv class=\"detail\" id=\"detail\">\u003c/div>\n\n  \u003ch2>AI에게 버그를 잘 넘기는 법\u003c/h2>\n  \u003cdiv class=\"compare\">\n    \u003cdiv class=\"req bad\">\n      \u003cdiv class=\"rhead\">❌ 막연한 요청\u003c/div>\n      \u003cdiv class=\"quote\">\"안 돼요.\"\u003cbr>\"이거 좀 고쳐줘.\"\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"req good\">\n      \u003cdiv class=\"rhead\">✅ 좋은 요청\u003c/div>\n      \u003cdiv class=\"quote\">\"이름을 눌러도 별 숫자가 0 그대로야. 별을 더하는 부분을 찾아서 고쳐줘. 어디를 바꿨는지도 알려줘.\"\u003c/div>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"elements\">\n    \u003cb>좋은 요청에는 세 가지가 들어갑니다.\u003c/b>\n    \u003col>\n      \u003cli>증상을 \u003cb>구체적으로\u003c/b> — \"안 돼요\"가 아니라 \"눌러도 숫자가 0 그대로야\"\u003c/li>\n      \u003cli>짐작되는 \u003cb>위치\u003c/b> — \"별을 더하는 부분\", \"색이 투명한 것 같아\"\u003c/li>\n      \u003cli>고친 곳을 \u003cb>설명해달라\u003c/b> — 다음엔 스스로 찾을 수 있도록\u003c/li>\n    \u003c/ol>\n  \u003c/div>\n\n  \u003cdiv class=\"cta\">\n    \u003ch3>이제 직접 해볼 차례예요\u003c/h3>\n    \u003cp>코드 고치기 실습판에서 버그를 찾아 고쳐 보세요. 제대로 고치면 \"성공!\" 표시가 뜹니다. 4단계를 그대로 따라가 보면 됩니다.\u003c/p>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>\n  var STEPS = [\n    { n:1, acc:'#f76707', lbl:'증상 확인', q:'무엇이 잘못됐지?',\n      desc:'먼저 정확히 무엇이 안 되는지 눈으로 관찰합니다. \"그냥 안 돼요\"가 아니라, 화면에서 무슨 일이 일어나는지(또는 일어나지 않는지) 구체적으로 봅니다.',\n      ex:'예) 학생 이름을 눌러도 별 숫자가 0에서 안 올라간다. 버튼은 눌리는데 숫자만 그대로다.', loop:'' },\n    { n:2, acc:'#f76707', lbl:'위치 좁히기', q:'어디가 문제지?',\n      desc:'HTML(내용)·CSS(모양)·JavaScript(동작) 중 어느 층의 문제인지 좁힙니다. 이 한 걸음이 디버깅에서 가장 중요해요. 범위를 좁힐수록 고치기 쉬워집니다.',\n      ex:'예) 숫자가 안 바뀌니 \"동작(JavaScript)\" 문제일 가능성이 크다. 반대로 글씨·별이 안 보이면 \"모양(CSS)\" 문제다.', loop:'' },\n    { n:3, acc:'#2563a8', lbl:'고치기', q:'어떻게 고칠까?',\n      desc:'직접 고치거나, AI에게 구체적으로 요청합니다. 앞에서 좁혀둔 위치를 함께 알려주면 훨씬 정확하게 고쳐줘요. (아래 \"AI에게 잘 넘기는 법\" 참고)',\n      ex:'예) \"별을 더하는 부분에서 숫자가 저장이 안 되는 것 같아. 찾아서 고쳐줘.\"', loop:'' },\n    { n:4, acc:'#16a34a', lbl:'확인', q:'정말 됐나?',\n      desc:'고친 뒤 반드시 다시 해봅니다. 증상이 사라졌으면 성공이에요. 아직 그대로라면 당황하지 말고 1단계로 돌아가 다시 관찰합니다.',\n      ex:'예) 이름을 다시 눌러 별 숫자가 1, 2, 3 올라가는지 확인한다.',\n      loop:'↩ 아직 안 됐다면? → 1단계(증상 확인)로 돌아가 다시 좁혀 봅니다. 디버깅은 이 4단계를 반복하는 과정이에요.' }\n  ];\n\n  var stepper = document.getElementById('stepper');\n  var detail = document.getElementById('detail');\n  var current = 0;\n\n  STEPS.forEach(function(s, i){\n    var b = document.createElement('button');\n    b.className = 'step';\n    b.style.setProperty('--sacc', s.acc);\n    b.innerHTML = '\u003cspan class=\"num\">' + s.n + '\u003c/span>\u003cspan class=\"lbl\">' + s.lbl + '\u003c/span>';\n    b.onclick = function(){ select(i); };\n    stepper.appendChild(b);\n  });\n\n  function select(i){\n    current = i;\n    var s = STEPS[i];\n    document.querySelectorAll('.step').forEach(function(el, idx){\n      el.classList.toggle('active', idx===i);\n    });\n    detail.style.setProperty('--dacc', s.acc);\n    detail.innerHTML =\n      '\u003cdiv class=\"dq\">' + s.n + '단계 · ' + s.q + '\u003c/div>' +\n      '\u003ch3>' + s.lbl + '\u003c/h3>' +\n      '\u003cp>' + s.desc + '\u003c/p>' +\n      '\u003cdiv class=\"ex\">\u003cb>' + s.ex.split(')')[0] + ')\u003c/b>' + s.ex.split(')').slice(1).join(')') + '\u003c/div>' +\n      (s.loop ? '\u003cp class=\"loop\">' + s.loop + '\u003c/p>' : '');\n  }\n\n  select(0);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "height": 700}]}, {"id": "debug-css", "title": "디버깅 실습 (CSS)", "parent": "debug", "tag": "", "desc": "", "blocks": [{"t": "h", "text": "디버깅 실습"}, {"t": "p", "text": "칭찬 스티커판을 켰는데 화면이 허전해요. 상단 '총 수여된 스티커' 글씨가 안 보이고, 학생을 눌러도 별(⭐)이 화면에 나타나지 않습니다. 박스와 숫자 배지는 있는데 글씨와 별만 사라진 것 같아요. AI를 활용해서 왼쪽 코드를 수정--> 왼쪽에 붙여넣기 하면 오른쪽 웹앱의 오류가 수정됩니다."}, {"t": "html", "title": "코드 고치기 — 칭찬 스티커판 (CSS)", "code": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>코드 고치기 — 칭찬 스티커판 (CSS)\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n  :root{\n    --ink:#16202b; --muted:#5b6b7b; --paper:#ffffff; --stage:#e7ecf1; --line:#d7dee6;\n    --shop:#f76707; --srv:#0e131b; --srv-2:#1d2632; --srv-line:#2d3a49; --srv-text:#e6ecf3; --srv-dim:#7c8ba0;\n    --sans:'IBM Plex Sans KR', system-ui, -apple-system, sans-serif;\n    --mono:'IBM Plex Mono', ui-monospace, monospace;\n  }\n  *{box-sizing:border-box}\n  body{margin:0; background:var(--stage); color:var(--ink); font-family:var(--sans);\n       line-height:1.55; padding:22px; -webkit-font-smoothing:antialiased}\n  .wrap{max-width:1180px; margin:0 auto}\n  h1{font-size:24px; font-weight:600; margin:0 0 6px; letter-spacing:-.01em}\n  .lede{margin:0 0 16px; color:var(--muted); font-size:15px; max-width:72ch}\n  .toolbar{display:flex; align-items:center; gap:10px; margin-bottom:14px}\n  .spacer{flex:1}\n  .btn{font-family:var(--sans); font-size:14px; font-weight:500; padding:9px 16px; border:0;\n       border-radius:10px; cursor:pointer; transition:filter .12s}\n  .btn:hover{filter:brightness(.95)}\n  .btn.run{background:var(--shop); color:#fff}\n  .btn.ghost{background:#fff; color:var(--ink); border:1px solid var(--line)}\n  .status{padding:12px 16px; border-radius:11px; font-weight:600; font-size:15px; margin-bottom:14px;\n          border:1px solid; transition:background .15s, color .15s, border-color .15s; display:flex; align-items:center; gap:8px}\n  .status.todo{background:#fff4e6; color:#9a3d04; border-color:#f7c9ac}\n  .status.done{background:#e9f9ef; color:#116932; border-color:#abe4c1}\n  .panels{display:grid; grid-template-columns:1fr 1fr; gap:14px}\n  @media (max-width:820px){ .panels{grid-template-columns:1fr} body{padding:15px} }\n  .panel{display:flex; flex-direction:column; border:1px solid var(--line); border-radius:14px;\n         overflow:hidden; height:72vh; min-height:500px}\n  @media (max-width:820px){ .panel{height:54vh; min-height:350px} }\n  .phead{display:flex; align-items:center; gap:8px; padding:11px 15px; font-weight:600; font-size:14px; flex:none}\n  .phead .dot{width:10px; height:10px; border-radius:50%}\n  .phead small{font-weight:400; font-size:12px}\n  .pbody{flex:1; min-height:0}\n  .panel.code{border-color:var(--srv-line)}\n  .panel.code .phead{background:var(--srv-2); color:#eef3f8; border-bottom:1px solid var(--srv-line)}\n  .panel.code .phead small{color:var(--srv-dim)}\n  #editor{width:100%; height:100%; border:0; outline:0; resize:none; display:block;\n          background:var(--srv); color:var(--srv-text); font-family:var(--mono); font-size:13px;\n          line-height:1.6; padding:14px 16px; tab-size:2; white-space:pre; overflow:auto}\n  .panel.view .phead{background:#f2f4f7; color:var(--ink); border-bottom:1px solid var(--line)}\n  .panel.view .phead small{color:var(--muted)}\n  #frame{width:100%; height:100%; border:0; background:#fff; display:block}\n  .hint{margin-top:14px; font-size:13px; color:var(--muted); background:#fff; border:1px solid var(--line);\n        border-left:4px solid var(--shop); border-radius:0 12px 12px 0; padding:12px 15px}\n  .hint b{color:var(--ink)}\n  kbd{font-family:var(--mono); font-size:11.5px; background:#eef1f4; border:1px solid var(--line);\n      border-radius:5px; padding:1px 6px}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n  \u003ch1>코드 고치기 — 칭찬 스티커판\u003c/h1>\n  \u003cp class=\"lede\">왼쪽 코드를 고치면 오른쪽 화면이 그대로 바뀝니다. 코드를 정상으로 고치면 위에 성공 표시가 떠요. \u003ckbd>실행\u003c/kbd> 또는 \u003ckbd>Ctrl\u003c/kbd>+\u003ckbd>Enter\u003c/kbd>로 바로 반영, \u003ckbd>처음으로\u003c/kbd>로 되돌리기.\u003c/p>\n  \u003cdiv class=\"toolbar\">\n    \u003cspan class=\"spacer\">\u003c/span>\n    \u003cbutton class=\"btn ghost\" onclick=\"resetCode()\">↺ 처음으로\u003c/button>\n    \u003cbutton class=\"btn run\" onclick=\"run()\">▶ 실행\u003c/button>\n  \u003c/div>\n  \u003cdiv id=\"status\" class=\"status todo\">\u003c/div>\n  \u003cdiv class=\"panels\">\n    \u003cdiv class=\"panel code\">\n      \u003cdiv class=\"phead\">\u003cspan class=\"dot\" style=\"background:#7c5cff\">\u003c/span>코드 \u003csmall>· 여기를 고쳐 보세요 (전체 코드)\u003c/small>\u003c/div>\n      \u003cdiv class=\"pbody\">\u003ctextarea id=\"editor\" spellcheck=\"false\" autocapitalize=\"off\" autocomplete=\"off\">&lt;!DOCTYPE html&gt;\n&lt;html lang=\"ko\"&gt;\n&lt;head&gt;\n    &lt;meta charset=\"UTF-8\"&gt;\n    &lt;meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"&gt;\n    &lt;title&gt;우리 반 칭찬 스티커판&lt;/title&gt;\n    &lt;!-- Tailwind CSS for utility styling --&gt;\n    &lt;script src=\"https://cdn.tailwindcss.com\"&gt;&lt;/script&gt;\n    &lt;!-- Google Fonts: Jua &amp; Noto Sans KR for friendly classroom typography --&gt;\n    &lt;link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"&gt;\n    &lt;link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin&gt;\n    &lt;link href=\"https://fonts.googleapis.com/css2?family=Jua&amp;family=Noto+Sans+KR:wght@400;600;700;900&amp;display=swap\" rel=\"stylesheet\"&gt;\n    &lt;!-- FontAwesome Icons --&gt;\n    &lt;link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css\"&gt;\n    &lt;!-- Canvas Confetti Library --&gt;\n    &lt;script src=\"https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js\"&gt;&lt;/script&gt;\n\n    &lt;style&gt;\n        body {\n            font-family: 'Jua', 'Noto Sans KR', sans-serif;\n            background-color: #f0f9ff;\n            background-image: radial-gradient(#e0f2fe 2px, transparent 2px);\n            background-size: 24px 24px;\n        }\n\n        .star-item {\n            display: inline-block;\n            user-select: none;\n            opacity: 0; /* 버그: 별 스티커가 완전 투명(opacity 0)이라 화면에 안 보임 */\n        }\n\n        @keyframes popIn {\n            0% { transform: scale(0) rotate(-45deg); opacity: 0; }\n            80% { transform: scale(1.3) rotate(10deg); }\n            100% { transform: scale(1) rotate(0deg); opacity: 1; }\n        }\n\n        .student-card {\n            transition: all 0.2s ease;\n        }\n\n        .student-card:hover {\n            transform: translateY(-4deg);\n        }\n\n        .student-card:active {\n            transform: scale(0.98);\n        }\n\n        /* Custom scrollbar for star container */\n        .star-box::-webkit-scrollbar {\n            height: 6px;\n            width: 6px;\n        }\n        .star-box::-webkit-scrollbar-thumb {\n            background-color: #cbd5e1;\n            border-radius: 9999px;\n        }\n\n        /* TV Display Optimized Font Scaling */\n        .tv-title {\n            text-shadow: 2px 2px 0px rgba(0,0,0,0.06);\n        }\n\n        /* Custom Modal Backdrop Blur */\n        .backdrop-blur-custom {\n            backdrop-filter: blur(8px);\n        }\n    &lt;/style&gt;\n&lt;/head&gt;\n&lt;body class=\"min-h-screen text-slate-800 flex flex-col justify-between p-3 sm:p-6 select-none\"&gt;\n\n    &lt;!-- Top Header Navigation Bar --&gt;\n    &lt;header class=\"bg-white/90 backdrop-blur-md rounded-3xl p-4 md:p-5 shadow-lg border-2 border-sky-100 mb-5 flex flex-col md:flex-row items-center justify-between gap-4\"&gt;\n\n        &lt;!-- Class Title Header --&gt;\n        &lt;div class=\"flex items-center gap-3\"&gt;\n            &lt;div class=\"w-12 h-12 md:w-14 md:h-14 bg-amber-400 text-white rounded-2xl flex items-center justify-center text-2xl md:text-3xl shadow-md transform -rotate-3\"&gt;\n                ⭐\n            &lt;/div&gt;\n            &lt;div&gt;\n                &lt;div class=\"flex items-center gap-2\"&gt;\n                    &lt;h1 id=\"classNameDisplay\" class=\"text-2xl md:text-4xl font-extrabold text-sky-900 tv-title tracking-wide\"&gt;\n                        3학년 1반 칭찬 스티커판\n                    &lt;/h1&gt;\n                    &lt;button onclick=\"editClassName()\" title=\"학급 이름 수정\" class=\"text-slate-400 hover:text-sky-600 transition text-sm\"&gt;\n                        &lt;i class=\"fa-solid fa-pen\"&gt;&lt;/i&gt;\n                    &lt;/button&gt;\n                &lt;/div&gt;\n                &lt;p id=\"currentDateDisplay\" class=\"text-xs md:text-sm text-slate-500 font-sans font-medium\"&gt;오늘도 차근차근 꿈을 향해 가요!&lt;/p&gt;\n            &lt;/div&gt;\n        &lt;/div&gt;\n\n        &lt;!-- TV Quick Toolbar Options --&gt;\n        &lt;div class=\"flex flex-wrap items-center gap-2 sm:gap-3\"&gt;\n\n            &lt;!-- Sticker Type Selector --&gt;\n            &lt;div class=\"bg-sky-50 p-1.5 rounded-2xl border border-sky-200 flex items-center gap-1\"&gt;\n                &lt;span class=\"text-xs font-bold text-sky-700 ml-1.5 hidden sm:inline\"&gt;스티커:&lt;/span&gt;\n                &lt;button onclick=\"setStickerType('⭐')\" id=\"sticker-⭐\" class=\"sticker-btn px-2.5 py-1 rounded-xl bg-white shadow-sm font-bold text-lg hover:scale-110 transition\"&gt;⭐&lt;/button&gt;\n                &lt;button onclick=\"setStickerType('💮')\" id=\"sticker-💮\" class=\"sticker-btn px-2.5 py-1 rounded-xl hover:bg-white/60 font-bold text-lg hover:scale-110 transition\"&gt;💮&lt;/button&gt;\n                &lt;button onclick=\"setStickerType('❤️')\" id=\"sticker-❤️\" class=\"sticker-btn px-2.5 py-1 rounded-xl hover:bg-white/60 font-bold text-lg hover:scale-110 transition\"&gt;❤️&lt;/button&gt;\n                &lt;button onclick=\"setStickerType('👑')\" id=\"sticker-👑\" class=\"sticker-btn px-2.5 py-1 rounded-xl hover:bg-white/60 font-bold text-lg hover:scale-110 transition\"&gt;👑&lt;/button&gt;\n                &lt;button onclick=\"setStickerType('🌈')\" id=\"sticker-🌈\" class=\"sticker-btn px-2.5 py-1 rounded-xl hover:bg-white/60 font-bold text-lg hover:scale-110 transition\"&gt;🌈&lt;/button&gt;\n            &lt;/div&gt;\n\n            &lt;!-- Sound Toggle Button --&gt;\n            &lt;button id=\"soundToggleBtn\" onclick=\"toggleSound()\" class=\"bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2.5 rounded-2xl font-bold flex items-center gap-2 text-sm transition\"&gt;\n                &lt;i id=\"soundIcon\" class=\"fa-solid fa-volume-high text-sky-600\"&gt;&lt;/i&gt;\n                &lt;span class=\"hidden lg:inline\"&gt;소리&lt;/span&gt;\n            &lt;/button&gt;\n\n            &lt;!-- Random Student Picker Button --&gt;\n            &lt;button onclick=\"openRandomPicker()\" class=\"bg-gradient-to-r from-purple-500 to-indigo-600 hover:from-purple-600 hover:to-indigo-700 text-white px-4 py-2.5 rounded-2xl font-bold shadow-md hover:shadow-lg flex items-center gap-2 text-sm md:text-base transition transform hover:-translate-y-0.5\"&gt;\n                &lt;i class=\"fa-solid fa-dice text-amber-300 text-lg\"&gt;&lt;/i&gt;\n                &lt;span&gt;랜덤 추첨&lt;/span&gt;\n            &lt;/button&gt;\n\n            &lt;!-- Edit Students Roster Modal Opener --&gt;\n            &lt;button onclick=\"openStudentModal()\" class=\"bg-emerald-500 hover:bg-emerald-600 text-white px-3.5 py-2.5 rounded-2xl font-bold shadow-md hover:shadow-lg flex items-center gap-2 text-sm transition\"&gt;\n                &lt;i class=\"fa-solid fa-users-gear\"&gt;&lt;/i&gt;\n                &lt;span class=\"hidden sm:inline\"&gt;명단 관리&lt;/span&gt;\n            &lt;/button&gt;\n\n            &lt;!-- Fullscreen Toggle --&gt;\n            &lt;button onclick=\"toggleFullscreen()\" title=\"전체화면\" class=\"bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2.5 rounded-2xl font-bold transition text-sm\"&gt;\n                &lt;i class=\"fa-solid fa-expand\"&gt;&lt;/i&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/header&gt;\n\n    &lt;!-- Action Bar &amp; Stats Summary --&gt;\n    &lt;div class=\"max-w-7xl mx-auto w-full mb-4 flex flex-col sm:flex-row items-center justify-between gap-3 bg-white/60 p-3 rounded-2xl border border-sky-100\"&gt;\n\n        &lt;!-- Total Stars Counted --&gt;\n        &lt;div class=\"flex items-center gap-4\"&gt;\n            &lt;div class=\"flex items-center gap-2 bg-amber-100/80 px-3.5 py-1.5 rounded-xl border border-amber-200 text-white font-bold text-sm md:text-base\"&gt;\n                &lt;span&gt;총 수여된 스티커:&lt;/span&gt;\n                &lt;span id=\"totalStarsCount\" class=\"text-xl font-extrabold text-white\"&gt;0&lt;/span&gt;개\n            &lt;/div&gt;\n            &lt;div class=\"text-xs sm:text-sm text-slate-500 font-sa
